# Läuft bei jedem Pull Request und bei jedem Stand auf main:
# baut die App, prüft, dass index.html zum Quelltext passt, und lässt alle Tests laufen.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright mit Chromium installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Bauen; index.html muss zum Quelltext passen
        run: |
          ./build.sh
          git diff --exit-code -- index.html
      - name: Alle Tests
        run: node tests/run.js
