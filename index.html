<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Trainingsplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* =====================================================================
     Designsystem „Werkbank“
     Wie die Geräte selbst: Stahl und Signalgelb, kantige Flächen, Schablonenschrift
     für Überschriften, Monoschrift wie auf Geräteplaketten. Eine gelbe Hauptaktion je
     Ansicht (mit Warnstreifen), im Training fest im Daumenbereich (über der Tastatur).
     ===================================================================== */
  :root{
    /* Farben (dunkel = Standard): Stahl und Signalgelb */
    --bg:#121212; --raise:#1C1C1C; --raise-2:#272727; --raise-3:#343434;
    --hair:rgba(255,255,255,.12); --text:#F2F2F0; --text-2:#BDBDB8; --text-3:#9A9A95;
    --mbody:#D9A585; --mbody2:#AE7C5F; --mhair:#2B211B; --mshorts:#5B5F64; --hero-hi:#2E2E2B; --mgear-line:#7A7A74; --mhot:#F0483A; --mframe:#CFCFCA; --mpad:#0C0C0C;
    --accent:#FFD21F; --accent-press:#E9BE00; --accent-stripe:#F2C200; --accent-tint:rgba(255,210,31,.12); --on-accent:#111111; --accent-ink:#FFD21F;
    --ok:#3CCB7F; --ok-tint:rgba(60,203,127,.14); --warn:#FF8A3D; --warn-tint:rgba(255,138,61,.13); --bad:#FF6A61;
    --fig:#262626; --muscle:#3A3A3A; --band:rgba(255,255,255,.10); --scrim:rgba(0,0,0,.62);
    --bar-bg:rgba(18,18,18,.9); --accent-soft:rgba(255,210,31,.42); --sheet:#1C1C1C; --seg-on:#3A3A3A;
    /* Schrift */
    --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
    --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    /* Raster (4er-Schritte), kantige Formen */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
    --r-sm:2px; --r:3px; --r-lg:4px; --r-xl:6px;
    --gutter:20px; --tap:48px;
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
    --bg:#ECEBE7; --raise:#F7F6F3; --raise-2:#E0DFDA; --raise-3:#D1D0CA;
    --hair:rgba(17,17,17,.13); --text:#111111; --text-2:#3E3E3A; --text-3:#5A5A55;
    --accent:#FFC800; --accent-press:#E6B400; --accent-stripe:#F0BA00; --accent-tint:rgba(255,200,0,.2); --on-accent:#111111; --accent-ink:#6B5000;
    --ok:#0E6A34; --ok-tint:rgba(14,106,52,.12); --warn:#9C3C08; --warn-tint:rgba(156,60,8,.12); --bad:#AE2421;
    --fig:#DCDBD5; --muscle:#C4C3BC; --band:rgba(17,17,17,.10); --scrim:rgba(17,17,17,.38);
    --bar-bg:rgba(236,235,231,.92); --accent-soft:rgba(255,200,0,.5); --sheet:#F7F6F3; --seg-on:#FFFFFF; color-scheme:light;
    --mbody:#D6A080; --mbody2:#C08B6C; --mhair:#2B211B; --mshorts:#5B5F64; --hero-hi:#FFFFFF; --mgear-line:#8C8C86; --mhot:#D8382B; --mframe:#FFFFFF; --mpad:#2A2A28}
    :root:not([data-theme="dark"]) .motion.b-hs{--mframe:#262624;--mgear-line:#0C0C0C;--mpad:#4B4B47}}
  :root[data-theme="light"] .motion.b-hs{--mframe:#262624;--mgear-line:#0C0C0C;--mpad:#4B4B47}
  :root[data-theme="light"]{
    --bg:#ECEBE7; --raise:#F7F6F3; --raise-2:#E0DFDA; --raise-3:#D1D0CA;
    --hair:rgba(17,17,17,.13); --text:#111111; --text-2:#3E3E3A; --text-3:#5A5A55;
    --accent:#FFC800; --accent-press:#E6B400; --accent-stripe:#F0BA00; --accent-tint:rgba(255,200,0,.2); --on-accent:#111111; --accent-ink:#6B5000;
    --ok:#0E6A34; --ok-tint:rgba(14,106,52,.12); --warn:#9C3C08; --warn-tint:rgba(156,60,8,.12); --bad:#AE2421;
    --fig:#DCDBD5; --muscle:#C4C3BC; --band:rgba(17,17,17,.10); --scrim:rgba(17,17,17,.38);
    --bar-bg:rgba(236,235,231,.92); --accent-soft:rgba(255,200,0,.5); --sheet:#F7F6F3; --seg-on:#FFFFFF; color-scheme:light;
    --mbody:#D6A080; --mbody2:#C08B6C; --mhair:#2B211B; --mshorts:#5B5F64; --hero-hi:#FFFFFF; --mgear-line:#8C8C86; --mhot:#D8382B; --mframe:#FFFFFF; --mpad:#2A2A28}

  /* ---------- Grundlage ---------- */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;
    padding-left:max(var(--gutter), env(safe-area-inset-left, 0px));padding-right:max(var(--gutter), env(safe-area-inset-right, 0px));
    padding-block:var(--s4) 120px;max-width:600px;margin:0 auto;font-variant-numeric:tabular-nums}
  body.training{padding-bottom:132px}
  body.has-bar{padding-bottom:180px}
  p{margin:0}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
  button:disabled{opacity:.38;cursor:default}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
  [hidden]{display:none!important}
  svg{flex:0 0 auto}

  /* ---------- Werkbank: Schablone, Plakette, Warnstreifen ---------- */
  .title,.hero-name,h1,h2{text-transform:uppercase;letter-spacing:.025em}
  h2.h3{text-transform:none;letter-spacing:0}
  .head .cap::before{content:"// ";color:var(--accent-ink)}

  /* ---------- Typografie ---------- */
  .cap{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
  h1.cap{font-family:var(--mono);line-height:inherit}
  .label{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
  .title{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:.005em;margin:var(--s1) 0 0;text-wrap:balance}
  .hero-name{font-family:var(--display);font-weight:800;font-size:clamp(34px, 11vw, 48px);line-height:.95;margin:0;text-wrap:balance;overflow-wrap:break-word;hyphens:auto}
  h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.02;margin:0;text-wrap:balance}
  h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;margin:0;text-wrap:balance}
  h3{font-size:17px;font-weight:600;margin:0;line-height:1.3}
  h2.h3{font-family:var(--body);font-size:17px;font-weight:600;line-height:1.3}
  .sub{font-size:15px;color:var(--text-2)}
  .small{font-size:14px}
  .muted{color:var(--text-2)}
  .faint{color:var(--text-3)}
  .num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .error{color:var(--bad);font-size:14px;font-weight:500}

  /* ---------- Layout ---------- */
  .page{display:grid;gap:var(--s6)}
  .stack{display:grid;gap:var(--s3)}
  .stack-sm{display:grid;gap:var(--s2)}
  .row{display:flex;align-items:center;gap:var(--s3);min-width:0}
  .row>.grow,.grow{flex:1;min-width:0}
  .between{justify-content:space-between}
  .wrap{flex-wrap:wrap}
  .head{display:grid;gap:var(--s1)}
  .head.home .title{font-size:28px}
  .section{display:grid;gap:var(--s3)}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
  .section-head h2{font-size:22px}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s5);
    border-radius:var(--r);font-weight:600;font-size:16px;background:var(--raise-2);color:var(--text);transition:transform .08s,background .15s}
  .btn:active:not(:disabled){transform:scale(.98)}
  .btn.primary{background:repeating-linear-gradient(-45deg,var(--accent) 0 18px,var(--accent-stripe) 18px 36px);color:var(--on-accent);
    text-transform:uppercase;letter-spacing:.06em;font-weight:700;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)}
  .btn.primary:active:not(:disabled){background:var(--accent-press);box-shadow:none}
  .btn.block{width:100%}
  .btn.xl{min-height:58px;font-size:18px;border-radius:var(--r-lg)}
  .btn.sm{min-height:44px;padding:0 var(--s4);font-size:15px;border-radius:var(--r)}
  .btn.danger{color:var(--bad)}
  .btn.quiet{background:transparent;color:var(--text-2)}
  .link{color:var(--accent-ink);font-weight:600;min-height:44px;min-width:44px;display:inline-flex;align-items:center}
  p .link{min-height:0;min-width:0}
  .icon-btn{width:44px;height:44px;border-radius:var(--r);background:var(--raise-2);display:inline-grid;place-items:center;flex:0 0 auto;color:var(--text)}
  .icon-btn.plain{background:transparent}

  /* Feste Aktionsleiste im Daumenbereich (folgt der Tastatur) */
  .actionbar{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:25;background:var(--bar-bg);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    padding:var(--s3) max(var(--gutter), env(safe-area-inset-right, 0px)) calc(var(--s3) + env(safe-area-inset-bottom, 0px)) max(var(--gutter), env(safe-area-inset-left, 0px))}
  .actionbar .in{max-width:calc(600px - 2 * var(--gutter));margin:0 auto;display:grid;gap:var(--s2)}

  /* ---------- Chips, Badges, Segment ---------- */
  .chips{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gutter));padding:0 var(--gutter)}
  .chips::-webkit-scrollbar{display:none}
  .chips.wrap{flex-wrap:wrap;margin:0;padding:0}
  .chip{min-height:40px;padding:0 var(--s4);border-radius:var(--r);background:var(--raise-2);font-size:15px;font-weight:600;white-space:nowrap;color:var(--text-2)}
  .chip.on{background:var(--text);color:var(--bg)}
  .badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:var(--r-sm);background:var(--raise-2);color:var(--text-2);white-space:nowrap}
  .badge.fav{background:var(--accent);color:var(--on-accent)}
  .badge.up{background:var(--ok-tint);color:var(--ok)}
  .badge.pr{background:var(--accent-tint);color:var(--accent-ink)}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--raise-2);padding:3px;border-radius:var(--r)}
  .seg button{min-height:44px;border-radius:var(--r-sm);font-weight:600;font-size:15px;color:var(--text-2);text-align:center}
  .seg button.on{background:var(--seg-on);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.18)}

  /* ---------- Gruppierte Listen ---------- */
  .group{background:var(--raise);border-radius:var(--r-lg);overflow:hidden;box-shadow:inset 0 0 0 1px var(--hair)}
  .li{display:flex;align-items:center;gap:var(--s3);min-height:56px;padding:var(--s3) var(--s4);width:100%;text-align:left;position:relative;min-width:0}
  .group>.li+.li::before,.group>*+.li::before{content:"";position:absolute;top:0;left:var(--s4);right:0;height:1px;background:var(--hair)}
  .li .grow{flex:1;min-width:0}
  .li .t{font-weight:600;font-size:16px}
  .li .s{font-size:14px;color:var(--text-2);margin-top:1px}
  .chev{color:var(--text-3);font-size:20px;line-height:1}
  .plain-list>.li{padding-left:0;padding-right:0}
  .hopen{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;min-height:44px}
  .hopen .t,.hopen .s{display:block}.hopen .row{display:flex}
  .hx-sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .hx-sets .set-pill{flex:0 0 auto;padding:0 12px;min-width:64px}
  .plain-list>.li+.li::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--hair)}

  /* ---------- Formular ---------- */
  input,select{font:inherit;width:100%;min-height:var(--tap);padding:0 var(--s4);border-radius:var(--r);border:1px solid transparent;background:var(--raise-2);color:var(--text)}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  label{display:block;font-size:14px;font-weight:600;color:var(--text-2);margin-bottom:var(--s2)}
  textarea{font:inherit;font-size:12px;width:100%;min-height:96px;padding:var(--s3);border-radius:var(--r);border:1px solid transparent;background:var(--raise-2);color:var(--text);font-family:ui-monospace,Menlo,monospace;word-break:break-all}
  .field{display:grid;gap:var(--s2)}
  .field>label{margin:0}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
  .title-input{font-family:var(--display);font-weight:800;font-size:34px;min-height:52px;padding:0;background:transparent;border:0;border-bottom:1px solid var(--hair);border-radius:0}
  .title-input:focus{border-color:var(--accent)}

  /* ---------- Hinweise ---------- */
  .note{display:grid;gap:var(--s2);padding:var(--s4);border-radius:var(--r-lg);background:var(--raise);box-shadow:inset 0 0 0 1px var(--hair)}
  .note.warn{background:var(--warn-tint)}
  .ins{--sig:var(--accent);display:grid;gap:var(--s2);padding:var(--s4);border-radius:var(--r-lg);background:var(--raise);box-shadow:inset 0 0 0 1px var(--hair)}
  .ins.warn{--sig:var(--warn)} .ins.good{--sig:var(--ok)} .ins.ask{--sig:var(--text-3)}
  .ins .t{font-weight:700;display:flex;align-items:baseline;gap:10px}
  .ins .t::before{content:"";flex:0 0 8px;width:8px;height:8px;border-radius:1px;background:var(--sig);transform:translateY(-1px)}
  .note .cap{color:var(--text-2)}
  .reason{font-size:14px;line-height:1.4;color:var(--text-2)}

  /* ---------- Tab-Leiste ---------- */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar-bg);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    border-top:1px solid var(--hair);display:flex;justify-content:center;
    padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
  nav.tabs .in{display:flex;width:100%;max-width:600px}
  nav.tabs button{flex:1;display:grid;justify-items:center;gap:3px;min-height:50px;padding-top:4px;font-size:11px;font-weight:600;color:var(--text-3);text-align:center}
  nav.tabs button.on{color:var(--accent-ink)}
  nav.tabs svg{width:25px;height:25px}
  @media (min-width:1024px){
    nav.tabs{top:0;right:auto;width:96px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--hair);padding:var(--s6) 8px}
    nav.tabs .in{flex-direction:column;gap:var(--s2)}
    nav.tabs button{flex:0 0 auto;min-height:64px;border-radius:var(--r);font-size:12px}
    nav.tabs button.on{background:var(--accent-tint)}
    nav.tabs button:hover:not(.on){color:var(--text-2)}
    body{padding-bottom:var(--s7);padding-top:var(--s6)}
    body.training{padding-bottom:132px}
  }

  /* ---------- Figur ---------- */
  .fig{display:block;width:100%;height:auto}
  .fig .base{fill:var(--fig)}
  .fig .m{fill:var(--muscle);transition:fill .3s}

  /* ---------- Heute ---------- */
  .hero{display:grid;gap:var(--s5)}
  .hero-top{display:grid;grid-template-columns:minmax(0,1fr) clamp(96px, 30vw, 128px);gap:var(--s4);align-items:center}
  .hero-meta{display:grid;gap:var(--s2);min-width:0}
  .metaline{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);font-size:15px;color:var(--text-2)}
  .metaline b{color:var(--text);font-weight:600}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s2);text-align:center}
  .week .d{display:grid;gap:6px;justify-items:center;font-size:12px;color:var(--text-3);font-weight:600;text-align:center;min-height:44px;border-radius:var(--r-sm)}
  .week .d:active .dot{transform:scale(.94)}
  .week .dot{width:34px;height:34px;border-radius:var(--r);display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--text-2);background:var(--raise)}
  .week .dot.done{background:var(--accent);color:var(--on-accent)}
  .week .wp{font-size:10px;font-weight:600;color:var(--text-3);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2;min-height:12px}
  .week .wp.done{color:var(--text-2)}
  .week .dot.miss{background:transparent;box-shadow:inset 0 0 0 1px var(--raise-3);color:var(--text-3);text-decoration:line-through}
  .week .dot.today{box-shadow:inset 0 0 0 2px var(--text);color:var(--text)}
  .week .dot.done.today{box-shadow:inset 0 0 0 2px var(--on-accent)}
  .week .dot.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent-ink)}
  .week .dot.today.sel{box-shadow:inset 0 0 0 2px var(--text),0 0 0 2px var(--bg),0 0 0 4px var(--accent-ink)}
  .week .dot.done.today.sel{box-shadow:inset 0 0 0 2px var(--on-accent),0 0 0 2px var(--bg),0 0 0 4px var(--accent-ink)}
  .week .d:disabled{opacity:.35}
  .legend{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:13px;color:var(--text-2)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}

  /* ---------- Training ---------- */
  .t-top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:15;background:var(--bg);display:grid;gap:var(--s2);padding:var(--s2) 0 var(--s3);margin-top:calc(-1 * var(--s4))}
  body.training::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:16;background:var(--bg)}
  .t-bar{display:flex;align-items:center;gap:var(--s3)}
  .t-bar .grow{display:grid}
  .t-bar .day{font-weight:600;font-size:15px}
  .t-bar .cnt{font-size:13px;color:var(--text-3)}
  .t-clock{font-family:var(--display);font-weight:700;font-size:22px;color:var(--text-2);min-width:52px;text-align:right;display:grid;justify-items:end;line-height:1;gap:2px}
  .t-clock small{font-family:var(--mono);font-weight:600;font-size:11px;color:var(--text-3);white-space:nowrap}
  @media (max-width:359px){ .t-bar{gap:var(--s2)} .t-bar .icon-btn{width:42px;height:42px} .t-clock{min-width:44px;font-size:20px} }
  .bar{height:3px;background:var(--raise-2);border-radius:var(--r-sm);overflow:hidden}
  .bar>div{height:100%;background:var(--accent);transition:width .35s}
  .bar.ticks{height:6px;border-radius:0;-webkit-mask:repeating-linear-gradient(90deg,#000 0 calc(100% / var(--n) - 2px),transparent calc(100% / var(--n) - 2px) calc(100% / var(--n)));
    mask:repeating-linear-gradient(90deg,#000 0 calc(100% / var(--n) - 2px),transparent calc(100% / var(--n) - 2px) calc(100% / var(--n)))}
  .ex-head{display:grid;gap:var(--s2)}
  .setting{justify-self:start;font-size:15px;color:var(--text-2);min-height:28px}
  .setting b{color:var(--text);font-weight:600}
  .sets{display:flex;gap:6px}
  .set-pill{flex:1;min-width:0;height:40px;border-radius:var(--r);display:grid;place-items:center;background:var(--raise);font-weight:700;font-size:14px;color:var(--text-3)}
  .set-pill.cur{background:var(--raise-2);color:var(--text);box-shadow:inset 0 0 0 2px var(--accent)}
  .set-pill.done{background:var(--ok-tint);color:var(--ok)}

    body: [

  if (!order.length) return 0;
  const first = order.includes(idx) ? idx : order[0];
  const seq = [first, ...order.filter(i => i !== first)];
  let sec = anyDone ? 0 : TIME.warm;
  if (s.phase === "rest" && !s.paused) sec += Math.max(0, (s.restEnd - Date.now()) / 1000);

    const l = list[i], n = open(l);

  items.forEach(it => { const e = ex(it.exId); e.sec.forEach(m => { if (!c[m]) c[m] = "var(--accent-soft)"; }); });
  items.forEach(it => { c[ex(it.exId).muscle] = "var(--accent)"; });
  return c;
}
function recovery() {
  const now = Date.now(), r = {};
  for (const m in MUSCLES) r[m] = 100;
  state.history.forEach(h => {
    const hrs = (now - new Date(h.date).getTime()) / 36e5;
    h.exercises.forEach(x => {
      const e = ex(x.exId);
      const apply = (m, full) => { r[m] = Math.min(r[m], Math.max(0, Math.min(100, hrs / full * 100))); };
      apply(e.muscle, 72); e.sec.forEach(m => apply(m, 48));
    });
  });
  return r;
}

function refreshProg() {
  const s = S(), el = document.querySelector("#app .prog"); if (!s || !el) return;
  const x = s.list[s.idx], pg = progShort(x, ex(x.exId), curSetIdx(x));
  el.className = "prog " + pg.cls;

function progShort(x, e, si) {
  const set = si != null ? x.sets[si] : null, rec = x.rec ? x.rec[si] : null;
  if (set && rec != null && set.kg != null && Math.abs(set.kg - rec) > 1e-9) return { cls: "", arr: "", txt: `Eigenes Gewicht · Empfehlung ${kgTxt(rec)} kg` };
  if (x.short) return { cls: x.mode === "up" ? "up" : x.mode === "down" ? "down" : "", arr: x.mode === "up" ? "↑" : x.mode === "down" ? "↓" : x.mode === "hold" ? "=" : "", txt: x.short };
  if (x.mode === "up") return { cls: "up", arr: "↑", txt: `+${kgTxt(e.step)} kg · ${/leicht/.test(x.why) ? "letztes Mal leicht" : "letztes Mal alles geschafft"}` };
  if (x.mode === "down") return { cls: "down", arr: "↓", txt: `−${kgTxt(e.step)} kg · letztes Mal zu schwer` };
  if (x.mode === "hold") return { cls: "", arr: "=", txt: /schwer/.test(x.why) ? "Gewicht halten · letzter Satz schwer" : "Gewicht halten" };
  if (/Neu an diesem Gerät|Noch keine gültigen/.test(x.why)) return { cls: "", arr: "", txt: "Neues Gerät · Einstiegsgewicht wählen" };
  return { cls: "", arr: "", txt: "Gleiches Gewicht · Ziel +1 Wdh." };
}

// Persönliche Werte an einem Gerät (nur echte, gültige Sätze mit derselben Gewichtsangabe)
function personalStats(id) {
  const u = unitOf(ex(id)), ss = compSessions(id, u);
  if (!ss.length) return null;
  const top = s => Math.max(...s.sets.map(t => t.kg));
  let best = null;
  ss.forEach(s => s.sets.forEach(t => { if (!best || t.kg > best.kg || (t.kg === best.kg && t.reps > best.reps)) best = { kg: t.kg, reps: t.reps, date: s.date }; }));
  return { n: ss.length, first: ss[0], last: ss[ss.length - 1], firstKg: top(ss[0]), lastKg: top(ss[ss.length - 1]), best, u };
}

  const d = Math.round((p.lastKg - p.firstKg) * 100) / 100;

function weekStreak(monday, goal) {
  const counts = {};
  state.history.forEach(h => { const d = new Date(h.date); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); counts[d.getTime()] = (counts[d.getTime()] || 0) + 1; });
  let n = 0; const w = new Date(monday);
  if ((counts[w.getTime()] || 0) >= goal) n++; // laufende Woche zählt nur, wenn schon erreicht
  for (;;) { w.setDate(w.getDate() - 7); if ((counts[w.getTime()] || 0) >= goal) n++; else break; }
  return n;
}

// Letzte Steigerung des Höchstgewichts an einem Gerät (gleiche Gewichtsangabe)
function lastPR() {
  const best = {}; let last = null;
  for (const h of [...state.history].sort((a, b) => new Date(a.date) - new Date(b.date))) for (const x of h.exercises) {
    const v = x.sets.filter(validSet); if (!v.length) continue;
    const k = x.exId + "|" + x.u, m = Math.max(...v.map(s => s.kg));
    if (best[k] !== undefined && m > best[k]) last = { exId: x.exId, name: x.name, from: best[k], kg: m, u: x.u, date: h.date };
    if (best[k] === undefined || m > best[k]) best[k] = m;
  }
  return last;
}

  const d = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(iso).setHours(0, 0, 0, 0)) / 864e5);

}

  const n = data.history.length, cur = state.history.length;

}

const rirTxt = r => r >= 4 ? "4+" : String(r);
const avgReps = s => s.sets.reduce((a, t) => a + t.reps, 0) / s.sets.length;
// Regeln (in dieser Reihenfolge, immer mit Begründung aus den echten Daten):
// 1. Wiederholungsbereich seit letztem Mal geändert → Gewicht halten
// 2. Unterschiedliche Gewichte in den Sätzen → satzweise übernehmen, keine pauschale Steigerung
//    (Ausnahme: im Training per Satz-Coach angepasst und mit dem neuen Gewicht im Ziel → alle Sätze mit dem neuen Gewicht)
// 3. Letzte Einheit unvollständig (weniger Sätze als geplant) → halten; Steigerung nur, wenn die Einheit davor
//    vollständig am oberen Ziel war
// 4. Letzter Satz schwer oder RIR 0 → keine Steigerung; Reduktion nur bei zwei Einheiten in Folge unter dem Ziel
// 5. Heute mehr Sätze geplant als zuletzt gemacht → halten
// 6. Alle Sätze am oberen Ziel → +1 Schritt
// 7. Alle Sätze „leicht“ oder RIR ≥ 3 und mindestens am unteren Ziel → +1 Schritt
// 8. Alle Sätze unter dem Ziel → halten; erst beim zweiten Mal in Folge −1 Schritt
// 9. Sonst Gewicht halten, Ziel je 1 Wiederholung mehr
// Danach: Steigerung, aber letzte Einheit an diesem Gerät 21 Tage oder länger her → halten; 28 Tage oder länger → ein Schritt leichter (Regeln der App)

    return { kg: ls.kg, reps: clampR(ls.reps + plus), done: false }; });

      : `Noch keine gültigen Werte mit „${unit}“. Wähle ein Gewicht, mit dem du ${it.rmax} saubere Wdh. schaffst.`;

    const lastHard = ls.f === "h" || ls.rir === 0;

      why = `Letztes Mal ${lastTxt}: im Training auf ${w(ls.kg)} ${d > 0 ? "gesteigert" : "reduziert"} und damit im Ziel geblieben. Heute alle Sätze mit ${w(ls.kg)}.`;

        why = `Letzter Satz ${hardTxt} (${w(ls.kg)} × ${ls.reps}). Gewicht beibehalten.${below ? " Bleibt es beim nächsten Mal unter dem Ziel, schlägt die App weniger Gewicht vor." : ""}`;

let swapPerm = false, setEdit = null;
// Alternativen nach Eignung: 1. gleiches Muster + gleicher Muskel, 2. Muskel, 3. bevorzugt, 4. bekannt, 5. übrige
const knownDev = id => state.history.some(h => h.exercises.some(x => x.exId === id && x.sets.some(validSet)));
function rankAlternatives(curId, used) {
  const cur = ex(curId), direct = [], other = [];
  for (const e of allEx()) {
    if (e.off || used.has(e.id) || e.id === cur.id || e.muscle !== cur.muscle) continue;
    const same = !!cur.pattern && e.pattern === cur.pattern;
    const rel = !same && !!cur.pattern && !!e.pattern && PATTERNS[cur.pattern].rel.includes(e.pattern);
    const known = knownDev(e.id), twin = sameKind(e, cur);
    const score = (twin ? 40 : 0) + (rel ? 50 : 0) + (e.fav ? 30 : 0) + (known ? 10 : 0);
    let why;
    if (twin) why = `Gleiche Übungsart am Gerät von ${BRAND[e.brand] || "deinem Studio"}. Bewegungsweg und Widerstandsverlauf können sich unterscheiden.`;
    else if (same) why = `Gleiches Bewegungsmuster (${PATTERNS[e.pattern].label}), ebenfalls ${MUSCLES[e.muscle]}. Widerstandsverlauf kann sich unterscheiden.`;
    else if (rel) why = `Trainiert ebenfalls ${MUSCLES[e.muscle]}, aber mit verwandtem Bewegungsmuster (${PATTERNS[e.pattern].label} statt ${PATTERNS[cur.pattern].label}): anderer Belastungsschwerpunkt.`;
    else why = `Trainiert ebenfalls ${MUSCLES[e.muscle]}, aber mit anderer Bewegung${e.pattern ? " (" + PATTERNS[e.pattern].label + ")" : ""}. Keine direkte Alternative.`;
    (same ? direct : other).push({ e, why, known, score, kind: same ? "same" : rel ? "rel" : "other" });
  }
  const by = (a, b) => b.score - a.score || allEx().indexOf(a.e) - allEx().indexOf(b.e);
  direct.sort(by); other.sort(by);
  return { direct, other };
}
function swapSheet() {
  const s = S(), x = s.list[s.idx], cur = ex(x.exId);
  const used = new Set(s.list.map(l => l.exId));
  const { direct, other } = rankAlternatives(cur.id, used);
  const row = (a, kind) => { const e = a.e, lp = lastPerf(e.id);
    return `<button class="li swap-row" data-a="swap" data-id="${e.id}" data-kind="${kind}">
      <span class="thumbbox" aria-hidden="true">${motionSvg(e.id, { cls: "thumb", anim: kind === "direct" })}</span>
      <div class="grow"><div class="row wrap" style="gap:6px"><span class="t">${esc(e.name)}</span>${e.fav ? `<span class="badge fav">Bevorzugt</span>` : ""}</div>

        <div class="small" style="margin-top:4px;color:${lp ? "var(--text)" : "var(--text-3)"}">${lp ? `Zuletzt ${kgTxt(Math.max(...lp.map(t => t.kg)))} ${unitTxt(e)}` : "Noch nie genutzt: mit kontrollierbarem Einstiegsgewicht beginnen"}</div></div></button>`; };
  return `${sheetHead(`${esc(cur.name)} besetzt?`, "Abbrechen")}
    <div class="seg"><button data-a="swapMode" data-v="0" class="${swapPerm ? "" : "on"}">Nur heute</button><button data-a="swapMode" data-v="1" class="${swapPerm ? "on" : ""}">Auch im Plan</button></div>
    <div class="stack-sm"><div class="cap">Direkte Alternative${cur.pattern ? " · " + PATTERNS[cur.pattern].label : ""}</div>
    ${direct.length ? `<p class="small faint" style="margin:0">Gleiches Bewegungsmuster; der Widerstandsverlauf kann sich unterscheiden – Gewichte werden nicht übertragen.</p>` : ""}
    ${direct.length ? `<div class="group" id="swapDirect">${direct.map(a => row(a, "direct")).join("")}</div>`
      : `<p class="small muted" id="swapNoDirect">Für ${cur.pattern ? "„" + PATTERNS[cur.pattern].label + "“" : "dieses Gerät"} gibt es in deinem Studio keine direkte Alternative.</p>`}</div>
    ${other.length ? `<div class="stack-sm"><div class="cap">Andere Übung für ${MUSCLES[cur.muscle]}</div><div class="group" id="swapOther">${other.map(a => row(a, "other")).join("")}</div></div>` : ""}
    ${!direct.length && !other.length ? `<p class="small muted">Kein anderes verfügbares Gerät für ${MUSCLES[cur.muscle]}. Überspringe die Übung über „Übungen“.</p>` : ""}`;
}

/* ================= Apple Health (über Kurzbefehle) ================= */
// Web-Apps haben keinen Zugriff auf HealthKit. Die App übergibt deshalb Startzeit und Dauer an einen
// Kurzbefehl auf dem iPhone, der das Workout in Health einträgt. Es gehen keine Daten an einen Server.
const HK_NAME = "Trainingsplan Workout";
const pad2 = n => String(n).padStart(2, "0");
function healthPayload(h) {
  const dur = Math.max(60, h.durationSec || 0), start = new Date(new Date(h.date).getTime() - dur * 1000);
  return { start: `${start.getFullYear()}-${pad2(start.getMonth() + 1)}-${pad2(start.getDate())} ${pad2(start.getHours())}:${pad2(start.getMinutes())}`,
    minuten: Math.max(1, Math.round(dur / 60)) };
}
const healthUrl = h => `shortcuts://run-shortcut?name=${encodeURIComponent(HK_NAME)}&input=text&text=${encodeURIComponent(JSON.stringify(healthPayload(h)))}`;
const HK_SENT = "An Health übergeben · erneut senden";
// Gewicht in ganzen Gramm übergeben: kein Komma/Punkt, das Kurzbefehle je nach Region falsch lesen könnte
const HK_WEIGHT = "Trainingsplan Gewicht";
const weightUrl = kg => `shortcuts://run-shortcut?name=${encodeURIComponent(HK_WEIGHT)}&input=text&text=${Math.round(kg * 1000)}`;
const todayKey = () => new Date().toISOString().slice(0, 10);
const healthTxt = h => { const p = healthPayload(h); return `Krafttraining, Start ${p.start.slice(11)} Uhr, ${p.minuten} Min.`; };
function openExternal(url) { if (window.__tp) window.__tp.lastUrl = url; else location.href = url; }
function healthSheet() {
  const step = (n, html) => `<li>${html}</li>`;
  return `${sheetHead("Apple Health")}
    <p>Diese App ist eine Web-App und darf nicht direkt auf Apple Health zugreifen. Über einen Kurzbefehl auf deinem iPhone kann sie ein Training trotzdem eintragen.</p>
    <div class="field"><label>Übergabe an Health anbieten</label><div class="seg" id="hkSeg">
      <button data-a="setHealth" data-v="0" class="${state.health ? "" : "on"}">Aus</button><button data-a="setHealth" data-v="1" class="${state.health ? "on" : ""}">An</button></div></div>
    <section class="gsec"><h2>Was übertragen wird</h2><ul class="glist">
      <li>Art „Krafttraining“, Startzeit und Dauer des Trainings – nach dem Training oder später aus dem Verlauf.</li>

    <details class="disc" id="hkSetup" ${state.health ? "" : "open"}><summary><div class="grow"><h3>Kurzbefehl einrichten</h3><div class="small muted">Einmalig, etwa 3 Minuten</div></div><span class="chev">›</span></summary><div class="body">

  const best = {}, series = {};
  H.forEach(h => h.exercises.forEach(x => { const k = x.exId + "|" + x.u, v = x.sets.filter(validSet);
    v.forEach(t => { if (!best[k] || t.kg > best[k].kg || (t.kg === best[k].kg && t.reps > best[k].reps)) best[k] = { id: x.exId, u: x.u, kg: t.kg, reps: t.reps, name: ex(x.exId).name, lastAt: best[k] ? best[k].lastAt : 0 }; });
    if (v.length) { (series[k] = series[k] || []).push(topSet(v)); best[k].lastAt = new Date(h.date).getTime(); } }));
  const bestList = Object.entries(best).sort((a, b) => b[1].lastAt - a[1].lastAt).slice(0, 8);
  const spark = arr => { if (arr.length < 2) return `<svg class="spark" viewBox="0 0 72 28" aria-hidden="true"><circle cx="36" cy="14" r="3" fill="var(--accent)"/></svg>`;
    const p = arr.slice(-8), lo = Math.min(...p), hi = Math.max(...p), span = hi - lo || 1;
    const pts = p.map((v, i) => `${(i / (p.length - 1) * 68 + 2).toFixed(1)},${(24 - (v - lo) / span * 20).toFixed(1)}`);
    return `<svg class="spark" viewBox="0 0 72 28" aria-hidden="true"><polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1).split(",")[0]}" cy="${pts.at(-1).split(",")[1]}" r="2.6" fill="var(--accent)"/></svg>`; };
  // Kalender
  const cm = new Date(now.getFullYear(), now.getMonth() + calOffset, 1);
  const trained = {};
  H.forEach(h => { const d = new Date(h.date); if (d.getFullYear() === cm.getFullYear() && d.getMonth() === cm.getMonth()) trained[d.getDate()] = h.day; });
  const lead = (cm.getDay() + 6) % 7, daysIn = new Date(cm.getFullYear(), cm.getMonth() + 1, 0).getDate();
  const isThisMonth = cm.getFullYear() === now.getFullYear() && cm.getMonth() === now.getMonth();
  const cal = `<div class="cal">${["M", "D", "M", "D", "F", "S", "S"].map(n => `<div class="d">${n}</div>`).join("")}
    ${Array.from({ length: lead }, () => "<div></div>").join("")}
    ${Array.from({ length: daysIn }, (_, i) => `<div class="d"><div class="dot ${trained[i + 1] ? "done" : ""} ${isThisMonth && i + 1 === now.getDate() ? "today" : ""}" ${trained[i + 1] ? `title="${esc(trained[i + 1])}"` : ""}>${i + 1}</div></div>`).join("")}</div>`;
  const monthCount = Object.keys(trained).length;
  const four = Date.now() - 28 * 864e5;
  const perWeek = H.filter(h => new Date(h.date).getTime() >= four).length / 4;
  const disc = (id, title, meta, body, open) => `<details class="disc" id="${id}" ${open ? "open" : ""}><summary><div class="grow"><h3>${title}</h3>${meta ? `<div class="small muted">${meta}</div>` : ""}</div><span class="chev">›</span></summary><div class="body">${body}</div></details>`;
  const W = (state.weights || []).slice().sort((a, b) => a.d.localeCompare(b.d)), lastW = W[W.length - 1];

  $app.innerHTML = `<div class="page">
    <div class="head"><div class="cap">${H.length} ${H.length === 1 ? "Training" : "Trainings"} insgesamt</div><h1 class="title">Fortschritt</h1></div>
    ${histNote ? `<p class="note small" id="histNote" role="status" style="margin:0">${esc(histNote)}</p>` : ""}
    ${H.length ? `<div class="group"><button class="li" data-a="openWeek" data-ret="history" id="histWeek"><div class="grow"><div class="t">Wochenrückblick</div><div class="s">Training, Ernährung und Gewicht der Woche</div></div><span class="chev">›</span></button></div>` : ""}
    ${H.length ? `
    <section class="section">
      <div class="section-head"><h2>Häufigkeit</h2><span class="small muted">${monthCount} ${monthCount === 1 ? "Tag" : "Tage"} im ${cm.toLocaleDateString("de-DE", { month: "long" })}</span></div>
      <div class="kpi"><span class="num">${String(Math.round(perWeek * 10) / 10).replace(".", ",")}</span><span class="sub">Trainings pro Woche · letzte 4 Wochen</span></div>
      <div class="bars">${weeks.map((w, i) => `<div class="b ${w.n ? "" : "zero"} ${i === 7 ? "cur" : ""}" data-n="${w.n}" style="height:${w.n ? Math.max(8, w.n / maxN * 100) : 4}%" title="${w.n} Trainings"></div>`).join("")}</div>
      <div class="bars-x">${weeks.map((w, i) => `<span>${i === 7 ? "Jetzt" : w.s.getDate() + "." + (w.s.getMonth() + 1) + "."}</span>`).join("")}</div>
    </section>
    <section class="section">
      <div class="section-head"><h2>Kraft & Bestwerte</h2><span class="small muted">Antippen für Details</span></div>
      <div class="group">${bestList.map(([k, b]) => { const sr = series[k] || [], dl = sr.length > 1 ? progDelta(sr[0], sr[sr.length - 1]) : { up: false, n: "±0", u: "" };
        return `<button class="li" data-a="showEx" data-id="${b.id}" data-u="${b.u}">
          <div class="grow"><div class="t ellipsis">${esc(b.name)}</div><div class="s">${kgTxt(b.kg)} kg ${UNIT_SHORT[b.u]} × ${b.reps}</div></div>
          ${spark(sr.map(x => x.kg))}<span class="delta ${dl.up ? "" : "zero"}">${dl.n}${dl.u ? ` ${dl.u}` : ""}</span></button>`; }).join("")}</div>
      <p class="small faint" style="margin:0">Veränderung seit der ersten Einheit: mehr Gewicht – oder beim gleichen Gewicht mehr Wiederholungen.</p>
    </section>` : `<p class="muted">Noch keine Trainings. Nach deinem ersten Training siehst du hier Häufigkeit, Kraftentwicklung und Bestwerte.</p>`}
    ${goalsHtml()}
    <div>
      ${disc("discWeight", "Körpergewicht", lastW ? `${kgTxt(lastW.kg)} kg` : "Noch nicht eingetragen", weightCard(), bwOpen)}
      ${H.length ? disc("discVol", "Trainingsvolumen", `max. ${max >= 1000 ? (max / 1000).toFixed(1).replace(".", ",") + " t" : Math.round(max) + " kg"} pro Woche`,
        `<div class="bars">${weeks.map(w => `<div class="b ${w.vol ? "" : "zero"}" style="height:${w.vol ? Math.max(4, w.vol / max * 100) : 4}%" title="${Math.round(w.vol)} kg"></div>`).join("")}</div>
         <div class="bars-x">${weeks.map((w, i) => `<span>${i === 7 ? "Jetzt" : w.s.getDate() + "." + (w.s.getMonth() + 1) + "."}</span>`).join("")}</div>
         <p class="small faint">Gewicht × Wiederholungen, bei „pro Seite“ beide Seiten.</p>`, false) : ""}
      ${H.length ? disc("discMuscle", "Muskelbelastung", `Sätze diese Woche · Ziel ${tmin}–${tmax}`,
        `<div class="mlist">${muscleRows}</div><p class="small faint">Der helle Bereich zeigt den Richtwert der App für ${(GOALS[goalKey] || GOALS.aufbau).label}. Mittrainierte Muskeln zählen halb.</p>`, false) : ""}
      ${H.length ? disc("discCal", "Kalender", `${monthCount} ${monthCount === 1 ? "Trainingstag" : "Trainingstage"} · Ø ${String(Math.round(perWeek * 10) / 10).replace(".", ",")} pro Woche (letzte 4 Wochen)`,
        `<div class="row between"><button class="icon-btn" data-a="calMonth" data-d="-1" aria-label="Voriger Monat">‹</button>
          <h3>${cm.toLocaleDateString("de-DE", { month: "long", year: "numeric" })}</h3>
          <button class="icon-btn" data-a="calMonth" data-d="1" aria-label="Nächster Monat" ${calOffset >= 0 ? "disabled" : ""}>›</button></div>${cal}`, calOffset !== 0) : ""}
      ${H.length ? disc("discLog", "Letzte Trainings", `${Math.min(30, H.length)} ${H.length === 1 ? "Eintrag" : "Einträge"}`,
        `<div class="plain-list">${[...H].reverse().slice(0, 30).map(h => `<div class="li" style="align-items:flex-start"><div class="grow">
          <button class="hopen" data-a="histOpen" data-id="${h.id}"><span class="grow">
          <span class="row between"><span class="t">${esc(h.day)}</span><span class="small faint">${new Date(h.date).toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" })} · ${Math.max(1, Math.round((h.durationSec || 0) / 60))} Min.</span></span>
          <span class="s">${h.exercises.map(x => { const v = x.sets.filter(validSet); return esc(x.name) + (v.length ? " " + kgTxt(Math.max(...v.map(t => t.kg))) + " kg " + UNIT_SHORT[x.u] : ""); }).join(" · ")}</span></span><span class="chev">›</span></button>
          ${state.health && !state.watch ? `<button class="link small" data-a="sendHealth" data-id="${h.id}">${h.hk ? HK_SENT : "In Apple Health eintragen"}</button>` : ""}</div></div>`).join("")}</div>
        <p class="small faint" style="margin:0">Antippen zum Korrigieren oder Löschen.</p>`, logOpen) : ""}
    </div>
  </div>`;
}

let calOffset = 0, bwOpen = false, logOpen = false, histNote = "";
function weightCard() {
  const W = (state.weights || []).slice().sort((a, b) => a.d.localeCompare(b.d));
  const today = new Date().toISOString().slice(0, 10);
  const todayEntry = W.find(w => w.d === today);
  const last = W[W.length - 1];
  const since = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
  const base = W.find(w => w.d >= since);
  const diff = last && base && last !== base ? Math.round((last.kg - base.kg) * 10) / 10 : null;
  let chart = "";
  const pts = W.slice(-30);
  if (pts.length >= 2) {
    const w = 320, h = 104, pl = 34, pr = 8, pt = 10, pb = 28;
    let lo = Math.min(...pts.map(p => p.kg)), hi = Math.max(...pts.map(p => p.kg));
    if (hi - lo < 1) { lo -= .5; hi += .5; }
    const t0 = new Date(pts[0].d).getTime(), t1 = new Date(pts[pts.length - 1].d).getTime() || t0 + 1;
    const X = p => pl + (new Date(p.d).getTime() - t0) / Math.max(1, t1 - t0) * (w - pl - pr);
    const Y = v => pt + (hi - v) / (hi - lo) * (h - pt - pb);
    const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p).toFixed(1)},${Y(p.kg).toFixed(1)}`).join("");
    const dl = s => { const d = new Date(s); return d.getDate() + "." + (d.getMonth() + 1) + "."; };
    chart = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Körpergewicht der letzten Einträge">
      <line x1="${pl}" x2="${w - pr}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--hair)"/>
      <line x1="${pl}" x2="${w - pr}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--hair)"/>
      <text x="${pl - 6}" y="${Y(hi) + 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${kgTxt(Math.round(hi * 10) / 10)}</text>
      <text x="${pl - 6}" y="${Y(lo) + 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${kgTxt(Math.round(lo * 10) / 10)}</text>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(pts[pts.length - 1])}" cy="${Y(pts[pts.length - 1].kg)}" r="4.5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>
      <text x="${pl}" y="${h - 4}" font-size="11" fill="var(--text-3)">${dl(pts[0].d)}</text>
      <text x="${w - pr}" y="${h - 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${dl(pts[pts.length - 1].d)}</text></svg>`;
  }
  return `<div class="stack">
    ${last ? `<div class="kpi"><span class="num" style="font-size:44px">${kgTxt(last.kg)}</span><span class="sub">kg${diff !== null ? ` · ${diff > 0 ? "+" : ""}${kgTxt(diff)} kg in 30 Tagen` : ""}</span></div>` : `<p class="small muted">Trag dein Gewicht ein, z. B. einmal pro Woche morgens.</p>`}
    ${chart}
    <div class="row"><input id="bwIn" class="grow" inputmode="decimal" enterkeyhint="done" placeholder="${todayEntry ? "Heute: " + kgTxt(todayEntry.kg) + " kg" : "Gewicht heute in kg"}" aria-label="Körpergewicht in kg" autocomplete="off">
      <button class="btn primary" data-a="addWeight">${todayEntry ? "Ändern" : "Eintragen"}</button></div>
    <p class="error" id="bwErr" hidden>Bitte eine Zahl zwischen 30 und 300 eingeben.</p>
    ${state.health && todayEntry ? `<div id="bwHk"><button class="btn block" data-a="sendWeight">${todayEntry.hk ? HK_SENT : "In Apple Health eintragen"}</button>
      <p class="small faint">Übergibt ${kgTxt(todayEntry.kg)} kg an den Kurzbefehl „${HK_WEIGHT}“.</p></div>` : ""}
  </div>`;
}

/* Vergangenes Training korrigieren oder löschen. Bestwerte, Fortschritt, Ziele und Wochenrückblick rechnen
   immer aus dem Verlauf und übernehmen die Korrektur dadurch von selbst. */
let histEdit = null;
const histRec = () => histEdit && state.history.find(h => h.id === histEdit.id);
const nSets = n => `${n} ${n === 1 ? "Satz" : "Sätze"}`;
const histSetCount = h => h.exercises.reduce((a, x) => a + x.sets.length, 0);
// Weiterblättern im offenen Sheet ohne erneute Einblend-Animation
const sheetTo = html => { const sh = $sheet.querySelector(".sheet"); if (!sh) return openSheet(html); lastSheet = html; sh.innerHTML = `<div class="grab"></div>` + html; sh.scrollTop = 0; sheetName(sh); };
function histSheet(h, msg = "") {
  return `${sheetHead(esc(h.day), "Fertig")}
    <p class="small muted" style="margin:0">${new Date(h.date).toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" })} · ${Math.max(1, Math.round((h.durationSec || 0) / 60))} Min. · ${nSets(histSetCount(h))}</p>
    <button class="link small" data-a="histMeta" style="justify-self:start;margin-top:calc(-1 * var(--s3))">Datum oder Dauer ändern</button>
    ${msg ? `<p class="small" id="histMsg" role="status" style="margin:0;color:var(--ok)">${esc(msg)}</p>` : ""}
    <div class="plain-list" id="histEx">${h.exercises.map((x, xi) => `<div class="li" style="display:block">
      <div class="row between"><span class="t ellipsis">${esc(x.name)}</span><span class="small faint">${UNIT[x.u] || ""}</span></div>
      <div class="hx-sets">${x.sets.map((t, i) => `<button class="set-pill done" data-a="histSet" data-x="${xi}" data-i2="${i}" aria-label="${esc(x.name)}, Satz ${i + 1} ändern">${t.kg != null ? kgTxt(t.kg) : "–"}×${t.reps}</button>`).join("")}</div></div>`).join("")}</div>
    <p class="small faint" style="margin:0">Satz antippen zum Korrigieren oder Löschen.</p>
    <button class="btn block danger" data-a="histDel">Training löschen</button>`;
}
function histSetSheet() {
  const h = histRec(), x = h.exercises[histEdit.x], t = x.sets[histEdit.i];
  return `${sheetHead(`Satz ${histEdit.i + 1} · ${esc(x.name)}`, "Zurück", "histBack")}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)">
      <div class="field"><label for="hsKg">${UNIT[x.u] || "kg"}</label><input id="hsKg" inputmode="decimal" value="${t.kg != null ? kgTxt(t.kg) : ""}" autocomplete="off" enterkeyhint="next"></div>
      <div class="field"><label for="hsReps">Wiederholungen</label><input id="hsReps" inputmode="numeric" value="${t.reps ?? ""}" autocomplete="off" enterkeyhint="done"></div></div>
    <p class="error" id="hsErr" role="alert" hidden></p>
    <div class="stack-sm"><button class="btn primary block xl" data-a="histSetSave">Speichern</button>
      ${histSetCount(h) > 1 ? `<button class="btn block danger" data-a="histSetDel">Satz löschen</button>` : ""}</div>`;
}
const localDay = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
function histMetaSheet() {
  const h = histRec();
  return `${sheetHead("Datum und Dauer", "Zurück", "histBack")}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)">
      <div class="field"><label for="hmDate">Datum</label><input id="hmDate" type="date" value="${localDay(new Date(h.date))}" max="${localDay(new Date())}"></div>
      <div class="field"><label for="hmMin">Dauer in Minuten</label><input id="hmMin" inputmode="numeric" value="${Math.max(1, Math.round((h.durationSec || 0) / 60))}" autocomplete="off" enterkeyhint="done"></div></div>
    <p class="error" id="hmErr" role="alert" hidden></p>
    ${h.hk ? `<p class="small muted" style="margin:0">Der Eintrag in Apple Health ändert sich dadurch nicht.</p>` : ""}
    <button class="btn primary block xl" data-a="histMetaSave">Speichern</button>`;
}
// Nach jeder Änderung: Kraftziele, die nur durch den alten Wert erreicht waren, gelten wieder als offen.
function histChanged() {
  (state.goals || []).forEach(g => { if (g.kind === "kraft" && g.done && !goalStatus(g).reached) delete g.done; });
  save(); logOpen = true; render(); logOpen = false;
}

function exChart(exId, u = unitOf(ex(exId))) {
  const all = state.history.map(h => { const x = h.exercises.find(e => e.exId === exId); if (!x) return null;
    const v = x.sets.filter(validSet); return v.length ? { d: new Date(h.date), kg: Math.max(...v.map(t => t.kg)), sets: v, u: x.u } : null; }).filter(Boolean);
  const other = all.filter(p => p.u !== u).length, allU = all.filter(p => p.u === u);
  const pts = allU.slice(-12);
  const name = ex(exId).name;
  const otherNote = other ? `<p class="small faint">${other} ${other === 1 ? "Eintrag" : "Einträge"} mit anderer Gewichtsangabe ausgeblendet, damit nichts Ungleiches verglichen wird.</p>` : "";
  if (!pts.length) return `${sheetHead(esc(name), "Schließen")}<p class="muted">Noch keine Daten mit „${UNIT[u]}“.</p>${otherNote}`;
  const W = 320, H = 160, pl = 36, pr = 12, pt = 24, pb = 26;
  let lo = Math.min(...pts.map(p => p.kg)), hi = Math.max(...pts.map(p => p.kg));
  if (hi === lo) { lo = Math.max(0, lo - 5); hi = hi + 5; }
  const X = i => pts.length === 1 ? (pl + W - pr) / 2 : pl + i * (W - pl - pr) / (pts.length - 1);
  const Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.kg).toFixed(1)}`).join("");
  const area = line + `L${X(pts.length - 1).toFixed(1)},${H - pb}L${X(0).toFixed(1)},${H - pb}Z`;
  const lastP = pts[pts.length - 1], since = progDelta(topSet(allU[0].sets), topSet(lastP.sets));
  const dl = d => d.getDate() + "." + (d.getMonth() + 1) + ".";
  return `${sheetHead(esc(name), "Schließen")}
    <div class="grid3">
      <div class="stat"><div class="cap">Aktuell</div><div class="num">${kgTxt(lastP.kg)}<span class="small muted"> kg</span></div><div class="small faint">${UNIT_SHORT[u]} · ${lastP.sets.map(t => t.reps).join("/")} Wdh.</div></div>
      <div class="stat" id="sinceStart"><div class="cap">Seit Beginn</div><div class="num" style="color:${since.up ? "var(--ok)" : "var(--text)"}">${since.n}${since.u ? `<span class="small muted"> ${since.u}</span>` : ""}</div><div class="small faint">seit ${allU[0].d.toLocaleDateString("de-DE", { day: "numeric", month: "numeric", year: "2-digit" })}</div></div>
      <div class="stat"><div class="cap">1RM geschätzt</div><div class="num">≈${kgTxt(Math.round(Math.max(...lastP.sets.map(e1rm)) * 2) / 2)}<span class="small muted"> kg</span></div><div class="small faint">Näherung</div></div>
    </div>
    ${(() => { const pl = plateau(exId); return pl ? `<p class="small" style="color:var(--warn)" id="plateauChart">${esc(plateauTxt(pl))}</p>` : ""; })()}${otherNote}
    <p class="small faint">Linie: schwerster Satz je Training, Zahl darüber: Wiederholungen damit. 1RM nach Epley aus deinen Sätzen geschätzt, an Maschinen nur eine grobe Näherung.</p>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Gewichtsverlauf ${esc(name)}">
      <line x1="${pl}" x2="${W - pr}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--hair)"/>
      <line x1="${pl}" x2="${W - pr}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--hair)"/>
      <text x="${pl - 6}" y="${Y(hi) + 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${kgTxt(hi)}</text>
      <text x="${pl - 6}" y="${Y(lo) + 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${kgTxt(lo)}</text>
      <path d="${area}" fill="var(--accent-tint)"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.kg)}" r="${i === pts.length - 1 ? 5 : 3}" fill="var(--accent)" stroke="var(--raise)" stroke-width="2"/>
        <text x="${X(i)}" y="${Y(p.kg) - 10}" text-anchor="middle" font-size="10" fill="var(--text-2)" class="repLbl">${topSet(p.sets).reps}</text>`).join("")}
      <text x="${X(0)}" y="${H - 6}" text-anchor="${pts.length === 1 ? "middle" : "start"}" font-size="11" fill="var(--text-3)">${dl(pts[0].d)}</text>
      ${pts.length > 1 ? `<text x="${X(pts.length - 1)}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--text-3)">${dl(lastP.d)}</text>` : ""}
    </svg>
    <button class="btn block" data-a="openEx" data-id="${exId}" data-ret="history">Anleitung und alle Werte</button>
    <div class="group">${[...pts].reverse().slice(0, 5).map(p => `<div class="li"><div class="grow small muted">${p.d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" })}</div>
      <div class="small">${p.sets.map(t => (t.kg !== null ? kgTxt(t.kg) : "–") + "×" + t.reps).join(" · ")}</div></div>`).join("")}</div>`;
}

/* ================= Ticker ================= */
let timer = null;
function tick() {
  const s = S(); if (!s) return stopTick();
  const el = byId("elapsed"); if (el) el.textContent = fmtTime((Date.now() - s.start) / 1000);
  const rm = byId("remain"); if (rm) rm.textContent = `≈ ${remainMin(s)} Min.`;
  if (s.phase !== "rest") return;
  const left = (s.restEnd - Date.now()) / 1000;
  const t = byId("timer"); if (t) t.textContent = fmtTime(left);
