<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101215">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Trainingsplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  /* Layout: App-Shell mit einer Spalte (max. 560px), große Titel, Tab-Leiste unten; Training im Vollbild ohne Tabs */
  :root{
    --bg:#101215; --surface:#191c21; --surface2:#22262d; --line:#2b3038;
    --text:#f2f3f5; --muted:#8c93a0; --accent:#ff6b1a; --accent-soft:rgba(255,107,26,.38);
    --ok:#2bb673; --warn:#f2b233; --bad:#ef5350;
    --fig:#2a2f37; --muscle:#3a404a;
    --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
    --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
    --bg:#f2f3f5; --surface:#ffffff; --surface2:#eceef1; --line:#e0e3e8;
    --text:#14171c; --muted:#646c78; --accent:#e85a0c; --accent-soft:rgba(232,90,12,.32);
    --ok:#1c9a5c; --warn:#d99a12; --bad:#d93a37; --fig:#d9dde3; --muscle:#c3c8d0; color-scheme:light}}
  :root[data-theme="light"]{
    --bg:#f2f3f5; --surface:#ffffff; --surface2:#eceef1; --line:#e0e3e8;
    --text:#14171c; --muted:#646c78; --accent:#e85a0c; --accent-soft:rgba(232,90,12,.32);
    --ok:#1c9a5c; --warn:#d99a12; --bad:#d93a37; --fig:#d9dde3; --muscle:#c3c8d0; color-scheme:light}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4;
    padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
    padding-block:12px 112px;max-width:560px;margin:0 auto}
  body.training{padding-bottom:24px}
  h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;margin:6px 0 0;text-wrap:balance;letter-spacing:.005em}
  h2{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;margin:0;text-wrap:balance}
  h3{font-size:16px;font-weight:600;margin:0}
  p{margin:0}
  .stack{display:grid;gap:12px}
  .stack-lg{display:grid;gap:20px}
  .card{background:var(--surface);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
  .muted{color:var(--muted)}
  .small{font-size:14px}
  .label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
  .row{display:flex;gap:10px;align-items:center;min-width:0}
  .row>.grow{flex:1;min-width:0}
  .between{justify-content:space-between}
  .wrap{flex-wrap:wrap}
  .num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button:disabled{opacity:.4;cursor:default}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:600;background:var(--surface2);color:var(--text)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ok{background:var(--ok);color:#fff}
  .btn.danger{color:var(--bad)}
  .btn.block{width:100%}
  .btn.xl{padding:18px;font-size:19px;border-radius:16px}
  .btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
  .icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:inline-grid;place-items:center;flex:0 0 auto}
  .link{color:var(--accent);font-weight:600}
  .chip{padding:8px 13px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:600;white-space:nowrap}
  .chip.on{background:var(--accent);color:#fff}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
  .badge.up{background:rgba(43,182,115,.16);color:var(--ok)}
  .badge.pr{background:var(--accent-soft);color:var(--text)}

  input,select{font:inherit;width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}

  .list{display:grid}
  .li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0;text-align:left;width:100%}
  .li:first-child{border-top:0;padding-top:0}
  .li:last-child{padding-bottom:0}
  .li .grow{flex:1;min-width:0}

  /* Tab-Leiste */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    display:flex;justify-content:center;
    padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
  nav.tabs .in{display:flex;width:100%;max-width:560px}
  nav.tabs button{flex:1;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted)}
  nav.tabs button.on{color:var(--accent)}
  nav.tabs svg{width:24px;height:24px}

  /* Figur */
  .fig{display:block;width:100%;height:auto}
  .fig .base{fill:var(--fig)}
  .fig .m{fill:var(--muscle);transition:fill .3s}

  /* Woche */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
  .week .d{display:grid;gap:6px;justify-items:center;font-size:12px;color:var(--muted);font-weight:600}
  .week .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:13px;color:var(--muted)}
  .week .dot.done{background:var(--accent);color:#fff}
  .week .dot.today{box-shadow:0 0 0 2px var(--accent) inset;color:var(--text)}

  /* Training */
  .t-top{display:flex;align-items:center;gap:10px}
  .bar{height:5px;background:var(--surface2);border-radius:5px;overflow:hidden}
  .bar>div{height:100%;background:var(--accent);transition:width .3s}
  .sets{display:flex;gap:6px;flex-wrap:wrap}
  .set-pill{min-width:34px;height:34px;padding:0 8px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
  .set-pill.done{background:var(--ok);color:#fff}
  .set-pill.cur{box-shadow:0 0 0 2px var(--accent) inset}
  .big-step{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}
  .big-step button{height:56px;border-radius:14px;background:var(--surface2);font-size:26px;font-weight:600}
  .big-step input{text-align:center;font-family:var(--display);font-weight:700;font-size:40px;padding:4px;border:0;background:transparent;font-variant-numeric:tabular-nums}
  .unit{font-size:13px;color:var(--muted);text-align:center;margin-top:-4px}
  .ring{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:4px auto;max-width:100%}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .t{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:4px}
  .ring .t .num{font-size:72px}
  .note-in{background:transparent;border:1px dashed var(--line);padding:9px 12px;font-size:14px}
  .tips summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px;list-style:none}
  .tips summary::-webkit-details-marker{display:none}
  .tips summary::before{content:"＋ "}
  .tips[open] summary::before{content:"− "}
  .tips ol{margin:8px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14px;max-width:65ch}
  textarea{font:inherit;font-size:12px;width:100%;min-height:90px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:ui-monospace,Menlo,monospace;word-break:break-all}

  /* Sheet */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;display:grid;gap:14px;
    padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    animation:up .22s ease-out}
  .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 4px}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}

  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surface2);padding:4px;border-radius:12px}
  .seg button{padding:10px 4px;border-radius:9px;font-weight:600;font-size:15px}
  .seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .mini-step{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center}
  .mini-step button{height:44px;border-radius:12px;background:var(--surface2);font-size:20px}
  .mini-step output{text-align:center;font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}

  .bars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:120px}
  .bars .b{background:var(--accent);border-radius:6px 6px 2px 2px;min-height:3px}
  .bars .b.zero{background:var(--surface2)}
  .bars-x{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;font-size:11px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

  .stat{display:grid;gap:4px}
  .stat .num{font-size:30px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media (prefers-reduced-motion: reduce){.sheet{animation:none}.bar>div,.fig .m{transition:none}}
</style>

<div id="app"></div>
<nav class="tabs" id="tabs"><div class="in">
  <button data-a="tab" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Heute</button>
  <button data-a="tab" data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>Plan</button>
  <button data-a="tab" data-v="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Verlauf</button>
</div></nav>
<div id="sheet-root"></div>

<script>
(() => {
"use strict";

/* ================= Daten ================= */
const MUSCLES = {
  brust:"Brust", ruecken:"Rücken", schultern:"Schultern", bizeps:"Bizeps", trizeps:"Trizeps",
  bauch:"Bauch", beinev:"Beine vorn", beineh:"Beine hinten", po:"Po", waden:"Waden"
};
// [id, Name, Hauptmuskel, Nebenmuskeln, Gerätetyp] – Hammer Strength
const LIB = [
  ["hs-chest","Iso-Lateral Chest Press","brust",["trizeps","schultern"],"plate"],
  ["hs-incline","Iso-Lateral Incline Press","brust",["schultern","trizeps"],"plate"],
  ["hs-decline","Iso-Lateral Decline Press","brust",["trizeps"],"plate"],
  ["hs-widechest","Iso-Lateral Wide Chest","brust",["schultern"],"plate"],
  ["hs-fly","Pec Fly","brust",["schultern"],"stack"],
  ["hs-row","Iso-Lateral Row","ruecken",["bizeps","schultern"],"plate"],
  ["hs-lowrow","Iso-Lateral Low Row","ruecken",["bizeps"],"plate"],
  ["hs-highrow","Iso-Lateral High Row","ruecken",["bizeps","schultern"],"plate"],
  ["hs-pulldown","Iso-Lateral Front Lat Pulldown","ruecken",["bizeps"],"plate"],
  ["hs-dyrow","Iso-Lateral D.Y. Row","ruecken",["bizeps"],"plate"],
  ["hs-lat","Lat Pulldown","ruecken",["bizeps"],"stack"],
  ["hs-shoulder","Iso-Lateral Shoulder Press","schultern",["trizeps"],"plate"],
  ["hs-lateral","Lateral Raise","schultern",[],"plate"],
  ["hs-reardelt","Rear Delt","schultern",["ruecken"],"stack"],
  ["hs-curl","Biceps Curl","bizeps",[],"plate"],
  ["hs-dip","Seated Dip","trizeps",["brust","schultern"],"plate"],
  ["hs-triext","Triceps Extension","trizeps",[],"stack"],
  ["hs-legpress","Linear Leg Press","beinev",["po","beineh"],"plate"],
  ["hs-isolegpress","Iso-Lateral Leg Press","beinev",["po"],"plate"],
  ["hs-vsquat","V-Squat","beinev",["po"],"plate"],
  ["hs-hack","Hack Squat","beinev",["po"],"plate"],
  ["hs-legext","Iso-Lateral Leg Extension","beinev",[],"plate"],
  ["hs-kneelcurl","Iso-Lateral Kneeling Leg Curl","beineh",[],"plate"],
  ["hs-seatcurl","Seated Leg Curl","beineh",[],"stack"],
  ["hs-hipthrust","Hip Thrust","po",["beineh"],"plate"],
  ["hs-calf","Standing Calf Raise","waden",[],"plate"],
  ["hs-seatcalf","Seated Calf Raise","waden",[],"plate"],
  ["hs-ab","Ab Crunch","bauch",[],"stack"]
].map(([id,name,muscle,sec,type]) => ({ id, name, muscle, sec, type }));

// Kurze Ausführungstipps (Einstellung · Bewegung · Fehler vermeiden)
const TIPS = {
  "hs-chest":["Sitz so einstellen, dass die Griffe auf Brusthöhe sind","Schulterblätter zusammen und nach unten, dann drücken","Ellbogen nicht ganz durchstrecken, langsam zurück"],
  "hs-incline":["Griffe auf Höhe der oberen Brust","Brust raus, Schulterblätter fest in die Lehne","Unten kurz dehnen, kontrolliert hochdrücken"],
  "hs-decline":["Griffe auf Höhe der unteren Brust","Rücken fest an der Lehne, Füße fest am Boden","Nach vorn-unten drücken, Schultern bleiben unten"],
  "hs-widechest":["Griffe auf Brusthöhe, Hände weit","Ellbogen leicht gebeugt, nach vorn zusammenführen","Langsam zurück bis zur Dehnung in der Brust"],
  "hs-fly":["Arme auf Schulterhöhe, Ellbogen leicht gebeugt","Bogenförmig zusammenführen, kurz halten","Nicht über die Dehnung hinaus zurückgehen"],
  "hs-row":["Brust an das Polster, Arme ganz gestreckt","Ellbogen nah am Körper nach hinten ziehen","Schulterblätter am Ende zusammen, nicht mit dem Oberkörper reißen"],
  "hs-lowrow":["Brust ans Polster, Füße fest","Zum Bauch ziehen, Ellbogen eng","Am Ende kurz halten, langsam nach vorn"],
  "hs-highrow":["Sitz so, dass die Griffe über Kopf sind","Diagonal nach unten-hinten ziehen","Schultern weg von den Ohren"],
  "hs-pulldown":["Knie fest unter das Polster","Griffe zur oberen Brust ziehen, Brust raus","Oben ganz strecken, nicht nach hinten lehnen"],
  "hs-dyrow":["Brust ans Polster, Arme lang","Ellbogen Richtung Hüfte ziehen","Langsam zurück, Rücken bleibt gerade"],
  "hs-lat":["Knie fixieren, Stange etwas breiter als schulterbreit","Zur oberen Brust ziehen, Ellbogen nach unten","Oben kontrolliert strecken"],
  "hs-shoulder":["Griffe etwa auf Kinnhöhe","Gerade nach oben drücken, Rücken an der Lehne","Kein Hohlkreuz, Ellbogen nicht durchschlagen"],
  "hs-lateral":["Polster an den Oberarmen, Sitz so, dass die Schulter auf Drehachse ist","Arme seitlich bis Schulterhöhe heben","Langsam ablassen, nicht schwingen"],
  "hs-reardelt":["Brust ans Polster, Arme auf Schulterhöhe","Arme in weitem Bogen nach hinten","Schulterblätter nicht hochziehen"],
  "hs-curl":["Oberarme flach auf dem Polster, Ellbogen auf Drehachse","Hoch bis zur vollen Beugung","Unten fast ganz strecken, ohne Schwung"],
  "hs-dip":["Sitz so, dass die Griffe neben der Hüfte sind","Nach unten drücken bis die Arme fast gestreckt sind","Oberkörper aufrecht, Schultern unten"],
  "hs-triext":["Oberarme aufs Polster, Ellbogen auf Drehachse","Arme ganz strecken, kurz halten","Langsam beugen, Oberarme bleiben liegen"],
  "hs-legpress":["Füße schulterbreit mittig auf der Platte","Knie zeigen in Richtung Zehen","Unten Po bleibt am Polster, oben Knie nicht durchstrecken"],
  "hs-isolegpress":["Füße hüftbreit, Rücken fest an der Lehne","Kontrolliert tief, Knie folgen den Zehen","Oben Knie leicht gebeugt lassen"],
  "hs-vsquat":["Schultern unter die Polster, Füße leicht vor dem Körper","Tief beugen, Rücken bleibt an der Lehne","Über die ganze Fußsohle hochdrücken"],
  "hs-hack":["Rücken flach an der Lehne, Füße schulterbreit","Tief gehen, Knie Richtung Zehen","Fersen bleiben auf der Platte"],
  "hs-legext":["Knie auf Höhe der Drehachse, Polster über dem Knöchel","Beine ganz strecken, oben kurz halten","Langsam ablassen, nicht fallen lassen"],
  "hs-kneelcurl":["Knie aufs Polster, Polster über der Ferse","Ferse zum Po ziehen","Hüfte bleibt am Polster, langsam zurück"],
  "hs-seatcurl":["Knie auf Drehachse, Oberschenkelpolster fest","Fersen nach unten-hinten ziehen","Langsam zurück, nicht abfedern"],
  "hs-hipthrust":["Oberer Rücken an der Bank, Füße hüftbreit","Hüfte hochdrücken, Po oben fest anspannen","Kein Hohlkreuz, Kinn leicht zur Brust"],
  "hs-calf":["Fußballen auf die Kante, Schultern unter die Polster","Ganz hoch auf die Zehen, kurz halten","Unten voll dehnen"],
  "hs-seatcalf":["Polster fest auf die Oberschenkel, Ballen auf die Kante","Fersen ganz hoch drücken","Langsam tief in die Dehnung"],
  "hs-ab":["Füße einhaken, Griffe neben dem Kopf","Oberkörper einrollen, Bauch fest","Nicht mit den Armen ziehen, langsam zurück"]
};

const GOALS = {
  aufbau:{ label:"Muskelaufbau", rmin:8, rmax:12, rest:90 },
  kraft:{ label:"Kraft", rmin:4, rmax:6, rest:180 },
  fit:{ label:"Fitness & Straffung", rmin:12, rmax:15, rest:60 }
};
const TEMPLATES = {
  2:[["Ganzkörper A",["hs-chest","hs-row","hs-legpress","hs-shoulder","hs-seatcurl","hs-ab"]],
     ["Ganzkörper B",["hs-incline","hs-pulldown","hs-hack","hs-lateral","hs-dip","hs-calf"]]],
  3:[["Push",["hs-chest","hs-incline","hs-shoulder","hs-lateral","hs-dip"]],
     ["Pull",["hs-row","hs-pulldown","hs-highrow","hs-reardelt","hs-curl"]],
     ["Beine",["hs-legpress","hs-hack","hs-legext","hs-seatcurl","hs-hipthrust","hs-calf"]]],
  4:[["Oberkörper A",["hs-chest","hs-row","hs-shoulder","hs-pulldown","hs-curl","hs-dip"]],
     ["Unterkörper A",["hs-legpress","hs-legext","hs-seatcurl","hs-hipthrust","hs-calf"]],
     ["Oberkörper B",["hs-incline","hs-lowrow","hs-lat","hs-lateral","hs-reardelt","hs-triext"]],
     ["Unterkörper B",["hs-vsquat","hs-isolegpress","hs-kneelcurl","hs-hipthrust","hs-seatcalf","hs-ab"]]]
};

const KEY = "trainingsplan-v2";
const uid = () => Math.random().toString(36).slice(2, 10);
let state = load();

function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
  const s = blank();
  try { // alte Version übernehmen
    const old = JSON.parse(localStorage.getItem("trainingsplan-v1") || "null");
    if (old && old.days && old.days.length) {
      s.plan = { goal:"aufbau", level:"einsteiger", days: old.days.map(d => ({ id: uid(), name: d.name,
        items: d.exercises.map(e => ({ id: uid(), exId: exIdByName(e.name, s), sets: e.sets, rmin: e.reps, rmax: e.reps, rest: e.rest })) })) };
    }
  } catch (e) {}
  return s;
}
function blank() { return { plan:null, custom:[], notes:{}, history:[], session:null, selDay:null }; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function exIdByName(name, s) {
  const hit = LIB.find(e => e.name.toLowerCase() === name.toLowerCase()) || s.custom.find(e => e.name.toLowerCase() === name.toLowerCase());
  if (hit) return hit.id;
  const c = { id: "c-" + uid(), name, muscle: "brust", sec: [], type: "plate" };
  s.custom.push(c); return c.id;
}

function generatePlan(goal, days, level, minutes) {
  const g = GOALS[goal];
  return { goal, level, minutes, days: TEMPLATES[days].map(([name, ids]) => {
    const items = ids.map((id, i) => ({ id: uid(), exId: id, sets: level === "fortgeschritten" && i < 2 ? 4 : 3,
      rmin: g.rmin, rmax: g.rmax, rest: i < 2 ? g.rest : Math.max(60, g.rest - 30) }));
    const day = { id: uid(), name, items };
    // An die gewünschte Trainingszeit anpassen: erst Übungen am Ende kürzen, dann Sätze
    while (minutes && estMinutes(day) > minutes && items.length > 3) items.pop();
    for (let i = items.length - 1; minutes && estMinutes(day) > minutes && i >= 0; i--) if (items[i].sets > 2) items[i].sets--;
    return day;
  }) };
}

function bestKg(exId, beforeIndex = state.history.length) {

    if (e.exId === exId) for (const s of e.sets) if (s.kg !== null && (best === null || s.kg > best)) best = s.kg;

let actx = null;
function tone(freq = 880, dur = .18, vol = .25) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(vol, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
let wl = null;
async function awake(on) {

}

    E("ruecken",141,53,9.5,15), E("ruecken",159,53,9.5,15),

function figure(colors, label) {

    FIG.map(p => p.m

function workoutColors(items) {
  const c = {};
  items.forEach(it => { const e = ex(it.exId); e.sec.forEach(m => { if (!c[m]) c[m] = "var(--accent-soft)"; }); });
  items.forEach(it => { c[ex(it.exId).muscle] = "var(--accent)"; });
  return c;
}
function recovery() {
  const now = Date.now(), r = {};
  for (const m in MUSCLES) r[m] = 100;
  state.history.forEach(h => {
    const hrs = (now - new Date(h.date).getTime()) / 36e5;
    h.exercises.forEach(x => {
      const e = ex(x.exId);
      const apply = (m, full) => { r[m] = Math.min(r[m], Math.max(0, Math.min(100, hrs / full * 100))); };
      apply(e.muscle, 72); e.sec.forEach(m => apply(m, 48));
    });
  });
  return r;
}

function weekStreak(monday, goal) {
  const counts = {};
  state.history.forEach(h => { const d = new Date(h.date); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); counts[d.getTime()] = (counts[d.getTime()] || 0) + 1; });
  let n = 0; const w = new Date(monday);
  if ((counts[w.getTime()] || 0) >= goal) n++; // laufende Woche zählt nur, wenn schon erreicht
  for (;;) { w.setDate(w.getDate() - 7); if ((counts[w.getTime()] || 0) >= goal) n++; else break; }
  return n;
}

/* ================= Training ================= */
function startTraining(day) {
  tone(660, .08, .05); // Ton durch den Tap freischalten
  state.session = {
    dayId: day.id, dayName: day.name, start: Date.now(), idx: 0, phase: "set", restEnd: 0, restTotal: 0,
    list: day.items.map(makeEntry)
  };
  state.selDay = null; save(); awake(true); go("train"); startTick();
}
function makeEntry(it) {
      const e = ex(it.exId), last = lastPerf(it.exId), step = stepFor(e);
      const hasKg = !!(last && last.some(s => s.kg !== null));
      const top = last ? Math.max(...last.map(s => s.kg ?? 0)) : null;
      // Anpassung: alle Wdh. geschafft -> mehr Gewicht; Mindest-Wdh. in keinem Satz geschafft -> weniger
      const up = hasKg && last.every(s => s.reps >= it.rmax);
      const down = hasKg && !up && top - step > 0 && last.every(s => s.reps < it.rmin);
      return { itemId: it.id, exId: it.exId, rmin: it.rmin, rmax: it.rmax, rest: it.rest, step, up, down,
        sets: Array.from({ length: it.sets }, (_, i) => {
          const ls = last ? (last[i] || last[last.length - 1]) : null;
          return up ? { kg: top + step, reps: it.rmin, done: false }
               : down ? { kg: top - step, reps: it.rmin, done: false }
                    : { kg: ls ? ls.kg : null, reps: ls ? Math.min(it.rmax, Math.max(it.rmin, ls.reps)) : it.rmax, done: false };
        }) };
}
const S = () => state.session;
const curSetIdx = x => x.sets.findIndex(s => !s.done);
function nextOpen(from) {
  const L = S().list;
  for (let k = 1; k <= L.length; k++) { const i = (from + k) % L.length; if (curSetIdx(L[i]) !== -1) return i; }
  return -1;
}
function doneSet() {
  const s = S(), x = s.list[s.idx], i = curSetIdx(x);
  if (i === -1) return;
  x.sets[i].done = true; buzz(30);
  if (s.list.every(e => curSetIdx(e) === -1)) return finish(true);
  s.phase = "rest"; s.restTotal = x.rest; s.restEnd = Date.now() + x.rest * 1000; s.beeped = 0;
  if (curSetIdx(x) === -1) s.idx = nextOpen(s.idx);
  save();
  if (!x.rest) return endRest();
  render();
}
function endRest() { const s = S(); s.phase = "set"; save(); render(); }
function finish(saveIt) {
  stopTick(); awake(false);
  const s = S();
  if (saveIt) {
    const exs = s.list.map(x => ({ exId: x.exId, name: ex(x.exId).name, sets: x.sets.filter(t => t.done).map(t => ({ kg: t.kg, reps: t.reps })) })).filter(x => x.sets.length);
    if (exs.length) {
      const prs = exs.filter(x => { const b = bestKg(x.exId); const m = Math.max(...x.sets.map(t => t.kg ?? 0)); return m > 0 && (b === null || m > b); })
        .map(x => ({ name: x.name, kg: Math.max(...x.sets.map(t => t.kg ?? 0)), first: bestKg(x.exId) === null }));
      const rec = { id: uid(), dayId: s.dayId, day: s.dayName, date: new Date().toISOString(), durationSec: Math.round((Date.now() - s.start) / 1000), exercises: exs };
      state.history.push(rec);
      summary = { rec, prs, sets: exs.reduce((a, x) => a + x.sets.length, 0), volume: exs.reduce((a, x) => a + x.sets.reduce((b, t) => b + (t.kg || 0) * t.reps, 0), 0) };
      tone(784, .15); setTimeout(() => tone(1046, .3), 160); buzz([80, 60, 160]);
    }
  }
  state.session = null; save(); closeSheet();
  go(summary && saveIt ? "summary" : "home");
}

function vHistory() {

let calOffset = 0;
function exChart(exId) {
  const pts = state.history.map(h => { const x = h.exercises.find(e => e.exId === exId); if (!x) return null;
    const kgs = x.sets.map(t => t.kg).filter(k => k !== null); return kgs.length ? { d: new Date(h.date), kg: Math.max(...kgs), sets: x.sets } : null; })
    .filter(Boolean).slice(-12);
  const name = ex(exId).name;
  if (!pts.length) return `<h2>${esc(name)}</h2><p class="muted">Noch keine Daten.</p>`;
  const W = 320, H = 150, pl = 36, pr = 12, pt = 14, pb = 26;
  let lo = Math.min(...pts.map(p => p.kg)), hi = Math.max(...pts.map(p => p.kg));
  if (hi === lo) { lo = Math.max(0, lo - 5); hi = hi + 5; }
  const X = i => pts.length === 1 ? (pl + W - pr) / 2 : pl + i * (W - pl - pr) / (pts.length - 1);
  const Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.kg).toFixed(1)}`).join("");
  const area = line + `L${X(pts.length - 1).toFixed(1)},${H - pb}L${X(0).toFixed(1)},${H - pb}Z`;
  const first = pts[0].kg, lastP = pts[pts.length - 1];
  const diff = lastP.kg - first;
  const dl = d => d.getDate() + "." + (d.getMonth() + 1) + ".";
  return `<div class="row between"><h2 class="grow">${esc(name)}</h2><button class="btn sm" data-a="closeSheet">Schließen</button></div>
    <div class="grid3" style="grid-template-columns:1fr 1fr">
      <div class="stat"><div class="label">Aktuell</div><div class="num">${kgTxt(lastP.kg)}<span class="small muted"> kg</span></div></div>
      <div class="stat"><div class="label">Seit Beginn</div><div class="num" style="color:${diff > 0 ? "var(--ok)" : "var(--text)"}">${diff > 0 ? "+" : ""}${kgTxt(diff)}<span class="small muted"> kg</span></div></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Gewichtsverlauf ${esc(name)}">
      <line x1="${pl}" x2="${W - pr}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--line)" stroke-dasharray="3 4"/>
      <line x1="${pl}" x2="${W - pr}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--line)" stroke-dasharray="3 4"/>
      <text x="${pl - 6}" y="${Y(hi) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${kgTxt(hi)}</text>
      <text x="${pl - 6}" y="${Y(lo) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${kgTxt(lo)}</text>
      <path d="${area}" fill="var(--accent-soft)" opacity=".5"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.kg)}" r="${i === pts.length - 1 ? 5 : 3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join("")}
      <text x="${X(0)}" y="${H - 6}" text-anchor="${pts.length === 1 ? "middle" : "start"}" font-size="11" fill="var(--muted)">${dl(pts[0].d)}</text>
      ${pts.length > 1 ? `<text x="${X(pts.length - 1)}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--muted)">${dl(lastP.d)}</text>` : ""}
    </svg>
    <div class="list">${[...pts].reverse().slice(0, 5).map(p => `<div class="li"><div class="grow small muted">${p.d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" })}</div>
      <div class="small">${p.sets.map(t => (t.kg !== null ? kgTxt(t.kg) : "–") + "×" + t.reps).join(" · ")}</div></div>`).join("")}</div>`;
}

/* ================= Ticker ================= */
let timer = null;
function tick() {
  const s = S(); if (!s) return stopTick();
  const el = byId("elapsed"); if (el) el.textContent = fmtTime((Date.now() - s.start) / 1000);
  if (s.phase !== "rest") return;
  const left = (s.restEnd - Date.now()) / 1000;
  const t = byId("timer"); if (t) t.textContent = fmtTime(left);
  const arc = byId("ringArc"); if (arc) { const C = 2 * Math.PI * 54; arc.setAttribute("stroke-dashoffset", C * (1 - Math.max(0, s.restTotal ? left / s.restTotal : 0))); }
  const sec = Math.ceil(left);
  if (sec <= 3 && sec >= 1 && s.beeped !== sec) { s.beeped = sec; tone(660, .12); }
  if (left <= 0) { tone(990, .45); buzz([200, 100, 200]); endRest(); }
}
function startTick() { stopTick(); timer = setInterval(tick, 250); }
function stopTick() { if (timer) clearInterval(timer); timer = null; }

/* ================= Aktionen ================= */
const A = {
  tab: el => go(el.dataset.v),
  closeSheet: (el, ev) => { if (ev.target === el || el.tagName === "BUTTON") closeSheet(); },
  setup: el => { const k = el.dataset.k; setup[k] = k === "days" || k === "minutes" ? +el.dataset.val : el.dataset.val; vSetup(); },
  createPlan: () => { state.plan = generatePlan(setup.goal, setup.days, setup.level, setup.minutes); state.selDay = null; save(); go("home"); },
  calMonth: el => { calOffset += +el.dataset.d; vHistory(); },
  exportData: () => {
    const { session, ...rest } = state;
    const code = "TP1:" + btoa(unescape(encodeURIComponent(JSON.stringify(rest))));
    openSheet(`<h2>Sicherung</h2>
      <textarea id="expTxt" readonly aria-label="Sicherungscode">${esc(code)}</textarea>
      <p class="muted small" id="expMsg">${state.history.length} Trainings und ${state.plan?.days.length || 0} Trainingstage.</p>
      <button class="btn primary block" data-a="copyExp">Kopieren</button><button class="btn block" data-a="closeSheet">Schließen</button>`);
  },
  copyExp: () => {
    const t = byId("expTxt"), msg = byId("expMsg");
    const done = () => { msg.textContent = "Kopiert. Füge den Code jetzt z. B. in deine Notizen ein."; msg.style.color = "var(--ok)"; };
    try { navigator.clipboard.writeText(t.value).then(done, () => { t.select(); msg.textContent = "Text ist markiert. Tippe auf „Kopieren“ im Menü."; }); }
    catch (e) { t.select(); msg.textContent = "Text ist markiert. Tippe auf „Kopieren“ im Menü."; }
  },
  importOpen: () => openSheet(`<h2>Sicherung einfügen</h2>
    <textarea id="impTxt" placeholder="Code hier einfügen (beginnt mit TP1:)" aria-label="Sicherungscode"></textarea>
    <p class="muted small" id="impMsg">Achtung: Ersetzt Plan und Verlauf auf diesem Gerät.</p>
    <button class="btn primary block" data-a="importDo">Wiederherstellen</button><button class="btn block" data-a="closeSheet">Abbrechen</button>`),
  importDo: () => {
    const raw = byId("impTxt").value.trim(), msg = byId("impMsg");
    try {
      if (!raw.startsWith("TP1:")) throw 0;
      const data = JSON.parse(decodeURIComponent(escape(atob(raw.slice(4)))));
      if (!Array.isArray(data.history)) throw 0;
      state = Object.assign(blank(), data, { session: null }); save(); closeSheet(); go("home");
    } catch (e) { msg.textContent = "Der Code ist ungültig. Kopiere ihn vollständig, er beginnt mit TP1:"; msg.style.color = "var(--bad)"; }
  },
  showEx: el => openSheet(exChart(el.dataset.id)),
  emptyPlan: () => { state.plan = { goal: setup.goal, level: setup.level, days: [{ id: uid(), name: "Tag 1", items: [] }] }; save(); state.editDay = state.plan.days[0].id; go("day"); },
  newPlan: () => go("setup"),
  selDay: el => { state.selDay = el.dataset.id; save(); vHome(); },
  start: () => { const d = nextDay(); if (d) startTraining(d); },
  editDay: el => { state.editDay = el.dataset.id; go("day"); },
  addDay: () => { const d = { id: uid(), name: "Tag " + (state.plan.days.length + 1), items: [] }; state.plan.days.push(d); save(); state.editDay = d.id; go("day"); },
  delDay: () => openSheet(`<h2>Tag löschen?</h2><p class="muted">„${esc(curDay().name)}“ wird aus dem Plan entfernt. Dein Verlauf bleibt erhalten.</p>
    <button class="btn block" style="background:var(--bad);color:#fff" data-a="confirmDelDay">Löschen</button><button class="btn block" data-a="closeSheet">Abbrechen</button>`),
  confirmDelDay: () => { state.plan.days = state.plan.days.filter(d => d.id !== state.editDay); save(); closeSheet(); go("plan"); },
  moveItem: el => { const d = curDay(), i = +el.dataset.i2; [d.items[i - 1], d.items[i]] = [d.items[i], d.items[i - 1]]; save(); vDay(); },
  editItem: el => openItem(+el.dataset.i2),
  draft: el => { const k = el.dataset.k; draft[k] = Math.max(1, Math.min(k === "sets" ? 10 : 50, draft[k] + +el.dataset.d));
    if (k === "rmin" && draft.rmax < draft.rmin) draft.rmax = draft.rmin; if (k === "rmax" && draft.rmin > draft.rmax) draft.rmin = draft.rmax;
    $sheet.querySelector(".sheet").innerHTML = `<div class="grab"></div>` + itemSheet(); },
  draftRest: el => { draft.rest = +el.dataset.s; $sheet.querySelector(".sheet").innerHTML = `<div class="grab"></div>` + itemSheet(); },
  saveItem: () => { const d = curDay(), i = draft._i; delete draft._i; d.items[i] = draft; save(); closeSheet(); vDay(); },
  delItem: () => { curDay().items.splice(draft._i, 1); save(); closeSheet(); vDay(); },
  openPicker: () => openPicker(),
  pickFilter: el => { pickFilter = el.dataset.k; refreshPicker(); },
  pick: el => { addToDay(el.dataset.id); el.querySelector(".badge").textContent = "✓ Hinzugefügt"; el.querySelector(".badge").className = "badge up"; },
  addCustom: () => { const name = byId("cName").value.trim(); if (!name) { byId("cName").focus(); return; }
    const c = { id: "c-" + uid(), name, muscle: byId("cMuscle").value, sec: [], type: "plate" }; state.custom.push(c); addToDay(c.id); closeSheet(); },
  adj: el => { const s = S(), x = s.list[s.idx], t = x.sets[curSetIdx(x)], d = +el.dataset.d;
    if (el.dataset.k === "kg") { t.kg = Math.max(0, Math.round(((t.kg ?? 0) + d * x.step) * 100) / 100); byId("kgIn").value = kgTxt(t.kg); }
    else { t.reps = Math.max(0, t.reps + d); byId("repsIn").value = t.reps; }
    // gleiches Gewicht für die restlichen Sätze übernehmen
    if (el.dataset.k === "kg") x.sets.forEach(o => { if (!o.done) o.kg = t.kg; });
    save(); },
  doneSet: () => doneSet(),
  skipRest: () => endRest(),
  restAdd: el => { const s = S(); s.restEnd += +el.dataset.d * 1000; s.restTotal = Math.max(1, s.restTotal + +el.dataset.d); save(); tick(); },
  openJump: () => openSheet(jumpSheet()),
  jump: el => { const s = S(); s.idx = +el.dataset.i2; s.phase = "set"; save(); closeSheet(); render(); },
  askStop: () => { const s = S(), any = s.list.some(x => x.sets.some(t => t.done));
    openSheet(`<h2>Training beenden?</h2>
      ${any ? `<button class="btn primary block" data-a="stopSave">Speichern & beenden</button>` : `<p class="muted">Du hast noch keinen Satz abgeschlossen.</p>`}
      <button class="btn block danger" data-a="stopDiscard">Verwerfen</button><button class="btn block" data-a="closeSheet">Weiter trainieren</button>`); },
  openSwap: () => { swapPerm = false; openSheet(swapSheet()); },
  swapMode: el => { swapPerm = el.dataset.v === "1"; $sheet.querySelector(".sheet").innerHTML = `<div class="grab"></div>` + swapSheet(); },
  swap: el => {
    const s = S(), x = s.list[s.idx], newId = el.dataset.id;
    const entry = makeEntry({ id: x.itemId, exId: newId, sets: x.sets.length, rmin: x.rmin, rmax: x.rmax, rest: x.rest });
    s.list[s.idx] = entry;
    if (swapPerm) { const d = state.plan?.days.find(dd => dd.id === s.dayId); const it = d?.items.find(i => i.id === x.itemId); if (it) it.exId = newId; }
    save(); closeSheet(); render();
  },
  editSet: el => { const s = S(); setEdit = { i: +el.dataset.i2, ...s.list[s.idx].sets[+el.dataset.i2] }; openSheet(setSheet()); },
  setAdj: el => { const x = S().list[S().idx];
    if (el.dataset.k === "kg") setEdit.kg = Math.max(0, Math.round(((setEdit.kg ?? 0) + +el.dataset.d * x.step) * 100) / 100);
    else setEdit.reps = Math.max(0, setEdit.reps + +el.dataset.d);
    $sheet.querySelector(".sheet").innerHTML = `<div class="grab"></div>` + setSheet(); },
  setSave: () => { const t = S().list[S().idx].sets[setEdit.i]; t.kg = setEdit.kg; t.reps = setEdit.reps; save(); closeSheet(); render(); },
  stopSave: () => finish(true),
  stopDiscard: () => finish(false)
};
function addToDay(exId) {
  const d = curDay(), g = GOALS[state.plan.goal] || GOALS.aufbau;
  d.items.push({ id: uid(), exId, sets: 3, rmin: g.rmin, rmax: g.rmax, rest: g.rest }); save(); vDay();
}
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-a]"); if (!el || el.disabled) return;
  const f = A[el.dataset.a]; if (f) f(el, ev);
});
document.addEventListener("input", ev => {
  const el = ev.target, k = el.dataset.i; if (!k) return;
  if (k === "dayName") { const d = curDay(); if (d && el.value.trim()) { d.name = el.value.trim(); save(); } }
  else if (k === "pickQ") { pickQuery = el.value; refreshPicker(); }
  else if (k === "note") { const v = el.value.trim(); if (v) state.notes[el.dataset.ex] = v; else delete state.notes[el.dataset.ex]; save(); }
  else if (k === "kg" || k === "reps") {
    const s = S(), x = s.list[s.idx], t = x.sets[curSetIdx(x)]; if (!t) return;
    if (k === "kg") { t.kg = num(el.value); x.sets.forEach(o => { if (!o.done) o.kg = t.kg; }); } else t.reps = Math.max(0, Math.round(num(el.value) || 0));
    save();
  }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeSheet(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && state.session) { awake(true); tick(); } });

go(view);
if (state.session) startTick();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && location.hostname.endsWith("github.io"))
  navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
