<title>Trainingsplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  /* Layout: App-Shell mit einer Spalte (max. 560px), große Titel, Tab-Leiste unten; Training im Vollbild ohne Tabs */
  :root{
    --bg:#101215; --surface:#191c21; --surface2:#22262d; --line:#2b3038;
    --text:#f2f3f5; --muted:#8c93a0; --accent:#ff6b1a; --accent-soft:rgba(255,107,26,.38);
    --ok:#2bb673; --warn:#f2b233; --bad:#ef5350;
    --fig:#2a2f37; --muscle:#3a404a; --band:rgba(255,255,255,.13);
    --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
    --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
    --bg:#f2f3f5; --surface:#ffffff; --surface2:#eceef1; --line:#e0e3e8;
    --text:#14171c; --muted:#646c78; --accent:#e85a0c; --accent-soft:rgba(232,90,12,.32);
    --ok:#1c9a5c; --warn:#d99a12; --bad:#d93a37; --fig:#d9dde3; --muscle:#c3c8d0; --band:rgba(20,23,28,.12); color-scheme:light}}
  :root[data-theme="light"]{
    --bg:#f2f3f5; --surface:#ffffff; --surface2:#eceef1; --line:#e0e3e8;
    --text:#14171c; --muted:#646c78; --accent:#e85a0c; --accent-soft:rgba(232,90,12,.32);
    --ok:#1c9a5c; --warn:#d99a12; --bad:#d93a37; --fig:#d9dde3; --muscle:#c3c8d0; --band:rgba(20,23,28,.12); color-scheme:light}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4;
    padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
    padding-block:12px 112px;max-width:560px;margin:0 auto}
  body.training{padding-bottom:24px}
  h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;margin:6px 0 0;text-wrap:balance;letter-spacing:.005em}
  h2{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;margin:0;text-wrap:balance}
  h3{font-size:16px;font-weight:600;margin:0}
  p{margin:0}
  .stack{display:grid;gap:12px}
  .stack-lg{display:grid;gap:20px}
  .card{background:var(--surface);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
  .muted{color:var(--muted)}
  .small{font-size:14px}
  .label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
  .row{display:flex;gap:10px;align-items:center;min-width:0}
  .row>.grow{flex:1;min-width:0}
  .between{justify-content:space-between}
  .wrap{flex-wrap:wrap}
  .num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button:disabled{opacity:.4;cursor:default}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:600;background:var(--surface2);color:var(--text)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ok{background:var(--ok);color:#fff}
  .btn.danger{color:var(--bad)}
  .btn.block{width:100%}
  .btn.xl{padding:18px;font-size:19px;border-radius:16px}
  .btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
  .icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:inline-grid;place-items:center;flex:0 0 auto}
  .link{color:var(--accent);font-weight:600}
  .chip{padding:8px 13px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:600;white-space:nowrap}
  .chip.on{background:var(--accent);color:#fff}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
  .badge.up{background:rgba(43,182,115,.16);color:var(--ok)}
  .badge.pr{background:var(--accent-soft);color:var(--text)}

  input,select{font:inherit;width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}

  .list{display:grid}
  .li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0;text-align:left;width:100%}
  .li:first-child{border-top:0;padding-top:0}
  .li:last-child{padding-bottom:0}
  .li .grow{flex:1;min-width:0}

  /* Tab-Leiste */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    display:flex;justify-content:center;
    padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
  nav.tabs .in{display:flex;width:100%;max-width:560px}
  nav.tabs button{flex:1;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted)}
  nav.tabs button.on{color:var(--accent)}
  nav.tabs svg{width:24px;height:24px}

  /* Figur */
  .fig{display:block;width:100%;height:auto}
  .fig .base{fill:var(--fig)}
  .fig .m{fill:var(--muscle);transition:fill .3s}

  /* Woche */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
  .week .d{display:grid;gap:6px;justify-items:center;font-size:12px;color:var(--muted);font-weight:600}
  .week .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:13px;color:var(--muted)}
  .week .dot.done{background:var(--accent);color:#fff}
  .week .dot.today{box-shadow:0 0 0 2px var(--accent) inset;color:var(--text)}

  /* Training */
  .t-top{display:flex;align-items:center;gap:10px}
  .bar{height:5px;background:var(--surface2);border-radius:5px;overflow:hidden}
  .bar>div{height:100%;background:var(--accent);transition:width .3s}
  .sets{display:flex;gap:6px;flex-wrap:wrap}
  .set-pill{min-width:34px;height:34px;padding:0 8px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
  .set-pill.done{background:var(--ok);color:#fff}
  .set-pill.cur{box-shadow:0 0 0 2px var(--accent) inset}
  .big-step{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}
  .big-step button{height:56px;border-radius:14px;background:var(--surface2);font-size:26px;font-weight:600}
  .big-step input{text-align:center;font-family:var(--display);font-weight:700;font-size:40px;padding:4px;border:0;background:transparent;font-variant-numeric:tabular-nums}
  .unit{font-size:13px;color:var(--muted);text-align:center;margin-top:-4px}
  .ring{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:4px auto;max-width:100%}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .t{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:4px}
  .ring .t .num{font-size:72px}
  .note-in{background:transparent;border:1px dashed var(--line);padding:9px 12px;font-size:14px}
  .tips summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px;list-style:none}
  .tips summary::-webkit-details-marker{display:none}
  .tips summary::before{content:"＋ "}
  .tips[open] summary::before{content:"− "}
  .tips ol{margin:8px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14px;max-width:65ch}
  textarea{font:inherit;font-size:12px;width:100%;min-height:90px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:ui-monospace,Menlo,monospace;word-break:break-all}

  /* Sheet */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;display:grid;gap:14px;
    padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    animation:up .22s ease-out}
  .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 4px}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}

  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surface2);padding:4px;border-radius:12px}
  .seg button{padding:10px 4px;border-radius:9px;font-weight:600;font-size:15px}
  .seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .mini-step{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center}
  .mini-step button{height:44px;border-radius:12px;background:var(--surface2);font-size:20px}
  .mini-step output{text-align:center;font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}

  .bars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:120px}
  .bars .b{background:var(--accent);border-radius:6px 6px 2px 2px;min-height:3px}
  .bars .b.zero{background:var(--surface2)}
  .bars-x{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;font-size:11px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

  .stat{display:grid;gap:4px}
  .reason{font-size:14px;line-height:1.35;background:var(--surface2);padding:10px 12px;border-radius:12px}
  .reason.up b{color:var(--ok)}
  .reason.down b{color:var(--warn)}
  .setting{justify-self:start;text-align:left;font-size:14px;color:var(--muted);padding:2px 0}
  .setting b{color:var(--text)}
  .steps2{display:grid;gap:10px}
  .steps2 .big-step{grid-template-columns:64px 1fr 64px}
  .steps2 .big-step button{height:60px}
  .steps2 .unit{margin-top:-2px}
  .actions3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .actions3 .btn{padding:11px 6px;font-size:13px}
  .tiplist{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px;max-width:65ch}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .mlist{display:grid;gap:8px}
  .mrow{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center}
  .mtrack{position:relative;height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}
  .mband{position:absolute;top:0;bottom:0;background:var(--band)}
  .seg.feel button.on{background:var(--accent);color:#fff;box-shadow:none}
  .mfill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;opacity:.95}
  .stat .num{font-size:30px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media (prefers-reduced-motion: reduce){.sheet{animation:none}.bar>div,.fig .m{transition:none}}
</style>

<p id="saveWarn" class="reason" role="alert" hidden style="margin-bottom:12px;color:var(--bad)">Speichern im Browser ist fehlgeschlagen (Speicher voll oder privates Surfen). Bitte unter Plan eine Sicherung kopieren.</p>

  <button data-a="tab" data-v="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Verlauf</button>
</div></nav>

<script>
(() => {
"use strict";

/* ================= Daten ================= */
const MUSCLES = {
  brust:"Brust", ruecken:"Rücken", schultern:"Schultern", bizeps:"Bizeps", trizeps:"Trizeps",
  bauch:"Bauch", beinev:"Beine vorn", beineh:"Beine hinten", po:"Po", waden:"Waden"
};
// [id, Name, Hauptmuskel, Nebenmuskeln, Gerätetyp] – Hammer Strength
const LIB = [
  ["hs-chest","Iso-Lateral Chest Press","brust",["trizeps","schultern"],"plate"],
  ["hs-incline","Iso-Lateral Incline Press","brust",["schultern","trizeps"],"plate"],
  ["hs-decline","Iso-Lateral Decline Press","brust",["trizeps"],"plate"],
  ["hs-widechest","Iso-Lateral Wide Chest","brust",["schultern"],"plate"],
  ["hs-fly","Pec Fly","brust",["schultern"],"stack"],
  ["hs-row","Iso-Lateral Row","ruecken",["bizeps","schultern"],"plate"],
  ["hs-lowrow","Iso-Lateral Low Row","ruecken",["bizeps"],"plate"],
  ["hs-highrow","Iso-Lateral High Row","ruecken",["bizeps","schultern"],"plate"],
  ["hs-pulldown","Iso-Lateral Front Lat Pulldown","ruecken",["bizeps"],"plate"],
  ["hs-dyrow","Iso-Lateral D.Y. Row","ruecken",["bizeps"],"plate"],
  ["hs-lat","Lat Pulldown","ruecken",["bizeps"],"stack"],
  ["hs-shoulder","Iso-Lateral Shoulder Press","schultern",["trizeps"],"plate"],
  ["hs-lateral","Lateral Raise","schultern",[],"plate"],
  ["hs-reardelt","Rear Delt","schultern",["ruecken"],"stack"],
  ["hs-curl","Biceps Curl","bizeps",[],"plate"],
  ["hs-dip","Seated Dip","trizeps",["brust","schultern"],"plate"],
  ["hs-triext","Triceps Extension","trizeps",[],"stack"],
  ["hs-legpress","Linear Leg Press","beinev",["po","beineh"],"plate"],
  ["hs-isolegpress","Iso-Lateral Leg Press","beinev",["po"],"plate"],
  ["hs-vsquat","V-Squat","beinev",["po"],"plate"],
  ["hs-hack","Hack Squat","beinev",["po"],"plate"],
  ["hs-legext","Iso-Lateral Leg Extension","beinev",[],"plate"],
  ["hs-kneelcurl","Iso-Lateral Kneeling Leg Curl","beineh",[],"plate"],
  ["hs-seatcurl","Seated Leg Curl","beineh",[],"stack"],

  ["hs-ab","Ab Crunch","bauch",[],"stack"]

// Kurze Ausführungstipps (Einstellung · Bewegung · Fehler vermeiden)
const TIPS = {
  "hs-chest":["Sitz so einstellen, dass die Griffe auf Brusthöhe sind","Schulterblätter zusammen und nach unten, dann drücken","Ellbogen nicht ganz durchstrecken, langsam zurück"],
  "hs-incline":["Griffe auf Höhe der oberen Brust","Brust raus, Schulterblätter fest in die Lehne","Unten kurz dehnen, kontrolliert hochdrücken"],
  "hs-decline":["Griffe auf Höhe der unteren Brust","Rücken fest an der Lehne, Füße fest am Boden","Nach vorn-unten drücken, Schultern bleiben unten"],
  "hs-widechest":["Griffe auf Brusthöhe, Hände weit","Ellbogen leicht gebeugt, nach vorn zusammenführen","Langsam zurück bis zur Dehnung in der Brust"],
  "hs-fly":["Arme auf Schulterhöhe, Ellbogen leicht gebeugt","Bogenförmig zusammenführen, kurz halten","Nicht über die Dehnung hinaus zurückgehen"],
  "hs-row":["Brust an das Polster, Arme ganz gestreckt","Ellbogen nah am Körper nach hinten ziehen","Schulterblätter am Ende zusammen, nicht mit dem Oberkörper reißen"],
  "hs-lowrow":["Brust ans Polster, Füße fest","Zum Bauch ziehen, Ellbogen eng","Am Ende kurz halten, langsam nach vorn"],
  "hs-highrow":["Sitz so, dass die Griffe über Kopf sind","Diagonal nach unten-hinten ziehen","Schultern weg von den Ohren"],
  "hs-pulldown":["Knie fest unter das Polster","Griffe zur oberen Brust ziehen, Brust raus","Oben ganz strecken, nicht nach hinten lehnen"],
  "hs-dyrow":["Brust ans Polster, Arme lang","Ellbogen Richtung Hüfte ziehen","Langsam zurück, Rücken bleibt gerade"],
  "hs-lat":["Knie fixieren, Stange etwas breiter als schulterbreit","Zur oberen Brust ziehen, Ellbogen nach unten","Oben kontrolliert strecken"],
  "hs-shoulder":["Griffe etwa auf Kinnhöhe","Gerade nach oben drücken, Rücken an der Lehne","Kein Hohlkreuz, Ellbogen nicht durchschlagen"],
  "hs-lateral":["Polster an den Oberarmen, Sitz so, dass die Schulter auf Drehachse ist","Arme seitlich bis Schulterhöhe heben","Langsam ablassen, nicht schwingen"],
  "hs-reardelt":["Brust ans Polster, Arme auf Schulterhöhe","Arme in weitem Bogen nach hinten","Schulterblätter nicht hochziehen"],
  "hs-curl":["Oberarme flach auf dem Polster, Ellbogen auf Drehachse","Hoch bis zur vollen Beugung","Unten fast ganz strecken, ohne Schwung"],
  "hs-dip":["Sitz so, dass die Griffe neben der Hüfte sind","Nach unten drücken bis die Arme fast gestreckt sind","Oberkörper aufrecht, Schultern unten"],
  "hs-triext":["Oberarme aufs Polster, Ellbogen auf Drehachse","Arme ganz strecken, kurz halten","Langsam beugen, Oberarme bleiben liegen"],
  "hs-legpress":["Füße schulterbreit mittig auf der Platte","Knie zeigen in Richtung Zehen","Unten Po bleibt am Polster, oben Knie nicht durchstrecken"],
  "hs-isolegpress":["Füße hüftbreit, Rücken fest an der Lehne","Kontrolliert tief, Knie folgen den Zehen","Oben Knie leicht gebeugt lassen"],
  "hs-vsquat":["Schultern unter die Polster, Füße leicht vor dem Körper","Tief beugen, Rücken bleibt an der Lehne","Über die ganze Fußsohle hochdrücken"],
  "hs-hack":["Rücken flach an der Lehne, Füße schulterbreit","Tief gehen, Knie Richtung Zehen","Fersen bleiben auf der Platte"],
  "hs-legext":["Knie auf Höhe der Drehachse, Polster über dem Knöchel","Beine ganz strecken, oben kurz halten","Langsam ablassen, nicht fallen lassen"],
  "hs-kneelcurl":["Knie aufs Polster, Polster über der Ferse","Ferse zum Po ziehen","Hüfte bleibt am Polster, langsam zurück"],
  "hs-seatcurl":["Knie auf Drehachse, Oberschenkelpolster fest","Fersen nach unten-hinten ziehen","Langsam zurück, nicht abfedern"],
  "hs-hipthrust":["Oberer Rücken an der Bank, Füße hüftbreit","Hüfte hochdrücken, Po oben fest anspannen","Kein Hohlkreuz, Kinn leicht zur Brust"],
  "hs-calf":["Fußballen auf die Kante, Schultern unter die Polster","Ganz hoch auf die Zehen, kurz halten","Unten voll dehnen"],
  "hs-seatcalf":["Polster fest auf die Oberschenkel, Ballen auf die Kante","Fersen ganz hoch drücken","Langsam tief in die Dehnung"],
  "hs-ab":["Füße einhaken, Griffe neben dem Kopf","Oberkörper einrollen, Bauch fest","Nicht mit den Armen ziehen, langsam zurück"]
};

const GOALS = {
  aufbau:{ label:"Muskelaufbau", rmin:8, rmax:12, rest:90 },
  kraft:{ label:"Kraft", rmin:4, rmax:6, rest:180 },
  fit:{ label:"Fitness & Straffung", rmin:12, rmax:15, rest:60 }
};
const TEMPLATES = {
  2:[["Ganzkörper A",["hs-chest","hs-row","hs-legpress","hs-shoulder","hs-seatcurl","hs-ab"]],
     ["Ganzkörper B",["hs-incline","hs-pulldown","hs-hack","hs-lateral","hs-dip","hs-calf"]]],
  3:[["Push",["hs-chest","hs-incline","hs-shoulder","hs-lateral","hs-dip"]],
     ["Pull",["hs-row","hs-pulldown","hs-highrow","hs-reardelt","hs-curl"]],
     ["Beine",["hs-legpress","hs-hack","hs-legext","hs-seatcurl","hs-hipthrust","hs-calf"]]],
  4:[["Oberkörper A",["hs-chest","hs-row","hs-shoulder","hs-pulldown","hs-curl","hs-dip"]],
     ["Unterkörper A",["hs-legpress","hs-legext","hs-seatcurl","hs-hipthrust","hs-calf"]],
     ["Oberkörper B",["hs-incline","hs-lowrow","hs-lat","hs-lateral","hs-reardelt","hs-triext"]],
     ["Unterkörper B",["hs-vsquat","hs-isolegpress","hs-kneelcurl","hs-hipthrust","hs-seatcalf","hs-ab"]]]
};

const KEY = "trainingsplan-v2";
const uid = () => Math.random().toString(36).slice(2, 10);
const STEPS = [1.25, 2.5, 5, 10];
const SMALL = new Set(["schultern", "bizeps", "trizeps"]);
/* ---------- Laden, Bereinigen, Speichern ---------- */
function blank() { return { v: 3, plan: null, custom: [], dev: {}, notes: {}, history: [], weights: [], session: null, selDay: null, hints: {} }; }
const isObj = o => !!o && typeof o === "object" && !Array.isArray(o);
const clampInt = (v, lo, hi, def) => { const n = Math.round(+v); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : def; };
const kgOrNull = v => { const n = typeof v === "number" ? v : (v === null || v === undefined || String(v).trim() === "" ? null : +String(v).replace(",", ".")); return n === null || !Number.isFinite(n) || n < 0 || n > 1000 ? null : Math.round(n * 100) / 100; };
// Gültiger Arbeitssatz = Gewicht > 0 und mindestens 1 Wiederholung
const validSet = s => !!s && typeof s.kg === "number" && s.kg > 0 && Number.isInteger(s.reps) && s.reps >= 1;

// Gerät aus Bibliothek/eigenem Gerät + persönlichen Anpassungen (reine Funktion, auch beim Laden nutzbar)
function devFrom(s, id) {
  const b = LIB.find(e => e.id === id) || (s.custom || []).find(e => e.id === id) || { id, name: "Unbekanntes Gerät", muscle: "brust", sec: [], type: "plate" };
  const d = Object.assign({ sec: [] }, b, (s.dev || {})[id] || {});
  d.base = b;
  if (d.type === "stack") d.load = "total";
  else if (d.load !== "side" && d.load !== "total") d.load = /Iso-Lateral/.test(b.name) ? "side" : "total";
  if (!(d.step > 0)) d.step = d.type === "stack" ? 5 : d.load === "side" ? (SMALL.has(d.muscle) ? 1.25 : 2.5) : 5;
  d.sec = (d.sec || []).filter(m => MUSCLES[m] && m !== d.muscle);
  return d;
}
// Einheit: s = Scheiben pro Seite, t = Scheiben insgesamt, b = Steckgewicht am Block
const unitOf = d => d.type === "stack" ? "b" : d.load === "side" ? "s" : "t";

function normalize(raw) {
  const s = blank();
  if (!isObj(raw)) return s;
  s.custom = Array.isArray(raw.custom) ? raw.custom.filter(c => isObj(c) && c.id && c.name).map(c => ({
    id: String(c.id), name: String(c.name).slice(0, 80), muscle: MUSCLES[c.muscle] ? c.muscle : "brust",
    sec: Array.isArray(c.sec) ? c.sec.filter(m => MUSCLES[m]) : [], type: c.type === "stack" ? "stack" : "plate" })) : [];
  if (isObj(raw.dev)) for (const [id, o] of Object.entries(raw.dev)) {
    if (!isObj(o)) continue;
    const d = {};
    if (typeof o.name === "string" && o.name.trim()) d.name = o.name.trim().slice(0, 80);
    if (MUSCLES[o.muscle]) d.muscle = o.muscle;
    if (Array.isArray(o.sec)) d.sec = o.sec.filter(m => MUSCLES[m]);
    if (o.type === "plate" || o.type === "stack") d.type = o.type;
    if (o.load === "side" || o.load === "total") d.load = o.load;
    if (+o.step > 0 && +o.step <= 50) d.step = +o.step;
    if (o.off === true) d.off = true;
    s.dev[id] = d;
  }
  if (isObj(raw.notes)) for (const [id, v] of Object.entries(raw.notes)) if (typeof v === "string" && v.trim()) s.notes[id] = v.slice(0, 120);
  if (isObj(raw.plan) && Array.isArray(raw.plan.days)) s.plan = {
    goal: GOALS[raw.plan.goal] ? raw.plan.goal : "aufbau",
    level: raw.plan.level === "fortgeschritten" ? "fortgeschritten" : "einsteiger",
    minutes: clampInt(raw.plan.minutes, 0, 300, 0) || null,
    days: raw.plan.days.filter(d => isObj(d) && Array.isArray(d.items)).map(d => ({
      id: String(d.id || uid()), name: String(d.name || "Trainingstag").slice(0, 60),
      items: d.items.filter(i => isObj(i) && i.exId).map(i => { const rmin = clampInt(i.rmin, 1, 50, 8);
        return { id: String(i.id || uid()), exId: String(i.exId), sets: clampInt(i.sets, 1, 10, 3), rmin,
          rmax: Math.max(rmin, clampInt(i.rmax, 1, 50, rmin)), rest: clampInt(i.rest, 0, 600, 90) }; }) })) };
  const cleanSet = t => { const o = { kg: kgOrNull(t.kg), reps: clampInt(t.reps, 0, 999, 0) }; if (["l", "m", "h"].includes(t.f)) o.f = t.f; return o; };
  // Verlauf: nichts verwerfen, nur Typen absichern; fehlende Einheit einmalig aus dem damaligen Gerät festschreiben
  s.history = Array.isArray(raw.history) ? raw.history.filter(h => isObj(h) && Array.isArray(h.exercises)).map(h => ({
    id: String(h.id || uid()), dayId: h.dayId ? String(h.dayId) : null, day: String(h.day || "Training"),
    date: isNaN(new Date(h.date)) ? new Date().toISOString() : new Date(h.date).toISOString(),
    durationSec: clampInt(h.durationSec, 0, 86400, 0),
    exercises: h.exercises.filter(x => isObj(x) && x.exId).map(x => ({
      exId: String(x.exId), name: String(x.name || devFrom(s, String(x.exId)).name),
      u: ["s", "t", "b"].includes(x.u) ? x.u : unitOf(devFrom(s, String(x.exId))),
      sets: Array.isArray(x.sets) ? x.sets.filter(isObj).map(cleanSet) : [] })) })) : [];
  s.weights = Array.isArray(raw.weights) ? raw.weights.filter(w => isObj(w) && /^\d{4}-\d{2}-\d{2}$/.test(w.d) && +w.kg >= 30 && +w.kg <= 300).map(w => ({ d: w.d, kg: +w.kg })) : [];
  if (isObj(raw.session) && Array.isArray(raw.session.list) && raw.session.list.length) {
    const r = raw.session;
    const list = r.list.filter(x => isObj(x) && x.exId && Array.isArray(x.sets) && x.sets.length).map(x => ({
      key: String(x.key || uid()), itemId: x.itemId ? String(x.itemId) : null, exId: String(x.exId),
      rmin: clampInt(x.rmin, 1, 50, 8), rmax: clampInt(x.rmax, 1, 50, 12), rest: clampInt(x.rest, 0, 600, 90),
      u: ["s", "t", "b"].includes(x.u) ? x.u : unitOf(devFrom(s, String(x.exId))),
      mode: ["up", "down", "hold", "keep"].includes(x.mode) ? x.mode : "keep", why: String(x.why || ""),
      sets: x.sets.filter(isObj).map(t => Object.assign(cleanSet(t), { done: !!t.done })) }));
    if (list.length) s.session = { dayId: r.dayId ? String(r.dayId) : null, dayName: String(r.dayName || "Training"),
      start: +r.start || Date.now(), idx: Math.min(list.length - 1, clampInt(r.idx, 0, 99, 0)),
      phase: r.phase === "rest" ? "rest" : "set", restEnd: +r.restEnd || 0, restTotal: +r.restTotal || 0,
      paused: +r.paused || null, lastDone: isObj(r.lastDone) ? { key: String(r.lastDone.key), si: clampInt(r.lastDone.si, 0, 99, 0) } : null, list };
  }
  s.selDay = typeof raw.selDay === "string" ? raw.selDay : null;
  if (isObj(raw.hints)) for (const [k, v] of Object.entries(raw.hints)) if (v === true) s.hints[k] = true;
  return s;
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {}
  const s = blank();
  try { // Version 1 übernehmen
    const old = JSON.parse(localStorage.getItem("trainingsplan-v1") || "null");
    if (old && Array.isArray(old.days) && old.days.length) {
      s.plan = { goal: "aufbau", level: "einsteiger", days: old.days.map(d => ({ id: uid(), name: d.name,
        items: (d.exercises || []).map(e => ({ id: uid(), exId: exIdByName(e.name, s), sets: e.sets, rmin: e.reps, rmax: e.reps, rest: e.rest })) })) };
      return normalize(s);
    }
  } catch (e) {}
  return s;
}
let saveFailed = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); saveFailed = false; }
  catch (e) { saveFailed = true; const b = document.getElementById("saveWarn"); if (b) b.hidden = false; }
}
function exIdByName(name, s) {
  const hit = LIB.find(e => e.name.toLowerCase() === name.toLowerCase()) || s.custom.find(e => e.name.toLowerCase() === name.toLowerCase());
  if (hit) return hit.id;
  const c = { id: "c-" + uid(), name, muscle: "brust", sec: [], type: "plate" };
  s.custom.push(c); return c.id;
}

// Erst jetzt laden: alle Hilfsfunktionen für Bereinigung/Migration sind definiert
let state = blank();
state = load();

/* ---------- Geräte ---------- */
const ex = id => devFrom(state, id);
const allEx = () => LIB.concat(state.custom).map(e => ex(e.id));
const UNIT = { s: "kg pro Seite", t: "kg insgesamt", b: "kg am Gewichtsblock" };
const UNIT_SHORT = { s: "pro Seite", t: "insgesamt", b: "am Block" };
const unitTxt = e => UNIT[unitOf(e)];
const loadTxt = e => e.type === "stack" ? "Steckgewicht" : e.load === "side" ? "Scheiben, pro Seite" : "Scheiben, insgesamt";
const stepTxt = e => `${kgTxt(e.step)} kg${e.load === "side" && e.type !== "stack" ? " pro Seite" : ""}`;
// Volumen: bei „pro Seite“ zählen beide Seiten; Einheit kommt aus dem gespeicherten Eintrag
const setVol = (entry, t) => validSet(t) ? t.kg * t.reps * ((entry.u || unitOf(ex(entry.exId))) === "s" ? 2 : 1) : 0;
// Nicht verfügbares Gerät durch ein verfügbares für denselben Muskel ersetzen
function availId(id, used) {
  const e = ex(id); if (!e.off) return id;
  const alt = allEx().find(a => !a.off && a.muscle === e.muscle && !used.has(a.id));
  return alt ? alt.id : null;
}

function generatePlan(goal, days, level, minutes) {
  const g = GOALS[goal];
  return { goal, level, minutes, days: TEMPLATES[days].map(([name, tpl]) => {
    // Vorhandene Vorlagen-Geräte zuerst reservieren, damit ein Ersatz keine Doppelung erzeugt
    const used = new Set(tpl.filter(id => !ex(id).off));
    const ids = tpl.map(id => { const a = availId(id, used); if (a) used.add(a); return a; }).filter(Boolean);
    const items = ids.map((id, i) => ({ id: uid(), exId: id, sets: level === "fortgeschritten" && i < 2 ? 4 : 3,
      rmin: g.rmin, rmax: g.rmax, rest: i < 2 ? g.rest : Math.max(60, g.rest - 30) }));
    const day = { id: uid(), name, items };
    // An die gewünschte Trainingszeit anpassen: erst Übungen am Ende kürzen, dann Sätze
    while (minutes && estMinutes(day) > minutes && items.length > 3) items.pop();
    for (let i = items.length - 1; minutes && estMinutes(day) > minutes && i >= 0; i--) if (items[i].sets > 2) items[i].sets--;
    return day;
  }) };
}

const $tabs = document.getElementById("tabs");
const $sheet = document.getElementById("sheet-root");

let summary = null;
let pickerCtx = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const s = String(v ?? "").replace(",", ".").trim(); return s === "" || isNaN(+s) ? null : +s; };
const kgTxt = v => v === null || v === undefined ? "–" : (Number.isInteger(+v) ? String(+v) : (+v).toFixed(2).replace(/0$/, "").replace(".", ","));
const fmtTime = sec => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
const repsTxt = it => it.rmin === it.rmax ? String(it.rmin) : it.rmin + "–" + it.rmax;
const byId = id => document.getElementById(id);

// Letzte Leistung an diesem Gerät: nur gültige Arbeitssätze mit derselben Gewichtsangabe
function lastPerf(exId, u = unitOf(ex(exId))) {
  for (let i = state.history.length - 1; i >= 0; i--) {
    const e = state.history[i].exercises.find(x => x.exId === exId && x.u === u);
    if (e) { const v = e.sets.filter(validSet); if (v.length) return v; }
  }
  return null;
}
function bestKg(exId, u = unitOf(ex(exId))) {
  let best = null;
  for (const h of state.history) for (const e of h.exercises)
    if (e.exId === exId && e.u === u) for (const s of e.sets) if (validSet(s) && (best === null || s.kg > best)) best = s.kg;
  return best;
}
function estMinutes(day) {
  return Math.round(day.items.reduce((a, it) => a + it.sets * (40 + it.rest), 0) / 60);
}
function nextDay() {
  const days = state.plan?.days || [];
  if (!days.length) return null;
  if (state.selDay) { const d = days.find(x => x.id === state.selDay); if (d) return d; }
  nextReason = "";
  const last = state.history[state.history.length - 1];
  if (!last) return days[0];
  const i = days.findIndex(d => d.id === last.dayId);
  const rot = days[(i + 1) % days.length] || days[0];
  // Ist der geplante Tag noch nicht erholt, einen erholten Tag vorschlagen
  const rec = recovery();
  // Erholung eines Tages = Durchschnitt der Hauptmuskeln, gewichtet nach Sätzen
  const score = d => { const n = d.items.reduce((a, it) => a + it.sets, 0); return n ? d.items.reduce((a, it) => a + rec[ex(it.exId).muscle] * it.sets, 0) / n : 100; };
  const sr = score(rot);
  if (sr < 50) {
    const alt = days.filter(d => d !== rot && d.items.length).map(d => [d, score(d)]).sort((a, b) => b[1] - a[1])[0];
    if (alt && alt[1] >= 55 && alt[1] - sr >= 25) {
      const tiredM = [...new Set(rot.items.map(it => ex(it.exId).muscle))].filter(m => rec[m] < 60).map(m => MUSCLES[m]);
      nextReason = `${tiredM.slice(0, 2).join(" und ")} ${tiredM.length > 1 ? "sind" : "ist"} noch nicht erholt. Heute lieber ${alt[0].name}, ${rot.name} danach.`;
      return alt[0];
    }
  }
  return rot;
}
let nextReason = "";
function e1rm(t) { return t.kg ? t.kg * (1 + Math.min(t.reps, 12) / 30) : 0; }
function sessionsE1(exId) {
  const u = unitOf(ex(exId));
  return state.history.map(h => h.exercises.find(x => x.exId === exId && x.u === u)).filter(Boolean)
    .map(x => Math.max(0, ...x.sets.filter(validSet).map(e1rm))).filter(v => v > 0);
}
function plateau(exId) {
  const v = sessionsE1(exId);
  if (v.length < 4) return false;
  const before = Math.max(...v.slice(0, -3)), recent = Math.max(...v.slice(-3));
  return recent <= before + 0.01;
}

/* Ton & Wachhalten */
let actx = null;
function tone(freq = 880, dur = .18, vol = .25) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(vol, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
let wl = null;
async function awake(on) {
  try { if (on && "wakeLock" in navigator && !wl) { wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => wl = null); }
        else if (!on && wl) { await wl.release(); wl = null; } } catch (e) {}
}

const FIG = (() => {
  const E = (m, cx, cy, rx, ry) => ({ m, s:`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>` });
  const R = (m, x, y, w, h, r) => ({ m, s:`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/>` });
  const C = (m, cx, cy, r) => ({ m, s:`<circle cx="${cx}" cy="${cy}" r="${r}"/>` });
  const body = o => [
    C(null, 50+o, 13, 9), R(null, 46+o, 20, 8, 8, 3), R(null, 34+o, 29, 32, 60, 12),
    E(null, 24+o, 83, 4, 11), E(null, 76+o, 83, 4, 11), C(null, 23+o, 97, 3.6), C(null, 77+o, 97, 3.6),
    R(null, 36+o, 84, 28, 16, 7), E(null, 43+o, 172, 5, 3), E(null, 57+o, 172, 5, 3)
  ];
  const front = [...body(0),
    E("schultern",32,38,7,6.5), E("schultern",68,38,7,6.5),
    E("brust",43,47,8.5,7), E("brust",57,47,8.5,7),
    E("bizeps",27,60,4.8,10), E("bizeps",73,60,4.8,10),
    R("bauch",43.5,57,13,27,5),
    E("beinev",43,115,7,19), E("beinev",57,115,7,19),
    E("waden",43,152,4.5,14), E("waden",57,152,4.5,14)];
  const back = [...body(100),
    E("ruecken",150,34,10,5), E("schultern",132,38,7,6.5), E("schultern",168,38,7,6.5),
    E("ruecken",141,53,9.5,15), E("ruecken",159,53,9.5,15),
    E("trizeps",127,60,4.8,10), E("trizeps",173,60,4.8,10),
    E("po",143,94,8.5,8), E("po",157,94,8.5,8),
    E("beineh",143,119,7,16), E("beineh",157,119,7,16),
    E("waden",143,150,5.5,12), E("waden",157,150,5.5,12)];
  return front.concat(back);
})();
function figure(colors, label) {
  return `<svg class="fig" viewBox="10 0 180 180" role="img" aria-label="${esc(label || "Muskeln")}">` +
    FIG.map(p => p.m
      ? p.s.replace("/>", ` class="m" style="${colors[p.m] ? "fill:" + colors[p.m] : ""}"/>`)
      : p.s.replace("/>", ` class="base"/>`)).join("") + `</svg>`;
}
function workoutColors(items) {
  const c = {};
  items.forEach(it => { const e = ex(it.exId); e.sec.forEach(m => { if (!c[m]) c[m] = "var(--accent-soft)"; }); });
  items.forEach(it => { c[ex(it.exId).muscle] = "var(--accent)"; });
  return c;
}
function recovery() {
  const now = Date.now(), r = {};
  for (const m in MUSCLES) r[m] = 100;
  state.history.forEach(h => {
    const hrs = (now - new Date(h.date).getTime()) / 36e5;
    h.exercises.forEach(x => {
      const e = ex(x.exId);
      const apply = (m, full) => { r[m] = Math.min(r[m], Math.max(0, Math.min(100, hrs / full * 100))); };
      apply(e.muscle, 72); e.sec.forEach(m => apply(m, 48));
    });
  });
  return r;
}
const recColor = p => p >= 85 ? "var(--ok)" : p >= 45 ? "var(--warn)" : "var(--bad)";

function vHome() {
  if (!state.plan) return go("setup");
  const day = nextDay();
  const now = new Date(); const dow = (now.getDay() + 6) % 7;
  const monday = new Date(now); monday.setHours(0, 0, 0, 0); monday.setDate(now.getDate() - dow);
  const doneDays = new Set(state.history.map(h => { const d = new Date(h.date); d.setHours(0, 0, 0, 0); return d.getTime(); }));
  const week = ["Mo","Di","Mi","Do","Fr","Sa","So"].map((n, i) => {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    return `<div class="d">${n}<div class="dot ${doneDays.has(d.getTime()) ? "done" : ""} ${i === dow ? "today" : ""}">${d.getDate()}</div></div>`;
  }).join("");
  const thisWeek = state.history.filter(h => new Date(h.date) >= monday).length;
  const goal = Math.max(1, state.plan.days.length);
  const streak = weekStreak(monday, goal);
  const rec = recovery(); const recC = {}; for (const m in rec) recC[m] = recColor(rec[m]);
  const tired = Object.entries(rec).filter(([, p]) => p < 85).sort((a, b) => a[1] - b[1]);
  const lastH = state.history[state.history.length - 1];
  const ago = lastH ? Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(lastH.date).setHours(0, 0, 0, 0)) / 864e5) : null;
  const agoTxt = ago === null ? "" : ago === 0 ? "heute" : ago === 1 ? "gestern" : `vor ${ago} Tagen`;
  let why = nextReason;
  if (!why && day) why = !lastH ? "Dein erstes Training. Wähle Gewichte, die du sauber kontrollieren kannst."
    : `Zuletzt ${lastH.day} (${agoTxt}). In deinem Ablauf ist jetzt ${day.name} dran.`;
  if (day && ago !== null && ago >= 10) why += " Nach längerer Pause lieber etwas leichter einsteigen.";
  const ses = state.session;

  $app.innerHTML = `<div class="stack-lg">
    <div><div class="label">${now.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" })}</div><h1>Heute</h1></div>
    ${!state.hints.units && state.history.some(h => h.exercises.some(x => x.u === "s")) ? `<div class="card">
        <div class="label">Neu: Gewicht pro Seite</div>
        <p class="small">Iso-Lateral-Geräte zählen jetzt „kg pro Seite“. Deine bisherigen Einträge an diesen Geräten wurden so eingeordnet. Hast du dort das Gesamtgewicht notiert, stell das Gerät auf „Insgesamt“ und die früheren Einträge mit um.</p>
        <div class="row wrap" style="gap:8px"><button class="btn sm primary" data-a="hintUnitsOpen">Geräte prüfen</button><button class="btn sm" data-a="hintUnitsDone">Passt so</button></div>
      </div>` : ""}
    ${ses ? (() => { const tot = ses.list.reduce((a, l) => a + l.sets.length, 0), dn = ses.list.reduce((a, l) => a + l.sets.filter(t => t.done).length, 0);
      return `<div class="card">
        <div class="label">Training pausiert</div>
        <h2>${esc(ses.dayName)}</h2>
        <p class="muted small">${dn} von ${tot} Sätzen erledigt</p>
        <div class="bar"><div style="width:${Math.round(dn / tot * 100)}%"></div></div>
        <button class="btn ok xl block" data-a="resumeT">Fortsetzen</button>
        <button class="link small" data-a="askStop" style="justify-self:center">Beenden oder verwerfen</button>
      </div>`; })() : ""}
    ${day && !ses ? `<div class="card">
      <div class="row between"><div class="label">Das trainierst du heute</div><span class="badge">≈ ${estMinutes(day)} Min.</span></div>
      <div class="row" style="align-items:flex-start">
        <div class="grow stack" style="gap:6px"><h2>${esc(day.name)}</h2>
          <p class="muted small">${day.items.length} Übungen · ${day.items.reduce((a, i) => a + i.sets, 0)} Sätze</p>
          <p class="small">${[...new Set(day.items.map(i => MUSCLES[ex(i.exId).muscle]))].join(", ") || "Noch keine Übungen"}</p>
          </div>
        <div style="width:118px;flex:0 0 118px">${figure(workoutColors(day.items), "Muskeln in diesem Training")}</div>
      </div>
      ${why ? `<p class="reason" ${nextReason ? 'style="color:var(--text)"' : ""}>${nextReason ? '<b style="color:var(--warn)">Angepasst:</b> ' : ""}${esc(why)}</p>` : ""}
      ${state.plan.days.length > 1 ? `<div class="chips">${state.plan.days.map(d =>
        `<button class="chip ${d.id === day.id ? "on" : ""}" data-a="selDay" data-id="${d.id}">${esc(d.name)}</button>`).join("")}</div>` : ""}
      <button class="btn ok xl block" data-a="start" ${day.items.length ? "" : "disabled"}>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>Start</button>
      ${day.items.length ? "" : `<button class="link small" data-a="editDay" data-id="${day.id}">Übungen hinzufügen</button>`}
    </div>` : ""}
    <div class="card">
      <div class="row between"><div class="label">Diese Woche</div>
        <span class="small" style="font-weight:600">${thisWeek} von ${goal} Trainings${thisWeek >= goal ? ' <span style="color:var(--ok)">✓</span>' : ""}</span></div>
      <div class="week">${week}</div>
      <div class="row" style="gap:12px;border-top:1px solid var(--line);padding-top:12px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="${streak ? "var(--accent)" : "var(--muscle)"}" aria-hidden="true"><path d="M12 2c1 3.5 5 6 5 11a5 5 0 0 1-10 0c0-2.2 1-3.8 2.2-5 .2 1.6.9 2.7 2 3.2C11 8.7 11 5.5 12 2z"/></svg>
        <div class="grow"><div class="num" style="font-size:24px">${streak} ${streak === 1 ? "Woche" : "Wochen"} in Folge</div>
          <div class="muted small">${streak ? "Wochenziel erreicht. Bleib dran!" : `Schaffe ${goal} Trainings pro Woche, um deine Serie zu starten.`}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="row between"><div class="label">Erholung</div>
        <span class="small muted">${tired.length ? "Noch nicht erholt: " + tired.slice(0, 2).map(([m]) => MUSCLES[m]).join(", ") : "Alles erholt"}</span></div>
      <div style="max-width:230px;margin:0 auto;width:100%">${figure(recC, "Erholung der Muskeln")}</div>
      <div class="legend"><span><i style="background:var(--ok)"></i>Erholt</span><span><i style="background:var(--warn)"></i>Teilweise</span><span><i style="background:var(--bad)"></i>Belastet</span></div>
    </div>
  </div>`;
}

function weekStreak(monday, goal) {
  const counts = {};
  state.history.forEach(h => { const d = new Date(h.date); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); counts[d.getTime()] = (counts[d.getTime()] || 0) + 1; });
  let n = 0; const w = new Date(monday);
  if ((counts[w.getTime()] || 0) >= goal) n++; // laufende Woche zählt nur, wenn schon erreicht
  for (;;) { w.setDate(w.getDate() - 7); if ((counts[w.getTime()] || 0) >= goal) n++; else break; }
  return n;
}

/* ================= Training ================= */
function startTraining(day) {
  tone(660, .08, .05); // Ton durch den Tap freischalten
  state.session = {
    dayId: day.id, dayName: day.name, start: Date.now(), idx: 0, phase: "set", restEnd: 0, restTotal: 0,
    list: day.items.map(makeEntry)
  };
  state.selDay = null; save(); awake(true); go("train"); startTick();
}
function makeEntry(it) {
  const e = ex(it.exId), u = unitOf(e), unit = UNIT[u], step = e.step;
  const last = lastPerf(it.exId, u);               // nur gültige Sätze, gleiche Einheit
  const reps = last ? last.map(s => s.reps) : [];
  const top = last ? Math.max(...last.map(s => s.kg)) : null;
  const repsList = reps.join("/");
  const lastHard = !!(last && last[last.length - 1].f === "h");
  const allTop = !!last && reps.every(r => r >= it.rmax);
  const allEasy = !!last && last.every(s => s.f === "l") && reps.every(r => r >= it.rmin);
  const below = !!last && reps.every(r => r < it.rmin);

    ${Array.from({ length: daysIn }, (_, i) => `<div class="d"><div class="dot ${trained[i + 1] ? "done" : ""} ${isThisMonth && i + 1 === now.getDate() ? "today" : ""}" ${trained[i + 1] ? `title="${esc(trained[i + 1])}"` : ""}>${i + 1}</div></div>`).join("")}</div>`;
  const monthCount = Object.keys(trained).length;
  const four = Date.now() - 28 * 864e5;
  const perWeek = H.filter(h => new Date(h.date).getTime() >= four).length / 4;

  $app.innerHTML = `<div class="stack-lg">
    <div><div class="label">${H.length} ${H.length === 1 ? "Training" : "Trainings"} insgesamt</div><h1>Verlauf</h1></div>
    ${weightCard()}
    <div class="card">
      <div class="row between"><div class="label">Sätze pro Muskel · diese Woche</div><span class="small muted">Ziel ${tmin}–${tmax}</span></div>
      <div class="mlist">${muscleRows}</div>
      <p class="muted small">Der helle Bereich zeigt die empfohlenen Sätze pro Woche für ${(GOALS[goalKey] || GOALS.aufbau).label}. Mittrainierte Muskeln zählen halb.</p>
    </div>
    <div class="card">
      <div class="row between"><div class="label">Volumen pro Woche</div><span class="small muted">max. ${max >= 1000 ? (max / 1000).toFixed(1).replace(".", ",") + " t" : Math.round(max) + " kg"}</span></div>
      <div class="bars">${weeks.map(w => `<div class="b ${w.vol ? "" : "zero"}" style="height:${w.vol ? Math.max(3, w.vol / max * 100) : 3}%" title="${Math.round(w.vol)} kg"></div>`).join("")}</div>
      <div class="bars-x">${weeks.map((w, i) => `<span>${i === 7 ? "Jetzt" : w.s.getDate() + "." + (w.s.getMonth() + 1) + "."}</span>`).join("")}</div>
    </div>
    <div class="card">
      <div class="row between">
        <button class="icon-btn" data-a="calMonth" data-d="-1" aria-label="Voriger Monat">‹</button>
        <div class="grow" style="text-align:center"><div style="font-weight:600">${cm.toLocaleDateString("de-DE", { month: "long", year: "numeric" })}</div>
          <div class="muted small">${monthCount} ${monthCount === 1 ? "Trainingstag" : "Trainingstage"} · Ø ${String(Math.round(perWeek * 10) / 10).replace(".", ",")} pro Woche (letzte 4 Wochen)</div></div>
        <button class="icon-btn" data-a="calMonth" data-d="1" aria-label="Nächster Monat" ${calOffset >= 0 ? "disabled" : ""}>›</button>
      </div>

    ${bestList.length ? `<div class="card"><div class="row between"><div class="label">Bestwerte</div><span class="small muted">Antippen für Verlauf</span></div><div class="list">${bestList.map(b =>
      `<button class="li" data-a="showEx" data-id="${b.id}" data-u="${b.u}"><div class="grow ellipsis">${esc(b.name)}</div><span class="num" style="font-size:20px">${kgTxt(b.kg)}<span class="small muted"> kg ${UNIT_SHORT[b.u]} × ${b.reps}</span></span><span class="muted">›</span></button>`).join("")}</div></div>` : ""}
    <div class="stack">${H.length ? [...H].reverse().slice(0, 30).map(h => `
      <div class="card" style="gap:8px">
        <div class="row between"><h3>${esc(h.day)}</h3><span class="small muted">${new Date(h.date).toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" })} · ${Math.max(1, Math.round((h.durationSec || 0) / 60))} min</span></div>
        <p class="muted small">${h.exercises.map(x => { const v = x.sets.filter(validSet); return esc(x.name) + (v.length ? " " + kgTxt(Math.max(...v.map(t => t.kg))) + " kg " + UNIT_SHORT[x.u] : ""); }).join(" · ")}</p>
      </div>`).join("") : `<div class="card"><p class="muted">Noch keine Trainings. Nach deinem ersten Training siehst du hier Fortschritt und Bestwerte.</p></div>`}

}

let calOffset = 0;
function weightCard() {
  const W = (state.weights || []).slice().sort((a, b) => a.d.localeCompare(b.d));
  const today = new Date().toISOString().slice(0, 10);
  const todayEntry = W.find(w => w.d === today);
  const last = W[W.length - 1];
  // Veränderung gegenüber dem ältesten Eintrag der letzten 30 Tage
  const since = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
  const base = W.find(w => w.d >= since);
  const diff = last && base && last !== base ? Math.round((last.kg - base.kg) * 10) / 10 : null;
  let chart = "";
  const pts = W.slice(-30);
  if (pts.length >= 2) {
    const w = 320, h = 104, pl = 34, pr = 8, pt = 10, pb = 28;
    let lo = Math.min(...pts.map(p => p.kg)), hi = Math.max(...pts.map(p => p.kg));
    if (hi - lo < 1) { lo -= .5; hi += .5; }
    const t0 = new Date(pts[0].d).getTime(), t1 = new Date(pts[pts.length - 1].d).getTime() || t0 + 1;
    const X = p => pl + (new Date(p.d).getTime() - t0) / Math.max(1, t1 - t0) * (w - pl - pr);
    const Y = v => pt + (hi - v) / (hi - lo) * (h - pt - pb);
    const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p).toFixed(1)},${Y(p.kg).toFixed(1)}`).join("");
    const dl = s => { const d = new Date(s); return d.getDate() + "." + (d.getMonth() + 1) + "."; };
    chart = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Körpergewicht der letzten Einträge">
      <line x1="${pl}" x2="${w - pr}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--line)" stroke-dasharray="3 4"/>
      <line x1="${pl}" x2="${w - pr}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--line)" stroke-dasharray="3 4"/>
      <text x="${pl - 6}" y="${Y(hi) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${kgTxt(Math.round(hi * 10) / 10)}</text>
      <text x="${pl - 6}" y="${Y(lo) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${kgTxt(Math.round(lo * 10) / 10)}</text>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(pts[pts.length - 1])}" cy="${Y(pts[pts.length - 1].kg)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
      <text x="${pl}" y="${h - 4}" font-size="11" fill="var(--muted)">${dl(pts[0].d)}</text>
      <text x="${w - pr}" y="${h - 4}" text-anchor="end" font-size="11" fill="var(--muted)">${dl(pts[pts.length - 1].d)}</text></svg>`;
  }
  return `<div class="card">
    <div class="row between"><div class="label">Körpergewicht</div>
      ${diff !== null ? `<span class="small" style="font-weight:600">${diff > 0 ? "+" : ""}${kgTxt(diff)} kg in 30 Tagen</span>` : ""}</div>
    ${last ? `<div class="num" style="font-size:34px">${kgTxt(last.kg)}<span class="small muted"> kg</span></div>` : `<p class="muted small">Trag dein Gewicht ein, z. B. einmal pro Woche morgens. So siehst du deine Veränderung.</p>`}
    ${chart}
    <div class="row"><input id="bwIn" class="grow" inputmode="decimal" placeholder="${todayEntry ? "Heute: " + kgTxt(todayEntry.kg) + " kg" : "Gewicht heute in kg"}" aria-label="Körpergewicht in kg" autocomplete="off">
      <button class="btn primary" data-a="addWeight">${todayEntry ? "Ändern" : "Eintragen"}</button></div>
    <p class="error" id="bwErr" hidden>Bitte eine Zahl zwischen 30 und 300 eingeben.</p>
  </div>`;
}

function exChart(exId, u = unitOf(ex(exId))) {
  const all = state.history.map(h => { const x = h.exercises.find(e => e.exId === exId); if (!x) return null;
    const v = x.sets.filter(validSet); return v.length ? { d: new Date(h.date), kg: Math.max(...v.map(t => t.kg)), sets: v, u: x.u } : null; }).filter(Boolean);
  const other = all.filter(p => p.u !== u).length;
  const pts = all.filter(p => p.u === u).slice(-12);
  const name = ex(exId).name;
  const otherNote = other ? `<p class="muted small">${other} ${other === 1 ? "Eintrag" : "Einträge"} mit anderer Gewichtsangabe ausgeblendet, damit nichts Ungleiches verglichen wird.</p>` : "";
  if (!pts.length) return `<div class="row between"><h2 class="grow">${esc(name)}</h2><button class="btn sm" data-a="closeSheet">Schließen</button></div><p class="muted">Noch keine Daten mit „${UNIT[u]}“.</p>${otherNote}`;
  const W = 320, H = 150, pl = 36, pr = 12, pt = 14, pb = 26;
  let lo = Math.min(...pts.map(p => p.kg)), hi = Math.max(...pts.map(p => p.kg));
  if (hi === lo) { lo = Math.max(0, lo - 5); hi = hi + 5; }
  const X = i => pts.length === 1 ? (pl + W - pr) / 2 : pl + i * (W - pl - pr) / (pts.length - 1);
  const Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.kg).toFixed(1)}`).join("");
  const area = line + `L${X(pts.length - 1).toFixed(1)},${H - pb}L${X(0).toFixed(1)},${H - pb}Z`;
  const first = pts[0].kg, lastP = pts[pts.length - 1];
  const diff = lastP.kg - first;
  const dl = d => d.getDate() + "." + (d.getMonth() + 1) + ".";
  return `<div class="row between"><h2 class="grow">${esc(name)}</h2><button class="btn sm" data-a="closeSheet">Schließen</button></div>
    <div class="grid3">
      <div class="stat"><div class="label">Aktuell</div><div class="num">${kgTxt(lastP.kg)}<span class="small muted"> kg</span></div><div class="muted small">${UNIT_SHORT[u]} · ${lastP.sets.map(t => t.reps).join("/")} Wdh.</div></div>
      <div class="stat"><div class="label">Seit Beginn</div><div class="num" style="color:${diff > 0 ? "var(--ok)" : "var(--text)"}">${diff > 0 ? "+" : ""}${kgTxt(diff)}<span class="small muted"> kg</span></div></div>
      <div class="stat"><div class="label">Max. (1RM)</div><div class="num">≈${kgTxt(Math.round(Math.max(...lastP.sets.map(e1rm)) * 2) / 2)}<span class="small muted"> kg</span></div></div>
    </div>
    ${plateau(exId) ? `<p class="small" style="color:var(--warn)">Seit 3 Trainings kein Fortschritt. Probier ein anderes Gerät für denselben Muskel.</p>` : ""}${otherNote}
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Gewichtsverlauf ${esc(name)}">
      <line x1="${pl}" x2="${W - pr}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--line)" stroke-dasharray="3 4"/>
      <line x1="${pl}" x2="${W - pr}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--line)" stroke-dasharray="3 4"/>
      <text x="${pl - 6}" y="${Y(hi) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${kgTxt(hi)}</text>
      <text x="${pl - 6}" y="${Y(lo) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${kgTxt(lo)}</text>
      <path d="${area}" fill="var(--accent-soft)" opacity=".5"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.kg)}" r="${i === pts.length - 1 ? 5 : 3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join("")}
      <text x="${X(0)}" y="${H - 6}" text-anchor="${pts.length === 1 ? "middle" : "start"}" font-size="11" fill="var(--muted)">${dl(pts[0].d)}</text>
      ${pts.length > 1 ? `<text x="${X(pts.length - 1)}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--muted)">${dl(lastP.d)}</text>` : ""}
    </svg>
    <div class="list">${[...pts].reverse().slice(0, 5).map(p => `<div class="li"><div class="grow small muted">${p.d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" })}</div>
      <div class="small">${p.sets.map(t => (t.kg !== null ? kgTxt(t.kg) : "–") + "×" + t.reps).join(" · ")}</div></div>`).join("")}</div>`;
}

/* ================= Ticker ================= */
let timer = null;
function tick() {
  const s = S(); if (!s) return stopTick();
  const el = byId("elapsed"); if (el) el.textContent = fmtTime((Date.now() - s.start) / 1000);
  if (s.phase !== "rest") return;
  const left = (s.restEnd - Date.now()) / 1000;
  const t = byId("timer"); if (t) t.textContent = fmtTime(left);
  const arc = byId("ringArc"); if (arc) { const C = 2 * Math.PI * 54; arc.setAttribute("stroke-dashoffset", C * (1 - Math.max(0, s.restTotal ? left / s.restTotal : 0))); }
  const sec = Math.ceil(left);
  if (sec <= 3 && sec >= 1 && s.beeped !== sec) { s.beeped = sec; tone(660, .12); }
  if (left <= 0) { tone(990, .45); buzz([200, 100, 200]); endRest(); }
}
function startTick() { stopTick(); timer = setInterval(tick, 250); }
function stopTick() { if (timer) clearInterval(timer); timer = null; }

/* ================= Aktionen ================= */
const A = {
  tab: el => go(el.dataset.v),
  closeSheet: (el, ev) => { if (ev.target === el || el.tagName === "BUTTON") closeSheet(); },
  setup: el => { const k = el.dataset.k; setup[k] = k === "days" || k === "minutes" ? +el.dataset.val : el.dataset.val; vSetup(); },
  createPlan: () => { state.plan = generatePlan(setup.goal, setup.days, setup.level, setup.minutes); state.selDay = null; save(); go("home"); },
  calMonth: el => { calOffset += +el.dataset.d; vHistory(); },
  exportData: () => {
    const { session, ...rest } = state;
    const code = "TP1:" + btoa(unescape(encodeURIComponent(JSON.stringify(rest))));
    openSheet(`<h2>Sicherung</h2>
      <textarea id="expTxt" readonly aria-label="Sicherungscode">${esc(code)}</textarea>
      <p class="muted small" id="expMsg">${state.history.length} Trainings und ${state.plan?.days.length || 0} Trainingstage.</p>
      <button class="btn primary block" data-a="copyExp">Kopieren</button><button class="btn block" data-a="closeSheet">Schließen</button>`);
  },
  copyExp: () => {
    const t = byId("expTxt"), msg = byId("expMsg");
    const done = () => { msg.textContent = "Kopiert. Füge den Code jetzt z. B. in deine Notizen ein."; msg.style.color = "var(--ok)"; };
    try { navigator.clipboard.writeText(t.value).then(done, () => { t.select(); msg.textContent = "Text ist markiert. Tippe auf „Kopieren“ im Menü."; }); }
    catch (e) { t.select(); msg.textContent = "Text ist markiert. Tippe auf „Kopieren“ im Menü."; }
  },
  importOpen: () => openSheet(`<h2>Sicherung einfügen</h2>
    <textarea id="impTxt" placeholder="Code hier einfügen (beginnt mit TP1:)" aria-label="Sicherungscode"></textarea>
    <p class="muted small" id="impMsg">Achtung: Ersetzt Plan und Verlauf auf diesem Gerät.</p>
    <button class="btn primary block" data-a="importDo">Wiederherstellen</button><button class="btn block" data-a="closeSheet">Abbrechen</button>`),
  importDo: () => {
    const raw = byId("impTxt").value.trim(), msg = byId("impMsg");
    try {
      if (!raw.startsWith("TP1:")) throw 0;
      const data = JSON.parse(decodeURIComponent(escape(atob(raw.slice(4)))));
      if (!isObj(data) || !Array.isArray(data.history)) throw 0;
      state = normalize(Object.assign({}, data, { session: null })); save(); closeSheet(); go("home");
    } catch (e) { msg.textContent = "Der Code ist ungültig. Kopiere ihn vollständig, er beginnt mit TP1:"; msg.style.color = "var(--bad)"; }
  },
  showEx: el => openSheet(exChart(el.dataset.id, el.dataset.u)),
  addWeight: () => {
    const v = num(byId("bwIn").value);
    if (v === null || v < 30 || v > 300) { byId("bwErr").hidden = false; byId("bwIn").focus(); return; }
    const d = new Date().toISOString().slice(0, 10);
    state.weights = (state.weights || []).filter(w => w.d !== d).concat([{ d, kg: Math.round(v * 10) / 10 }]);
    save(); vHistory();
  },
  emptyPlan: () => { state.plan = { goal: setup.goal, level: setup.level, days: [{ id: uid(), name: "Tag 1", items: [] }] }; save(); state.editDay = state.plan.days[0].id; go("day"); },
  newPlan: () => go("setup"),
  selDay: el => { state.selDay = el.dataset.id; save(); vHome(); },
  start: () => { const d = nextDay(); if (d) startTraining(d); },
  editDay: el => { state.editDay = el.dataset.id; go("day"); },
  addDay: () => { const d = { id: uid(), name: "Tag " + (state.plan.days.length + 1), items: [] }; state.plan.days.push(d); save(); state.editDay = d.id; go("day"); },
  delDay: () => openSheet(`<h2>Tag löschen?</h2><p class="muted">„${esc(curDay().name)}“ wird aus dem Plan entfernt. Dein Verlauf bleibt erhalten.</p>
    <button class="btn block" style="background:var(--bad);color:#fff" data-a="confirmDelDay">Löschen</button><button class="btn block" data-a="closeSheet">Abbrechen</button>`),
  confirmDelDay: () => { state.plan.days = state.plan.days.filter(d => d.id !== state.editDay); save(); closeSheet(); go("plan"); },
  moveItem: el => { const d = curDay(), i = +el.dataset.i2; [d.items[i - 1], d.items[i]] = [d.items[i], d.items[i - 1]]; save(); vDay(); },
  editItem: el => openItem(+el.dataset.i2),
  draft: el => { const k = el.dataset.k; draft[k] = Math.max(1, Math.min(k === "sets" ? 10 : 50, draft[k] + +el.dataset.d));
    if (k === "rmin" && draft.rmax < draft.rmin) draft.rmax = draft.rmin; if (k === "rmax" && draft.rmin > draft.rmax) draft.rmin = draft.rmax;
    $sheet.querySelector(".sheet").innerHTML = `<div class="grab"></div>` + itemSheet(); },
  draftRest: el => { draft.rest = +el.dataset.s; $sheet.querySelector(".sheet").innerHTML = `<div class="grab"></div>` + itemSheet(); },
  saveItem: () => { const d = curDay(), i = draft._i; delete draft._i; d.items[i] = draft; save(); closeSheet(); vDay(); },
  delItem: () => { curDay().items.splice(draft._i, 1); save(); closeSheet(); vDay(); },
  openPicker: () => openPicker(),
  pickFilter: el => { pickFilter = el.dataset.k; refreshPicker(); },
  pick: el => { addToDay(el.dataset.id); el.querySelector(".badge").textContent = "✓ Hinzugefügt"; el.querySelector(".badge").className = "badge up"; },
  openDevs: () => { devFilter = "alle"; openSheet(devListHtml()); },
  devsDone: () => { closeSheet(); render(); },
  devFilt: el => { devFilter = el.dataset.k; openSheet(devListHtml()); },
  editDev: el => { const e = ex(el.dataset.id); devRet = el.dataset.ret || "list";
    devDraft = { id: e.id, name: e.name, muscle: e.muscle, sec: e.sec.slice(), type: e.type, load: e.load, step: e.step, off: !!e.off, note: state.notes[e.id] || "" };
    openSheet(devSheetHtml()); },
  newDev: el => { devRet = el.dataset.ret || "list";
    devDraft = { id: "c-" + uid(), _new: true, name: devRet === "pick" ? pickQuery : "", muscle: devRet === "pick" && pickFilter !== "alle" ? pickFilter : "brust",
      sec: [], type: "plate", load: "total", step: 5, off: false, note: "" };
    openSheet(devSheetHtml()); },
  devSec: el => { const k = el.dataset.k, s = devDraft.sec; devDraft.sec = s.includes(k) ? s.filter(m => m !== k) : s.concat(k);
    $sheet.querySelector(".sheet").innerHTML = `<div class="grab"></div>` + devSheetHtml(); },
  devSet: el => { const k = el.dataset.k, v = el.dataset.v;
    if ((k === "type" || k === "load") && unitLocked(devDraft.id)) return;
    devDraft[k] = k === "step" ? +v : k === "off" ? v === "true" : v;
    if (k === "type" && v === "stack") devDraft.load = "total";
    $sheet.querySelector(".sheet").innerHTML = `<div class="grab"></div>` + devSheetHtml(); },
  devSave: () => { const d = devDraft, name = (d.name || "").trim();
    if (!name) { const er = byId("devErr"); er.textContent = "Bitte einen Namen eingeben."; er.hidden = false; byId("devName").focus(); return; }
    const sec = d.sec.filter(m => m !== d.muscle);
    if (d.id.startsWith("c-")) {
      const c = state.custom.find(x => x.id === d.id);
      if (c) Object.assign(c, { name, muscle: d.muscle, sec, type: d.type }); else state.custom.push({ id: d.id, name, muscle: d.muscle, sec, type: d.type });
    }
    const oldU = unitOf(ex(d.id));
    state.dev[d.id] = { name, muscle: d.muscle, sec, type: d.type, load: d.type === "stack" ? "total" : d.load, step: d.step, off: d.off };
    // Laufendes Training: noch nicht begonnene Übungen dieses Geräts mit neuer Einstellung neu berechnen
    const ses = state.session;
    if (ses) ses.list = ses.list.map(x => x.exId === d.id && !x.sets.some(t => t.done) && unitOf(ex(d.id)) !== oldU
      ? makeEntry({ id: x.itemId, exId: x.exId, sets: x.sets.length, rmin: x.rmin, rmax: x.rmax, rest: x.rest }) : x);
    if ((d.note || "").trim()) state.notes[d.id] = d.note.trim(); else delete state.notes[d.id];
    save(); devBack(d._new ? d.id : null); },
  devCancel: () => devBack(null),
  devRelabelAsk: () => { const d = devDraft, tu = draftUnit(d), n = otherUnitCount(d);
    openSheet(`<h2>Frühere Einträge umstellen?</h2>
      <p>${n} ${n === 1 ? "Eintrag" : "Einträge"} von „${esc(d.name)}“ ${n === 1 ? "wird" : "werden"} als „${UNIT[tu]}“ gewertet. Die eingetragenen Zahlen ändern sich nicht.</p>
      <p class="muted small">Danach zählen sie für Vorschläge, Bestwerte und Volumen mit. Das Gerät wird dabei mit dieser Gewichtsangabe gespeichert.</p>
      <button class="btn primary block" data-a="devRelabel">Umstellen</button><button class="btn block" data-a="devRelabelBack">Zurück</button>`); },
  devRelabelBack: () => openSheet(devSheetHtml()),
  devRelabel: () => { const d = devDraft, tu = draftUnit(d);
    state.history.forEach(h => h.exercises.forEach(x => { if (x.exId === d.id) x.u = tu; }));
    const base = state.dev[d.id] || {};
    state.dev[d.id] = Object.assign({}, base, { type: d.type, load: d.type === "stack" ? "total" : d.load });
    save(); openSheet(devSheetHtml()); },
  hintUnitsDone: () => { state.hints.units = true; save(); render(); },
  hintUnitsOpen: () => { state.hints.units = true; save(); devFilter = "alle"; openSheet(devListHtml()); },
  devReset: () => { delete state.dev[devDraft.id]; save(); devBack(null); },
  devDelete: () => { const id = devDraft.id;
    if (state.plan?.days.some(d => d.items.some(i => i.exId === id))) { const er = byId("devErr"); er.textContent = "Das Gerät ist noch in deinem Plan. Entferne es dort zuerst."; er.hidden = false; return; }
    state.custom = state.custom.filter(c => c.id !== id); delete state.dev[id]; save(); devBack(null); },
  adj: el => { const s = S(), x = s.list[s.idx], t = x.sets[curSetIdx(x)], d = +el.dataset.d;
    const base = typeof t.kg === "number" && t.kg >= 0 ? t.kg : 0;
    if (el.dataset.k === "kg") { t.kg = Math.max(0, Math.round((base + d * ex(x.exId).step) * 100) / 100); byId("kgIn").value = kgTxt(t.kg); }
    else { t.reps = Math.min(100, Math.max(0, (Number.isInteger(t.reps) ? t.reps : 0) + d)); byId("repsIn").value = t.reps; }
    showSetError("");
    // gleiches Gewicht für die restlichen Sätze übernehmen
    if (el.dataset.k === "kg") x.sets.forEach(o => { if (!o.done) o.kg = t.kg; });
    save(); },
  doneSet: () => doneSet(),
  skipRest: () => endRest(),
  restAdd: el => { const s = S(); s.restEnd += +el.dataset.d * 1000; s.restTotal = Math.max(1, s.restTotal + +el.dataset.d); save(); tick(); },
  openJump: () => openSheet(jumpSheet()),
  jump: el => { const s = S(); s.idx = +el.dataset.i2; s.phase = "set"; save(); closeSheet(); render(); },
  moveEnd: el => { const s = S(), i = +el.dataset.i2, [m] = s.list.splice(i, 1); s.list.push(m);
    if (i === s.idx) afterListChange(i); else { if (i < s.idx) s.idx--; save(); openSheet(jumpSheet()); } },
  endEx: () => { const s = S(), x = s.list[s.idx]; x.sets = x.sets.filter(t => t.done);
    const i = s.idx; if (!x.sets.length) s.list.splice(i, 1); afterListChange(x.sets.length ? i + 1 : i); },
  openDevInfo: () => openSheet(devInfoSheet()),
  askStop: () => { const s = S(), any = s.list.some(x => x.sets.some(t => t.done));
    openSheet(`<h2>Training unterbrechen?</h2>
      <button class="btn primary block" data-a="pauseT">Pausieren, später weitermachen</button>
      ${any ? `<button class="btn block" data-a="stopSave">Speichern & beenden</button>` : ""}
      <button class="btn block danger" data-a="askDiscard">Verwerfen</button>
      <button class="btn block" data-a="closeSheet">Weiter trainieren</button>`); },
  askDiscard: () => openSheet(`<h2>Training verwerfen?</h2><p class="muted">Alle Sätze dieser Einheit gehen verloren.</p>
      <button class="btn block" style="background:var(--bad);color:#fff" data-a="stopDiscard">Verwerfen</button><button class="btn block" data-a="closeSheet">Zurück</button>`),
  pauseT: () => { const s = S(); s.paused = Date.now(); stopTick(); awake(false); save(); closeSheet(); go("home"); },
  resumeT: () => { const s = S(); if (!s) return; if (s.paused) { const d = Date.now() - s.paused; s.start += d; s.paused = null; }
    s.phase = "set"; save(); awake(true); go("train"); startTick(); },
  openSwap: () => { swapPerm = false; openSheet(swapSheet()); },
  swapMode: el => { swapPerm = el.dataset.v === "1"; $sheet.querySelector(".sheet").innerHTML = `<div class="grab"></div>` + swapSheet(); },
  swap: el => {
    const s = S(), x = s.list[s.idx], newId = el.dataset.id;
    const entry = makeEntry({ id: x.itemId, exId: newId, sets: x.sets.length, rmin: x.rmin, rmax: x.rmax, rest: x.rest });
    s.list[s.idx] = entry;
    if (swapPerm) { const d = state.plan?.days.find(dd => dd.id === s.dayId); const it = d?.items.find(i => i.id === x.itemId); if (it) it.exId = newId; }
    save(); closeSheet(); render();
  },
  editSet: el => { const s = S(), x = s.list.find(l => l.key === el.dataset.key) || s.list[s.idx]; setEdit = { key: x.key, i: +el.dataset.i2, ...x.sets[+el.dataset.i2] }; openSheet(setSheet()); },
  setAdj: el => { const x = S().list.find(l => l.key === setEdit.key);
    if (el.dataset.k === "kg") setEdit.kg = Math.max(0, Math.round(((setEdit.kg ?? 0) + +el.dataset.d * ex(x.exId).step) * 100) / 100);
    else setEdit.reps = Math.max(0, setEdit.reps + +el.dataset.d);
    $sheet.querySelector(".sheet").innerHTML = `<div class="grab"></div>` + setSheet(); },
  setSave: () => { const err = setError(setEdit); if (err) { const el = byId("setEditErr"); el.textContent = err; el.hidden = false; return; }
    const t = S().list.find(l => l.key === setEdit.key).sets[setEdit.i]; t.kg = setEdit.kg; t.reps = setEdit.reps; save(); closeSheet(); render(); },
  feel: el => { const s = S(), ld = s.lastDone; const x = ld && s.list.find(l => l.key === ld.key); if (!x) return; const t = x.sets[ld.si]; t.f = t.f === el.dataset.f ? undefined : el.dataset.f; save(); render(); },
  stopSave: () => finish(true),
  stopDiscard: () => finish(false)
};
function addToDay(exId) {
  const d = curDay(), g = GOALS[state.plan.goal] || GOALS.aufbau;
  d.items.push({ id: uid(), exId, sets: 3, rmin: g.rmin, rmax: g.rmax, rest: g.rest }); save(); vDay();
}
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-a]"); if (!el || el.disabled) return;
  const f = A[el.dataset.a]; if (f) f(el, ev);
});
document.addEventListener("input", ev => {
  const el = ev.target, k = el.dataset.i; if (!k) return;
  if (k === "dayName") { const d = curDay(); if (d && el.value.trim()) { d.name = el.value.trim(); save(); } }
  else if (k === "pickQ") { pickQuery = el.value; refreshPicker(); }
  else if (k === "devName") devDraft.name = el.value;
  else if (k === "devMuscle") devDraft.muscle = el.value;
  else if (k === "devNote") devDraft.note = el.value;
  else if (k === "note") { const v = el.value.trim(); if (v) state.notes[el.dataset.ex] = v; else delete state.notes[el.dataset.ex]; save(); }
  else if (k === "kg" || k === "reps") {
    const s = S(), x = s.list[s.idx], t = x.sets[curSetIdx(x)]; if (!t) return;
    if (k === "kg") {
      const v = num(el.value);
      t.kg = v === null ? null : v;                 // ungültige Werte bleiben sichtbar, „Satz fertig“ prüft
      if (v === null || (v > 0 && v <= 1000)) x.sets.forEach(o => { if (!o.done) o.kg = t.kg; });
    } else { const v = num(el.value); t.reps = v === null ? NaN : v; }
    showSetError(""); save();
  }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeSheet(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && state.session) { awake(true); tick(); } });

if (/[?&]test\b/.test(location.search)) window.__tp = { makeEntry, normalize, setVol, ex, unitOf, unitTxt, lastPerf, validSet, setError, get state() { return state; } };
go(view);
if (state.session && !state.session.paused) startTick();
// Offline-Speicher nur in der eigenständigen Web-App (nicht eingebettet auf claude.ai)
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") && window.top === window.self && !/claude/.test(location.hostname))
  navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
