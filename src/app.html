<title>Trainingsplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  /* =====================================================================
     Designsystem „Instrument“
     Layout: Inhalte direkt auf Graphit, Hierarchie über Typografie und Weißraum.
     Gruppierte Listen nur für echte Listen. Eine orange Hauptaktion je Ansicht,
     im Training fest im Daumenbereich (über der Tastatur).
     ===================================================================== */
  :root{
    /* Farben (dunkel = Standard) */
    --bg:#0D0E10; --raise:#16181B; --raise-2:#202328; --raise-3:#2A2E34;
    --hair:rgba(255,255,255,.07); --text:#F3F4F5; --text-2:#A1A7B0; --text-3:#6C727C;
    --mbody:var(--text-2); --mbody2:var(--text-3); --mgear:var(--raise-3); --mgear-line:var(--text-3);
    --accent:#FF6B1A; --accent-press:#E85C0E; --accent-tint:rgba(255,107,26,.14); --on-accent:#FFFFFF;
    --ok:#3CCB7F; --ok-tint:rgba(60,203,127,.14); --warn:#F5B740; --warn-tint:rgba(245,183,64,.12); --bad:#F2554F;
    --fig:#24272C; --muscle:#363A41; --band:rgba(255,255,255,.10); --scrim:rgba(0,0,0,.6);
    --bar-bg:rgba(13,14,16,.88); --accent-soft:rgba(255,107,26,.42); --sheet:#17191C; --seg-on:#2A2E34;
    /* Schrift */
    --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
    --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    /* Raster (4er-Schritte) */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
    --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:28px;
    --gutter:20px; --tap:48px;
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
    --bg:#F4F5F7; --raise:#FFFFFF; --raise-2:#E9EBEF; --raise-3:#DCE0E5;
    --hair:rgba(15,17,20,.09); --text:#0F1114; --text-2:#5A616B; --text-3:#8C929B;
    --accent:#F0600E; --accent-press:#D9540A; --accent-tint:rgba(240,96,14,.11);
    --ok:#1F9D5B; --ok-tint:rgba(31,157,91,.12); --warn:#C98A0C; --warn-tint:rgba(201,138,12,.12); --bad:#D93A37;
    --fig:#E2E5E9; --muscle:#C8CDD4; --band:rgba(15,17,20,.10); --scrim:rgba(15,17,20,.38);
    --bar-bg:rgba(244,245,247,.9); --accent-soft:rgba(240,96,14,.36); --sheet:#FFFFFF; --seg-on:#FFFFFF; color-scheme:light}}
  :root[data-theme="light"]{
    --bg:#F4F5F7; --raise:#FFFFFF; --raise-2:#E9EBEF; --raise-3:#DCE0E5;
    --hair:rgba(15,17,20,.09); --text:#0F1114; --text-2:#5A616B; --text-3:#8C929B;
    --accent:#F0600E; --accent-press:#D9540A; --accent-tint:rgba(240,96,14,.11);
    --ok:#1F9D5B; --ok-tint:rgba(31,157,91,.12); --warn:#C98A0C; --warn-tint:rgba(201,138,12,.12); --bad:#D93A37;
    --fig:#E2E5E9; --muscle:#C8CDD4; --band:rgba(15,17,20,.10); --scrim:rgba(15,17,20,.38);
    --bar-bg:rgba(244,245,247,.9); --accent-soft:rgba(240,96,14,.36); --sheet:#FFFFFF; --seg-on:#FFFFFF; color-scheme:light}

  /* ---------- Grundlage ---------- */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;
    padding-left:max(var(--gutter), env(safe-area-inset-left, 0px));padding-right:max(var(--gutter), env(safe-area-inset-right, 0px));
    padding-block:var(--s4) 120px;max-width:600px;margin:0 auto;font-variant-numeric:tabular-nums}
  body.training{padding-bottom:132px}
  body.has-bar{padding-bottom:180px}
  p{margin:0}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
  button:disabled{opacity:.38;cursor:default}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
  [hidden]{display:none!important}
  svg{flex:0 0 auto}

  /* ---------- Typografie ---------- */
  .cap{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
  .label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
  .title{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:.005em;margin:var(--s1) 0 0;text-wrap:balance}
  .hero-name{font-family:var(--display);font-weight:800;font-size:clamp(34px, 11vw, 48px);line-height:.95;margin:0;text-wrap:balance;overflow-wrap:break-word;hyphens:auto}
  h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.02;margin:0;text-wrap:balance}
  h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;margin:0;text-wrap:balance}
  h3{font-size:17px;font-weight:600;margin:0;line-height:1.3}
  .sub{font-size:15px;color:var(--text-2)}
  .small{font-size:14px}
  .muted{color:var(--text-2)}
  .faint{color:var(--text-3)}
  .num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .error{color:var(--bad);font-size:14px;font-weight:500}

  /* ---------- Layout ---------- */
  .page{display:grid;gap:var(--s6)}
  .stack{display:grid;gap:var(--s3)}
  .stack-sm{display:grid;gap:var(--s2)}
  .row{display:flex;align-items:center;gap:var(--s3);min-width:0}
  .row>.grow,.grow{flex:1;min-width:0}
  .between{justify-content:space-between}
  .wrap{flex-wrap:wrap}
  .head{display:grid;gap:var(--s1)}
  .section{display:grid;gap:var(--s3)}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
  .section-head h2{font-size:22px}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s5);
    border-radius:var(--r);font-weight:600;font-size:16px;background:var(--raise-2);color:var(--text);transition:transform .08s,background .15s}
  .btn:active:not(:disabled){transform:scale(.98)}
  .btn.primary{background:var(--accent);color:var(--on-accent)}
  .btn.primary:active:not(:disabled){background:var(--accent-press)}
  .btn.block{width:100%}
  .btn.xl{min-height:58px;font-size:18px;border-radius:var(--r-lg)}
  .btn.sm{min-height:40px;padding:0 var(--s4);font-size:15px;border-radius:12px}
  .btn.danger{color:var(--bad)}
  .btn.quiet{background:transparent;color:var(--text-2)}
  .link{color:var(--accent);font-weight:600;min-height:32px;display:inline-flex;align-items:center}
  .icon-btn{width:44px;height:44px;border-radius:50%;background:var(--raise-2);display:inline-grid;place-items:center;flex:0 0 auto;color:var(--text)}
  .icon-btn.plain{background:transparent}

  /* Feste Aktionsleiste im Daumenbereich (folgt der Tastatur) */
  .actionbar{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:25;background:var(--bar-bg);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    padding:var(--s3) max(var(--gutter), env(safe-area-inset-right, 0px)) calc(var(--s3) + env(safe-area-inset-bottom, 0px)) max(var(--gutter), env(safe-area-inset-left, 0px))}
  .actionbar .in{max-width:600px;margin:0 auto;display:grid;gap:var(--s2)}

  /* ---------- Chips, Badges, Segment ---------- */
  .chips{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gutter));padding:0 var(--gutter)}
  .chips::-webkit-scrollbar{display:none}
  .chips.wrap{flex-wrap:wrap;margin:0;padding:0}
  .chip{min-height:38px;padding:0 var(--s4);border-radius:999px;background:var(--raise-2);font-size:15px;font-weight:600;white-space:nowrap;color:var(--text-2)}
  .chip.on{background:var(--text);color:var(--bg)}
  .badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--raise-2);color:var(--text-2);white-space:nowrap}
  .badge.fav{background:var(--accent);color:var(--on-accent)}
  .badge.up{background:var(--ok-tint);color:var(--ok)}
  .badge.pr{background:var(--accent-tint);color:var(--accent)}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--raise-2);padding:3px;border-radius:12px}
  .seg button{min-height:40px;border-radius:10px;font-weight:600;font-size:15px;color:var(--text-2);text-align:center}
  .seg button.on{background:var(--seg-on);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.18)}

  /* ---------- Gruppierte Listen ---------- */
  .group{background:var(--raise);border-radius:var(--r-lg);overflow:hidden}
  .li{display:flex;align-items:center;gap:var(--s3);min-height:56px;padding:var(--s3) var(--s4);width:100%;text-align:left;position:relative;min-width:0}
  .group>.li+.li::before,.group>*+.li::before{content:"";position:absolute;top:0;left:var(--s4);right:0;height:1px;background:var(--hair)}
  .li .grow{flex:1;min-width:0}
  .li .t{font-weight:600;font-size:16px}
  .li .s{font-size:14px;color:var(--text-2);margin-top:1px}
  .chev{color:var(--text-3);font-size:20px;line-height:1}
  .plain-list>.li{padding-left:0;padding-right:0}
  .hopen{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;min-height:44px}
  .hopen .t,.hopen .s{display:block}.hopen .row{display:flex}
  .hx-sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .hx-sets .set-pill{flex:0 0 auto;padding:0 12px;min-width:64px}
  .plain-list>.li+.li::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--hair)}

  /* ---------- Formular ---------- */
  input,select{font:inherit;width:100%;min-height:var(--tap);padding:0 var(--s4);border-radius:var(--r);border:1px solid transparent;background:var(--raise-2);color:var(--text)}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  label{display:block;font-size:14px;font-weight:600;color:var(--text-2);margin-bottom:var(--s2)}
  textarea{font:inherit;font-size:12px;width:100%;min-height:96px;padding:var(--s3);border-radius:var(--r);border:1px solid transparent;background:var(--raise-2);color:var(--text);font-family:ui-monospace,Menlo,monospace;word-break:break-all}
  .field{display:grid;gap:var(--s2)}
  .field>label{margin:0}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
  .title-input{font-family:var(--display);font-weight:800;font-size:34px;min-height:52px;padding:0;background:transparent;border:0;border-bottom:1px solid var(--hair);border-radius:0}
  .title-input:focus{border-color:var(--accent)}

  /* ---------- Hinweise ---------- */
  .note{display:grid;gap:var(--s2);padding:var(--s4);border-radius:var(--r-lg);background:var(--raise)}
  .note.warn{background:var(--warn-tint)}
  .ins{display:grid;gap:var(--s2);padding:var(--s4);border-radius:var(--r-lg);background:var(--raise);box-shadow:inset 3px 0 0 var(--accent)}
  .ins.warn{box-shadow:inset 3px 0 0 var(--warn)}
  .ins.good{box-shadow:inset 3px 0 0 var(--ok)}
  .ins .t{font-weight:700}
  .note .cap{color:var(--text-2)}
  .reason{font-size:14px;line-height:1.4;color:var(--text-2)}

  /* ---------- Tab-Leiste ---------- */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar-bg);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    border-top:1px solid var(--hair);display:flex;justify-content:center;
    padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
  nav.tabs .in{display:flex;width:100%;max-width:600px}
  nav.tabs button{flex:1;display:grid;justify-items:center;gap:3px;min-height:50px;padding-top:4px;font-size:11px;font-weight:600;color:var(--text-3);text-align:center}
  nav.tabs button.on{color:var(--accent)}
  nav.tabs svg{width:25px;height:25px}

  /* ---------- Figur ---------- */
  .fig{display:block;width:100%;height:auto}
  .fig .base{fill:var(--fig)}
  .fig .m{fill:var(--muscle);transition:fill .3s}

  /* ---------- Heute ---------- */
  .hero{display:grid;gap:var(--s5)}
  .hero-top{display:grid;grid-template-columns:minmax(0,1fr) clamp(96px, 30vw, 128px);gap:var(--s4);align-items:center}
  .hero-meta{display:grid;gap:var(--s2);min-width:0}
  .metaline{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);font-size:15px;color:var(--text-2)}
  .metaline b{color:var(--text);font-weight:600}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s2);text-align:center}
  .week .d{display:grid;gap:6px;justify-items:center;font-size:12px;color:var(--text-3);font-weight:600}
  .week .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--text-2);background:var(--raise)}
  .week .dot.done{background:var(--accent);color:var(--on-accent)}
  .week .wp{font-size:10px;font-weight:600;color:var(--text-3);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2;min-height:12px}
  .week .wp.done{color:var(--accent)}
  .week .dot.miss{background:transparent;box-shadow:inset 0 0 0 1px var(--raise-3);color:var(--text-3);text-decoration:line-through}
  .week .dot.today{box-shadow:inset 0 0 0 2px var(--text);color:var(--text)}
  .week .dot.done.today{box-shadow:inset 0 0 0 2px var(--on-accent)}
  .legend{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:13px;color:var(--text-2)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}

  /* ---------- Training ---------- */
  .t-top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:15;background:var(--bg);display:grid;gap:var(--s2);padding:var(--s2) 0 var(--s3);margin-top:calc(-1 * var(--s4))}
  body.training::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:16;background:var(--bg)}
  .t-bar{display:flex;align-items:center;gap:var(--s3)}
  .t-bar .grow{display:grid}
  .t-bar .day{font-weight:600;font-size:15px}
  .t-bar .cnt{font-size:13px;color:var(--text-3)}
  .t-clock{font-family:var(--display);font-weight:700;font-size:22px;color:var(--text-2);min-width:52px;text-align:right;display:grid;justify-items:end;line-height:1;gap:2px}
  .t-clock small{font-family:var(--body);font-weight:600;font-size:11px;color:var(--text-3);white-space:nowrap}
  .bar{height:3px;background:var(--raise-2);border-radius:3px;overflow:hidden}
  .bar>div{height:100%;background:var(--accent);transition:width .35s}
  .ex-head{display:grid;gap:var(--s2)}
  .setting{justify-self:start;font-size:15px;color:var(--text-2);min-height:28px}
  .setting b{color:var(--text);font-weight:600}
  .sets{display:flex;gap:6px}
  .set-pill{flex:1;min-width:0;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--raise);font-weight:700;font-size:14px;color:var(--text-3)}
  .set-pill.cur{background:var(--raise-2);color:var(--text);box-shadow:inset 0 0 0 2px var(--accent)}
  .set-pill.done{background:var(--ok-tint);color:var(--ok)}
  .prog{display:flex;align-items:center;gap:var(--s2);font-size:15px;color:var(--text-2);min-height:32px;text-align:left}
  .prog .arr{font-weight:700}
  .prog.up .arr{color:var(--ok)} .prog.down .arr{color:var(--warn)}
  .prog .more{color:var(--text-3);font-size:13px}
  .stepper{display:grid;gap:var(--s1)}
  .stepper .cap{display:flex;justify-content:space-between}
  .stepper .ctl{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:var(--s2)}
  .stepper .ctl button{width:64px;height:64px;border-radius:50%;background:var(--raise-2);font-size:30px;font-weight:500;display:grid;place-items:center;color:var(--text)}
  .stepper .ctl button:active{background:var(--raise-3)}
  .stepper input{text-align:center;font-family:var(--display);font-weight:800;font-size:68px;line-height:1;min-height:76px;padding:0;border:0;background:transparent;border-radius:var(--r);font-variant-numeric:tabular-nums}
  .stepper input:focus{background:var(--raise)}
  @media (max-height:700px){
    .training .page{gap:var(--s3) !important}
    .stepper .ctl{grid-template-columns:56px 1fr 56px}
    .stepper .ctl button{width:56px;height:56px;font-size:26px}
    .stepper input{font-size:54px;min-height:60px}
    .set-pill{height:34px}
    .ex-head h1{font-size:30px}
  }
  .unit b{font-weight:600;color:var(--text-2);text-transform:none;letter-spacing:0}
  .actions3{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--s2)}
  .tool{display:grid;justify-items:center;gap:6px;min-height:68px;padding:var(--s2) var(--s1);border-radius:var(--r);background:var(--raise);font-size:13px;font-weight:600;color:var(--text-2);text-align:center}
  .tool svg{width:22px;height:22px;color:var(--text)}
  .lastline{font-size:14px;color:var(--text-3)}
  /* Übungsseite und Wissen */
  .guide{gap:var(--s6)}
  .gsec{display:grid;gap:var(--s3)}
  .gsec p{max-width:65ch}
  .glist{margin:0;padding-left:22px;display:grid;gap:var(--s2);max-width:65ch}
  .glist li::marker{color:var(--text-3)}
  .glist.mist{list-style:none;padding-left:0;gap:var(--s3)}
  .glist.mist li{display:grid;gap:2px;padding-left:var(--s3);border-left:2px solid var(--accent)}
  .glist.mist span{color:var(--text-2);font-size:15px}
  .glist.srcs{font-size:14px;gap:var(--s2)}
  .glist.srcs a{color:var(--text)}
  .ghead{display:grid;grid-template-columns:minmax(0,1fr) clamp(96px, 30vw, 140px);gap:var(--s4);align-items:start}
  .motion{display:block;width:100%;height:auto}
  .gmot{display:grid;gap:var(--s2);background:var(--raise);border-radius:var(--r-lg);padding:var(--s3)}
  .gmot .motion{max-width:340px;margin:0 auto}
  .sheet .gmot{background:var(--raise-2)}
  .next-mot{margin:var(--s2) 0;padding:var(--s2)}
  .next-mot .motion{max-width:220px}
  .thumbbox{width:52px;flex:0 0 52px;background:var(--raise-2);border-radius:10px;padding:2px}
  .ex-top{display:flex;align-items:flex-start;gap:var(--s3)}
  .mot-btn{flex:0 0 88px;width:88px;background:var(--raise);border-radius:14px;padding:4px}
  @media (max-height:700px){ .mot-btn{flex-basis:60px;width:60px;padding:2px;border-radius:10px} }
  .hero-mot{display:grid;gap:4px;justify-items:center;width:clamp(110px, 34vw, 150px)}
  .hero-mot .mcap{text-align:center;line-height:1.2}
  .gmus{display:grid;gap:var(--s4)}
  .gmus .glist{font-size:15px}
  .gnote{border-top:1px solid var(--hair);padding-top:var(--s4)}
  .lead{font-size:18px;line-height:1.45;color:var(--text);max-width:65ch}
  .infobtn{font-family:var(--display);font-weight:700;font-size:18px;color:var(--text-2);box-shadow:inset 0 0 0 1.5px var(--hair)}
  .timebtn{display:inline-flex;align-items:center;gap:4px;min-height:32px;color:var(--text-2);font-size:15px;border-bottom:1px dashed var(--text-3)}
  .timebtn b{color:var(--text);font-weight:600}
  .timebtn .chev{font-size:16px;margin-left:2px}
  .facts{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
  .facts b{font-family:var(--display);font-size:18px}

  /* Pause */
  .rest{display:grid;justify-items:center;gap:var(--s4);padding-top:var(--s2)}
  .ring{position:relative;width:min(240px,66vw);aspect-ratio:1}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .t{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:var(--s1)}
  .ring .t .num{font-size:84px;font-weight:800}
  .pm{display:flex;gap:var(--s3)}

function recovery() {
  const now = Date.now(), r = {};

  state.history.forEach(h => {
    const hrs = (now - new Date(h.date).getTime()) / 36e5;
    h.exercises.forEach(x => {

      const apply = (m, full) => { r[m] = Math.min(r[m], Math.max(0, Math.min(100, hrs / full * 100))); };

const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

  tone(660, .08, .05); // Ton durch den Tap freischalten
  const tp = activeTimeplan(day);
  const list = day.items.map(it => tp && tp.replace[it.id] ? makeEntry(Object.assign({}, it, { exId: tp.replace[it.id] }), { from: ex(it.exId).name }) : makeEntry(it));

    list, timeHidden: [], timeAdj: null

  list.forEach((l, i) => { l.ord = i; });
  if (tp) {

    applyKeep(state.session, keep); state.session.timeAdj = { minutes: tp.minutes };
    if (!state.session.list.length) { state.session.list = list; state.session.timeHidden = []; state.session.timeAdj = null; }

/* ================= Progression 2.0 ================= */
// Vergleichbare Einheiten an einem Gerät: gleiche Gewichtsangabe, nur gültige Arbeitssätze (alt → neu).
// Gespeicherte Planung (planned, rmin, rmax) wird genutzt, wenn vorhanden; ältere Einträge haben sie nicht.
function compSessions(exId, u = unitOf(ex(exId))) {
  const out = [];
  state.history.forEach(h => {
    const x = h.exercises.find(e => e.exId === exId && e.u === u); if (!x) return;
    const v = x.sets.filter(validSet); if (!v.length) return;
    const kgs = [...new Set(v.map(t => t.kg))];
    out.push({ date: new Date(h.date).getTime(), sets: v, planned: x.planned || null, rmin: x.rmin || null, rmax: x.rmax || null,
      uniform: kgs.length === 1, kg: kgs.length === 1 ? kgs[0] : null, adj: !!h.adj, adv: !!x.adv });
  });

const knownDev = id => state.history.some(h => h.exercises.some(x => x.exId === id && x.sets.some(validSet)));
function rankAlternatives(curId, used) {
  const cur = ex(curId), direct = [], other = [];
  for (const e of allEx()) {
    if (e.off || used.has(e.id) || e.id === cur.id || e.muscle !== cur.muscle) continue;
    const same = !!cur.pattern && e.pattern === cur.pattern;
    const rel = !same && !!cur.pattern && !!e.pattern && PATTERNS[cur.pattern].rel.includes(e.pattern);
    const known = knownDev(e.id), twin = sameKind(e, cur);
    const score = (twin ? 40 : 0) + (rel ? 50 : 0) + (e.fav ? 30 : 0) + (known ? 10 : 0);
    let why;
    if (twin) why = `Gleiche Übungsart am Gerät von ${BRAND[e.brand] || "deinem Studio"}. Bewegungsweg und Widerstandsverlauf können sich unterscheiden.`;
    else if (same) why = `Gleiches Bewegungsmuster (${PATTERNS[e.pattern].label}), ebenfalls ${MUSCLES[e.muscle]}. Widerstandsverlauf kann sich unterscheiden.`;
    else if (rel) why = `Trainiert ebenfalls ${MUSCLES[e.muscle]}, aber mit verwandtem Bewegungsmuster (${PATTERNS[e.pattern].label} statt ${PATTERNS[cur.pattern].label}): anderer Belastungsschwerpunkt.`;
    else why = `Trainiert ebenfalls ${MUSCLES[e.muscle]}, aber mit anderer Bewegung${e.pattern ? " (" + PATTERNS[e.pattern].label + ")" : ""}. Keine direkte Alternative.`;
    (same ? direct : other).push({ e, why, known, score, kind: same ? "same" : rel ? "rel" : "other" });
  }
  const by = (a, b) => b.score - a.score || allEx().indexOf(a.e) - allEx().indexOf(b.e);
  direct.sort(by); other.sort(by);
  return { direct, other };
}

  const W = (state.weights || []).slice().sort((a, b) => a.d.localeCompare(b.d)), lastW = W[W.length - 1];

  $app.innerHTML = `<div class="page">
    <div class="head"><div class="cap">${H.length} ${H.length === 1 ? "Training" : "Trainings"} insgesamt</div><div class="title">Fortschritt</div></div>

    ${H.length ? `
    <section class="section">
      <div class="section-head"><h2>Häufigkeit</h2><span class="small muted">${monthCount} ${monthCount === 1 ? "Tag" : "Tage"} im ${cm.toLocaleDateString("de-DE", { month: "long" })}</span></div>
      <div class="kpi"><span class="num">${String(Math.round(perWeek * 10) / 10).replace(".", ",")}</span><span class="sub">Trainings pro Woche · letzte 4 Wochen</span></div>
      <div class="bars">${weeks.map((w, i) => `<div class="b ${w.n ? "" : "zero"} ${i === 7 ? "cur" : ""}" style="height:${w.n ? Math.max(8, w.n / maxN * 100) : 4}%" title="${w.n} Trainings"></div>`).join("")}</div>
      <div class="bars-x">${weeks.map((w, i) => `<span>${i === 7 ? "Jetzt" : w.s.getDate() + "." + (w.s.getMonth() + 1) + "."}</span>`).join("")}</div>
    </section>
    <section class="section">
      <div class="section-head"><h2>Kraft & Bestwerte</h2><span class="small muted">Antippen für Details</span></div>
      <div class="group">${bestList.map(([k, b]) => { const sr = series[k] || [], dl = sr.length > 1 ? progDelta(sr[0], sr[sr.length - 1]) : { up: false, n: "±0", u: "" };
        return `<button class="li" data-a="showEx" data-id="${b.id}" data-u="${b.u}">
          <div class="grow"><div class="t ellipsis">${esc(b.name)}</div><div class="s">${kgTxt(b.kg)} kg ${UNIT_SHORT[b.u]} × ${b.reps}</div></div>

      <p class="small faint" style="margin:0">Veränderung seit der ersten Einheit: mehr Gewicht – oder beim gleichen Gewicht mehr Wiederholungen.</p>
    </section>` : `<p class="muted">Noch keine Trainings. Nach deinem ersten Training siehst du hier Häufigkeit, Kraftentwicklung und Bestwerte.</p>`}
    ${goalsHtml()}
    <div>

        `<div class="bars">${weeks.map(w => `<div class="b ${w.vol ? "" : "zero"}" style="height:${w.vol ? Math.max(4, w.vol / max * 100) : 4}%" title="${Math.round(w.vol)} kg"></div>`).join("")}</div>
         <div class="bars-x">${weeks.map((w, i) => `<span>${i === 7 ? "Jetzt" : w.s.getDate() + "." + (w.s.getMonth() + 1) + "."}</span>`).join("")}</div>
         <p class="small faint">Gewicht × Wiederholungen, bei „pro Seite“ beide Seiten.</p>`, false) : ""}
      ${H.length ? disc("discMuscle", "Muskelbelastung", `Sätze diese Woche · Ziel ${tmin}–${tmax}`,
        `<div class="mlist">${muscleRows}</div><p class="small faint">Der helle Bereich zeigt den Richtwert der App für ${(GOALS[goalKey] || GOALS.aufbau).label}. Mittrainierte Muskeln zählen halb.</p>`, false) : ""}
      ${H.length ? disc("discCal", "Kalender", `${monthCount} ${monthCount === 1 ? "Trainingstag" : "Trainingstage"} · Ø ${String(Math.round(perWeek * 10) / 10).replace(".", ",")} pro Woche (letzte 4 Wochen)`,
        `<div class="row between"><button class="icon-btn" data-a="calMonth" data-d="-1" aria-label="Voriger Monat">‹</button>

let calOffset = 0, bwOpen = false, logOpen = false, histNote = "";
function weightCard() {
  const W = (state.weights || []).slice().sort((a, b) => a.d.localeCompare(b.d));
  const today = new Date().toISOString().slice(0, 10);
  const todayEntry = W.find(w => w.d === today);
  const last = W[W.length - 1];
  const since = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
  const base = W.find(w => w.d >= since);
  const diff = last && base && last !== base ? Math.round((last.kg - base.kg) * 10) / 10 : null;
  let chart = "";
  const pts = W.slice(-30);
  if (pts.length >= 2) {
    const w = 320, h = 104, pl = 34, pr = 8, pt = 10, pb = 28;
    let lo = Math.min(...pts.map(p => p.kg)), hi = Math.max(...pts.map(p => p.kg));
    if (hi - lo < 1) { lo -= .5; hi += .5; }
    const t0 = new Date(pts[0].d).getTime(), t1 = new Date(pts[pts.length - 1].d).getTime() || t0 + 1;
    const X = p => pl + (new Date(p.d).getTime() - t0) / Math.max(1, t1 - t0) * (w - pl - pr);
    const Y = v => pt + (hi - v) / (hi - lo) * (h - pt - pb);
    const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p).toFixed(1)},${Y(p.kg).toFixed(1)}`).join("");
    const dl = s => { const d = new Date(s); return d.getDate() + "." + (d.getMonth() + 1) + "."; };
    chart = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Körpergewicht der letzten Einträge">
      <line x1="${pl}" x2="${w - pr}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--hair)"/>
      <line x1="${pl}" x2="${w - pr}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--hair)"/>
      <text x="${pl - 6}" y="${Y(hi) + 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${kgTxt(Math.round(hi * 10) / 10)}</text>
      <text x="${pl - 6}" y="${Y(lo) + 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${kgTxt(Math.round(lo * 10) / 10)}</text>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(pts[pts.length - 1])}" cy="${Y(pts[pts.length - 1].kg)}" r="4.5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>
      <text x="${pl}" y="${h - 4}" font-size="11" fill="var(--text-3)">${dl(pts[0].d)}</text>
      <text x="${w - pr}" y="${h - 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${dl(pts[pts.length - 1].d)}</text></svg>`;
  }
  return `<div class="stack">
    ${last ? `<div class="kpi"><span class="num" style="font-size:44px">${kgTxt(last.kg)}</span><span class="sub">kg${diff !== null ? ` · ${diff > 0 ? "+" : ""}${kgTxt(diff)} kg in 30 Tagen` : ""}</span></div>` : `<p class="small muted">Trag dein Gewicht ein, z. B. einmal pro Woche morgens.</p>`}
    ${chart}
    <div class="row"><input id="bwIn" class="grow" inputmode="decimal" enterkeyhint="done" placeholder="${todayEntry ? "Heute: " + kgTxt(todayEntry.kg) + " kg" : "Gewicht heute in kg"}" aria-label="Körpergewicht in kg" autocomplete="off">
      <button class="btn primary" data-a="addWeight">${todayEntry ? "Ändern" : "Eintragen"}</button></div>
    <p class="error" id="bwErr" hidden>Bitte eine Zahl zwischen 30 und 300 eingeben.</p>
    ${state.health && todayEntry ? `<div id="bwHk"><button class="btn block" data-a="sendWeight">${todayEntry.hk ? HK_SENT : "In Apple Health eintragen"}</button>
      <p class="small faint">Übergibt ${kgTxt(todayEntry.kg)} kg an den Kurzbefehl „${HK_WEIGHT}“.</p></div>` : ""}
  </div>`;
}

function exChart(exId, u = unitOf(ex(exId))) {
  const all = state.history.map(h => { const x = h.exercises.find(e => e.exId === exId); if (!x) return null;
    const v = x.sets.filter(validSet); return v.length ? { d: new Date(h.date), kg: Math.max(...v.map(t => t.kg)), sets: v, u: x.u } : null; }).filter(Boolean);
  const other = all.filter(p => p.u !== u).length, allU = all.filter(p => p.u === u);
  const pts = allU.slice(-12);
  const name = ex(exId).name;
  const otherNote = other ? `<p class="small faint">${other} ${other === 1 ? "Eintrag" : "Einträge"} mit anderer Gewichtsangabe ausgeblendet, damit nichts Ungleiches verglichen wird.</p>` : "";
  if (!pts.length) return `${sheetHead(esc(name), "Schließen")}<p class="muted">Noch keine Daten mit „${UNIT[u]}“.</p>${otherNote}`;
  const W = 320, H = 160, pl = 36, pr = 12, pt = 24, pb = 26;
  let lo = Math.min(...pts.map(p => p.kg)), hi = Math.max(...pts.map(p => p.kg));
  if (hi === lo) { lo = Math.max(0, lo - 5); hi = hi + 5; }
  const X = i => pts.length === 1 ? (pl + W - pr) / 2 : pl + i * (W - pl - pr) / (pts.length - 1);
  const Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.kg).toFixed(1)}`).join("");
  const area = line + `L${X(pts.length - 1).toFixed(1)},${H - pb}L${X(0).toFixed(1)},${H - pb}Z`;
  const lastP = pts[pts.length - 1], since = progDelta(topSet(allU[0].sets), topSet(lastP.sets));
  const dl = d => d.getDate() + "." + (d.getMonth() + 1) + ".";
  return `${sheetHead(esc(name), "Schließen")}
    <div class="grid3">
      <div class="stat"><div class="cap">Aktuell</div><div class="num">${kgTxt(lastP.kg)}<span class="small muted"> kg</span></div><div class="small faint">${UNIT_SHORT[u]} · ${lastP.sets.map(t => t.reps).join("/")} Wdh.</div></div>
      <div class="stat" id="sinceStart"><div class="cap">Seit Beginn</div><div class="num" style="color:${since.up ? "var(--ok)" : "var(--text)"}">${since.n}${since.u ? `<span class="small muted"> ${since.u}</span>` : ""}</div><div class="small faint">seit ${allU[0].d.toLocaleDateString("de-DE", { day: "numeric", month: "numeric", year: "2-digit" })}</div></div>
      <div class="stat"><div class="cap">1RM geschätzt</div><div class="num">≈${kgTxt(Math.round(Math.max(...lastP.sets.map(e1rm)) * 2) / 2)}<span class="small muted"> kg</span></div><div class="small faint">Näherung</div></div>
    </div>
    ${(() => { const pl = plateau(exId); return pl ? `<p class="small" style="color:var(--warn)" id="plateauChart">${esc(plateauTxt(pl))}</p>` : ""; })()}${otherNote}
    <p class="small faint">Linie: schwerster Satz je Training, Zahl darüber: Wiederholungen damit. 1RM nach Epley aus deinen Sätzen geschätzt, an Maschinen nur eine grobe Näherung.</p>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Gewichtsverlauf ${esc(name)}">
      <line x1="${pl}" x2="${W - pr}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--hair)"/>
      <line x1="${pl}" x2="${W - pr}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--hair)"/>
      <text x="${pl - 6}" y="${Y(hi) + 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${kgTxt(hi)}</text>
      <text x="${pl - 6}" y="${Y(lo) + 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${kgTxt(lo)}</text>
      <path d="${area}" fill="var(--accent-tint)"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.kg)}" r="${i === pts.length - 1 ? 5 : 3}" fill="var(--accent)" stroke="var(--raise)" stroke-width="2"/>
        <text x="${X(i)}" y="${Y(p.kg) - 10}" text-anchor="middle" font-size="10" fill="var(--text-2)" class="repLbl">${topSet(p.sets).reps}</text>`).join("")}
      <text x="${X(0)}" y="${H - 6}" text-anchor="${pts.length === 1 ? "middle" : "start"}" font-size="11" fill="var(--text-3)">${dl(pts[0].d)}</text>
      ${pts.length > 1 ? `<text x="${X(pts.length - 1)}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--text-3)">${dl(lastP.d)}</text>` : ""}
    </svg>
    <button class="btn block" data-a="openEx" data-id="${exId}" data-ret="history">Anleitung und alle Werte</button>
    <div class="group">${[...pts].reverse().slice(0, 5).map(p => `<div class="li"><div class="grow small muted">${p.d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" })}</div>
      <div class="small">${p.sets.map(t => (t.kg !== null ? kgTxt(t.kg) : "–") + "×" + t.reps).join(" · ")}</div></div>`).join("")}</div>`;
}

/* ================= Ticker ================= */
let timer = null;
function tick() {
  const s = S(); if (!s) return stopTick();
  const el = byId("elapsed"); if (el) el.textContent = fmtTime((Date.now() - s.start) / 1000);
  const rm = byId("remain"); if (rm) rm.textContent = `≈ ${remainMin(s)} Min.`;
  if (s.phase !== "rest") return;
  const left = (s.restEnd - Date.now()) / 1000;
  const t = byId("timer"); if (t) t.textContent = fmtTime(left);
  const arc = byId("ringArc"); if (arc) { const C = 2 * Math.PI * 54; arc.setAttribute("stroke-dashoffset", C * (1 - Math.max(0, s.restTotal ? left / s.restTotal : 0))); }
  const sec = Math.ceil(left);
  if (sec === 10 && s.restTotal > 15 && !s.said10) { s.said10 = true; say("Noch zehn Sekunden."); }
  if (sec <= 3 && sec >= 1 && s.beeped !== sec) { s.beeped = sec; tone(660, .12); }
  if (left <= 0) { tone(990, .45); buzz([200, 100, 200]); endRest(); }
}
function startTick() { stopTick(); timer = setInterval(tick, 250); }
function stopTick() { if (timer) clearInterval(timer); timer = null; }

/* ================= Aktionen ================= */
const A = {
  tab: el => go(el.dataset.v),
  closeSheet: (el, ev) => { if (ev.target === el || el.tagName === "BUTTON") closeSheet(); },
  setup: el => { const k = el.dataset.k; setup[k] = k === "days" || k === "minutes" ? +el.dataset.val : el.dataset.val; vSetup(); },
  setupDay: el => { const tm = byId("setupTime"); if (tm && tm.value) setup.time = tm.value;
    const d = +el.dataset.d, i = setup.wd.indexOf(d); if (i >= 0) setup.wd.splice(i, 1); else setup.wd.push(d); setup.wd.sort((a, b) => a - b);
    if (TEMPLATES[setup.wd.length]) setup.days = setup.wd.length; vSetup(); },
  createPlan: () => { const tm = byId("setupTime"); if (tm && /^\d{2}:\d{2}$/.test(tm.value)) setup.time = tm.value;
    if (!TEMPLATES[setup.wd.length]) { const x = byId("setupDaysTxt"); if (x) { x.textContent = "Bitte 2 bis 4 Tage wählen."; x.style.color = "var(--bad)"; } return; }
    setup.days = setup.wd.length;

      const words = q.toLowerCase().split(/\s+/).map(w => foodNorm(w.replace(/[^a-z0-9äöüß]/g, ""))).filter(w => w.length >= 2 && !STORE_BRANDS[w]);
