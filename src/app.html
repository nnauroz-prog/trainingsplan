<title>Trainingsplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  /* =====================================================================
     Designsystem „Instrument“
     Layout: Inhalte direkt auf Graphit, Hierarchie über Typografie und Weißraum.
     Gruppierte Listen nur für echte Listen. Eine orange Hauptaktion je Ansicht,
     im Training fest im Daumenbereich (über der Tastatur).
     ===================================================================== */
  :root{
    /* Farben (dunkel = Standard) */
    --bg:#0D0E10; --raise:#16181B; --raise-2:#202328; --raise-3:#2A2E34;
    --hair:rgba(255,255,255,.07); --text:#F3F4F5; --text-2:#A1A7B0; --text-3:#6C727C;
    --accent:#FF6B1A; --accent-press:#E85C0E; --accent-tint:rgba(255,107,26,.14); --on-accent:#FFFFFF;
    --ok:#3CCB7F; --ok-tint:rgba(60,203,127,.14); --warn:#F5B740; --warn-tint:rgba(245,183,64,.12); --bad:#F2554F;
    --fig:#24272C; --muscle:#363A41; --band:rgba(255,255,255,.10); --scrim:rgba(0,0,0,.6);
    --bar-bg:rgba(13,14,16,.88); --accent-soft:rgba(255,107,26,.42); --sheet:#17191C; --seg-on:#2A2E34;
    /* Schrift */
    --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
    --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    /* Raster (4er-Schritte) */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
    --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:28px;
    --gutter:20px; --tap:48px;
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
    --bg:#F4F5F7; --raise:#FFFFFF; --raise-2:#E9EBEF; --raise-3:#DCE0E5;
    --hair:rgba(15,17,20,.09); --text:#0F1114; --text-2:#5A616B; --text-3:#8C929B;
    --accent:#F0600E; --accent-press:#D9540A; --accent-tint:rgba(240,96,14,.11);
    --ok:#1F9D5B; --ok-tint:rgba(31,157,91,.12); --warn:#C98A0C; --warn-tint:rgba(201,138,12,.12); --bad:#D93A37;
    --fig:#E2E5E9; --muscle:#C8CDD4; --band:rgba(15,17,20,.10); --scrim:rgba(15,17,20,.38);
    --bar-bg:rgba(244,245,247,.9); --accent-soft:rgba(240,96,14,.36); --sheet:#FFFFFF; --seg-on:#FFFFFF; color-scheme:light}}
  :root[data-theme="light"]{
    --bg:#F4F5F7; --raise:#FFFFFF; --raise-2:#E9EBEF; --raise-3:#DCE0E5;
    --hair:rgba(15,17,20,.09); --text:#0F1114; --text-2:#5A616B; --text-3:#8C929B;
    --accent:#F0600E; --accent-press:#D9540A; --accent-tint:rgba(240,96,14,.11);
    --ok:#1F9D5B; --ok-tint:rgba(31,157,91,.12); --warn:#C98A0C; --warn-tint:rgba(201,138,12,.12); --bad:#D93A37;
    --fig:#E2E5E9; --muscle:#C8CDD4; --band:rgba(15,17,20,.10); --scrim:rgba(15,17,20,.38);
    --bar-bg:rgba(244,245,247,.9); --accent-soft:rgba(240,96,14,.36); --sheet:#FFFFFF; --seg-on:#FFFFFF; color-scheme:light}

  /* ---------- Grundlage ---------- */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;
    padding-left:max(var(--gutter), env(safe-area-inset-left, 0px));padding-right:max(var(--gutter), env(safe-area-inset-right, 0px));
    padding-block:var(--s4) 120px;max-width:600px;margin:0 auto;font-variant-numeric:tabular-nums}
  body.training{padding-bottom:132px}
  body.has-bar{padding-bottom:180px}
  p{margin:0}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
  button:disabled{opacity:.38;cursor:default}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
  [hidden]{display:none!important}
  svg{flex:0 0 auto}

  /* ---------- Typografie ---------- */
  .cap{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
  .label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
  .title{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:.005em;margin:var(--s1) 0 0;text-wrap:balance}
  .hero-name{font-family:var(--display);font-weight:800;font-size:clamp(34px, 11vw, 48px);line-height:.95;margin:0;text-wrap:balance;overflow-wrap:break-word;hyphens:auto}
  h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.02;margin:0;text-wrap:balance}
  h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;margin:0;text-wrap:balance}
  h3{font-size:17px;font-weight:600;margin:0;line-height:1.3}
  .sub{font-size:15px;color:var(--text-2)}
  .small{font-size:14px}
  .muted{color:var(--text-2)}
  .faint{color:var(--text-3)}
  .num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .error{color:var(--bad);font-size:14px;font-weight:500}

  /* ---------- Layout ---------- */
  .page{display:grid;gap:var(--s6)}
  .stack{display:grid;gap:var(--s3)}
  .stack-sm{display:grid;gap:var(--s2)}
  .row{display:flex;align-items:center;gap:var(--s3);min-width:0}
  .row>.grow,.grow{flex:1;min-width:0}
  .between{justify-content:space-between}
  .wrap{flex-wrap:wrap}
  .head{display:grid;gap:var(--s1)}
  .section{display:grid;gap:var(--s3)}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
  .section-head h2{font-size:22px}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s5);
    border-radius:var(--r);font-weight:600;font-size:16px;background:var(--raise-2);color:var(--text);transition:transform .08s,background .15s}
  .btn:active:not(:disabled){transform:scale(.98)}
  .btn.primary{background:var(--accent);color:var(--on-accent)}
  .btn.primary:active:not(:disabled){background:var(--accent-press)}
  .btn.block{width:100%}
  .btn.xl{min-height:58px;font-size:18px;border-radius:var(--r-lg)}
  .btn.sm{min-height:40px;padding:0 var(--s4);font-size:15px;border-radius:12px}
  .btn.danger{color:var(--bad)}
  .btn.quiet{background:transparent;color:var(--text-2)}
  .link{color:var(--accent);font-weight:600;min-height:32px;display:inline-flex;align-items:center}
  .icon-btn{width:44px;height:44px;border-radius:50%;background:var(--raise-2);display:inline-grid;place-items:center;flex:0 0 auto;color:var(--text)}
  .icon-btn.plain{background:transparent}

  /* Feste Aktionsleiste im Daumenbereich (folgt der Tastatur) */
  .actionbar{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:25;background:var(--bar-bg);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    padding:var(--s3) max(var(--gutter), env(safe-area-inset-right, 0px)) calc(var(--s3) + env(safe-area-inset-bottom, 0px)) max(var(--gutter), env(safe-area-inset-left, 0px))}
  .actionbar .in{max-width:600px;margin:0 auto;display:grid;gap:var(--s2)}

  /* ---------- Chips, Badges, Segment ---------- */
  .chips{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gutter));padding:0 var(--gutter)}
  .chips::-webkit-scrollbar{display:none}
  .chips.wrap{flex-wrap:wrap;margin:0;padding:0}
  .chip{min-height:38px;padding:0 var(--s4);border-radius:999px;background:var(--raise-2);font-size:15px;font-weight:600;white-space:nowrap;color:var(--text-2)}
  .chip.on{background:var(--text);color:var(--bg)}
  .badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--raise-2);color:var(--text-2);white-space:nowrap}
  .badge.fav{background:var(--accent);color:var(--on-accent)}
  .badge.up{background:var(--ok-tint);color:var(--ok)}
  .badge.pr{background:var(--accent-tint);color:var(--accent)}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--raise-2);padding:3px;border-radius:12px}
  .seg button{min-height:40px;border-radius:10px;font-weight:600;font-size:15px;color:var(--text-2);text-align:center}
  .seg button.on{background:var(--seg-on);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .seg.feel button.on{background:var(--accent);color:var(--on-accent)}

  /* ---------- Gruppierte Listen ---------- */
  .group{background:var(--raise);border-radius:var(--r-lg);overflow:hidden}
  .li{display:flex;align-items:center;gap:var(--s3);min-height:56px;padding:var(--s3) var(--s4);width:100%;text-align:left;position:relative;min-width:0}
  .group>.li+.li::before,.group>*+.li::before{content:"";position:absolute;top:0;left:var(--s4);right:0;height:1px;background:var(--hair)}
  .li .grow{flex:1;min-width:0}
  .li .t{font-weight:600;font-size:16px}
  .li .s{font-size:14px;color:var(--text-2);margin-top:1px}
  .chev{color:var(--text-3);font-size:20px;line-height:1}
  .plain-list>.li{padding-left:0;padding-right:0}
  .plain-list>.li+.li::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--hair)}

  /* ---------- Formular ---------- */
  input,select{font:inherit;width:100%;min-height:var(--tap);padding:0 var(--s4);border-radius:var(--r);border:1px solid transparent;background:var(--raise-2);color:var(--text)}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  label{display:block;font-size:14px;font-weight:600;color:var(--text-2);margin-bottom:var(--s2)}
  textarea{font:inherit;font-size:12px;width:100%;min-height:96px;padding:var(--s3);border-radius:var(--r);border:1px solid transparent;background:var(--raise-2);color:var(--text);font-family:ui-monospace,Menlo,monospace;word-break:break-all}
  .field{display:grid;gap:var(--s2)}
  .field>label{margin:0}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
  .title-input{font-family:var(--display);font-weight:800;font-size:34px;min-height:52px;padding:0;background:transparent;border:0;border-bottom:1px solid var(--hair);border-radius:0}
  .title-input:focus{border-color:var(--accent)}

  /* ---------- Hinweise ---------- */
  .note{display:grid;gap:var(--s2);padding:var(--s4);border-radius:var(--r-lg);background:var(--raise)}
  .note.warn{background:var(--warn-tint)}
  .note .cap{color:var(--text-2)}
  .reason{font-size:14px;line-height:1.4;color:var(--text-2)}

  /* ---------- Tab-Leiste ---------- */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar-bg);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    border-top:1px solid var(--hair);display:flex;justify-content:center;
    padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
  nav.tabs .in{display:flex;width:100%;max-width:600px}
  nav.tabs button{flex:1;display:grid;justify-items:center;gap:3px;min-height:50px;padding-top:4px;font-size:11px;font-weight:600;color:var(--text-3);text-align:center}
  nav.tabs button.on{color:var(--accent)}
  nav.tabs svg{width:25px;height:25px}

  /* ---------- Figur ---------- */
  .fig{display:block;width:100%;height:auto}
  .fig .base{fill:var(--fig)}
  .fig .m{fill:var(--muscle);transition:fill .3s}

  /* ---------- Heute ---------- */
  .hero{display:grid;gap:var(--s5)}
  .hero-top{display:grid;grid-template-columns:minmax(0,1fr) clamp(96px, 30vw, 128px);gap:var(--s4);align-items:center}
  .hero-meta{display:grid;gap:var(--s2);min-width:0}
  .metaline{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);font-size:15px;color:var(--text-2)}
  .metaline b{color:var(--text);font-weight:600}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s2);text-align:center}
  .week .d{display:grid;gap:6px;justify-items:center;font-size:12px;color:var(--text-3);font-weight:600}
  .week .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--text-2);background:var(--raise)}
  .week .dot.done{background:var(--accent);color:var(--on-accent)}
  .week .dot.today{box-shadow:inset 0 0 0 2px var(--text);color:var(--text)}
  .week .dot.done.today{box-shadow:inset 0 0 0 2px var(--on-accent)}
  .legend{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:13px;color:var(--text-2)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}

  /* ---------- Training ---------- */
  .t-top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:15;background:var(--bg);display:grid;gap:var(--s2);padding:var(--s2) 0 var(--s3);margin-top:calc(-1 * var(--s4))}
  body.training::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:16;background:var(--bg)}
  .t-bar{display:flex;align-items:center;gap:var(--s3)}
  .t-bar .grow{display:grid}
  .t-bar .day{font-weight:600;font-size:15px}
  .t-bar .cnt{font-size:13px;color:var(--text-3)}
  .t-clock{font-family:var(--display);font-weight:700;font-size:22px;color:var(--text-2);min-width:52px;text-align:right}
  .bar{height:3px;background:var(--raise-2);border-radius:3px;overflow:hidden}
  .bar>div{height:100%;background:var(--accent);transition:width .35s}
  .ex-head{display:grid;gap:var(--s2)}
  .setting{justify-self:start;font-size:15px;color:var(--text-2);min-height:28px}
  .setting b{color:var(--text);font-weight:600}
  .sets{display:flex;gap:6px}
  .set-pill{flex:1;min-width:0;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--raise);font-weight:700;font-size:14px;color:var(--text-3)}
  .set-pill.cur{background:var(--raise-2);color:var(--text);box-shadow:inset 0 0 0 2px var(--accent)}
  .set-pill.done{background:var(--ok-tint);color:var(--ok)}
  .prog{display:flex;align-items:center;gap:var(--s2);font-size:15px;color:var(--text-2);min-height:32px;text-align:left}
  .prog .arr{font-weight:700}
  .prog.up .arr{color:var(--ok)} .prog.down .arr{color:var(--warn)}
  .prog .more{color:var(--text-3);font-size:13px}
  .stepper{display:grid;gap:var(--s1)}
  .stepper .cap{display:flex;justify-content:space-between}
  .stepper .ctl{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:var(--s2)}
  .stepper .ctl button{width:64px;height:64px;border-radius:50%;background:var(--raise-2);font-size:30px;font-weight:500;display:grid;place-items:center;color:var(--text)}
  .stepper .ctl button:active{background:var(--raise-3)}
  .stepper input{text-align:center;font-family:var(--display);font-weight:800;font-size:68px;line-height:1;min-height:76px;padding:0;border:0;background:transparent;border-radius:var(--r);font-variant-numeric:tabular-nums}
  .stepper input:focus{background:var(--raise)}
  .unit b{font-weight:600;color:var(--text-2);text-transform:none;letter-spacing:0}
  .actions3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
  .tool{display:grid;justify-items:center;gap:6px;min-height:68px;padding:var(--s2) var(--s1);border-radius:var(--r);background:var(--raise);font-size:13px;font-weight:600;color:var(--text-2);text-align:center}
  .tool svg{width:22px;height:22px;color:var(--text)}
  .lastline{font-size:14px;color:var(--text-3)}
  .timebtn{display:inline-flex;align-items:center;gap:4px;min-height:32px;color:var(--text-2);font-size:15px;border-bottom:1px dashed var(--text-3)}
  .timebtn b{color:var(--text);font-weight:600}
  .timebtn .chev{font-size:16px;margin-left:2px}
  .facts{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
  .facts b{font-family:var(--display);font-size:18px}

  /* Pause */
  .rest{display:grid;justify-items:center;gap:var(--s4);padding-top:var(--s2)}
  .ring{position:relative;width:min(240px,66vw);aspect-ratio:1}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .t{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:var(--s1)}
  .ring .t .num{font-size:84px;font-weight:800}
  .pm{display:flex;gap:var(--s3)}
  .pm .btn{min-width:96px}
  .feel-q{display:grid;gap:var(--s3);width:100%}
  .next{display:grid;gap:var(--s1);width:100%}

  /* ---------- Plan ---------- */
  .day-row .t{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1}
  .day-row .min{font-size:14px;color:var(--text-3);white-space:nowrap}
  .idx{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--raise-2);font-size:13px;font-weight:700;color:var(--text-2);flex:0 0 auto}
  .mini-step{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center}
  .mini-step button{height:44px;border-radius:12px;background:var(--raise-2);font-size:22px;display:grid;place-items:center}
  .mini-step output{text-align:center;font-family:var(--display);font-size:28px;font-weight:700}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}

  /* ---------- Verlauf ---------- */
  .kpi{display:flex;align-items:baseline;gap:var(--s2)}
  .kpi .num{font-size:56px;font-weight:800}
  .bars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:84px}
  .bars .b{background:var(--accent);border-radius:6px 6px 3px 3px;min-height:4px}
  .bars .b.zero{background:var(--raise-2)}
  .bars .b.cur{background:var(--text)}
  .bars-x{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;font-size:11px;color:var(--text-3);text-align:center}
  .spark{width:52px;height:26px;flex:0 0 52px}
  .delta{min-width:34px;text-align:right}
  .delta{font-size:13px;font-weight:700;color:var(--ok)}
  .delta.zero{color:var(--text-3)}
  details.disc{border-top:1px solid var(--hair)}
  details.disc:last-of-type{border-bottom:1px solid var(--hair)}
  details.disc>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:60px;cursor:pointer}
  details.disc>summary::-webkit-details-marker{display:none}
  details.disc>summary h3{font-size:17px}
  details.disc>summary .chev{transition:transform .2s}
  details.disc[open]>summary .chev{transform:rotate(90deg)}
  details.disc>.body{display:grid;gap:var(--s4);padding-bottom:var(--s5)}
  .mlist{display:grid;gap:10px}
  .mrow{display:grid;grid-template-columns:96px 1fr 34px;gap:var(--s3);align-items:center}
  .mtrack{position:relative;height:8px;border-radius:6px;background:var(--raise-2);overflow:hidden}
  .mband{position:absolute;top:0;bottom:0;background:var(--band)}
  .mfill{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
  .cal .d{display:grid;justify-items:center;font-size:12px;color:var(--text-3);font-weight:600}
  .cal .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--text-2)}
  .cal .dot.done{background:var(--accent);color:var(--on-accent);font-weight:700}
  .cal .dot.today{box-shadow:inset 0 0 0 2px var(--text)}
  .stat{display:grid;gap:var(--s1)}
  .stat .num{font-size:34px}

  /* ---------- Bottom-Sheet ---------- */
  .scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
  .sheet{background:var(--sheet);width:100%;max-width:600px;border-radius:var(--r-xl) var(--r-xl) 0 0;max-height:90vh;overflow:auto;overscroll-behavior:contain;display:grid;gap:var(--s4);align-content:start;

<script>
(() => {
"use strict";

/* ================= Daten ================= */
const MUSCLES = {

  bauch:"Bauch", beinev:"Beine vorn", beineh:"Beine hinten", po:"Po", waden:"Waden"
};
// [id, Name, Hauptmuskel, Nebenmuskeln, Gerätetyp] – Hammer Strength
const LIB = [
  ["hs-chest","Iso-Lateral Chest Press","brust",["trizeps","schultern"],"plate"],
  ["hs-incline","Iso-Lateral Incline Press","brust",["schultern","trizeps"],"plate"],
  ["hs-decline","Iso-Lateral Decline Press","brust",["trizeps"],"plate"],
  ["hs-widechest","Iso-Lateral Wide Chest","brust",["schultern"],"plate"],
  ["hs-fly","Pec Fly","brust",["schultern"],"stack"],
  ["hs-row","Iso-Lateral Row","ruecken",["bizeps","schultern"],"plate"],
  ["hs-lowrow","Iso-Lateral Low Row","ruecken",["bizeps"],"plate"],
  ["hs-highrow","Iso-Lateral High Row","ruecken",["bizeps","schultern"],"plate"],
  ["hs-pulldown","Iso-Lateral Front Lat Pulldown","ruecken",["bizeps"],"plate"],
  ["hs-dyrow","Iso-Lateral D.Y. Row","ruecken",["bizeps"],"plate"],
  ["hs-lat","Lat Pulldown","ruecken",["bizeps"],"stack"],
  ["hs-shoulder","Iso-Lateral Shoulder Press","schultern",["trizeps"],"plate"],
  ["hs-lateral","Lateral Raise","schultern",[],"plate"],
  ["hs-reardelt","Rear Delt","schultern",["ruecken"],"stack"],
  ["hs-curl","Biceps Curl","bizeps",[],"plate"],
  ["hs-dip","Seated Dip","trizeps",["brust","schultern"],"plate"],
  ["hs-triext","Triceps Extension","trizeps",[],"stack"],
  ["hs-legpress","Linear Leg Press","beinev",["po","beineh"],"plate"],
  ["hs-isolegpress","Iso-Lateral Leg Press","beinev",["po"],"plate"],
  ["hs-vsquat","V-Squat","beinev",["po"],"plate"],
  ["hs-hack","Hack Squat","beinev",["po"],"plate"],
  ["hs-legext","Iso-Lateral Leg Extension","beinev",[],"plate"],
  ["hs-kneelcurl","Iso-Lateral Kneeling Leg Curl","beineh",[],"plate"],

].map(([id,name,muscle,sec,type]) => ({ id, name, muscle, sec, type }));

// Bewegungsmuster: Grundlage für fachlich passende Alternativen (nicht „identisch“, nur vergleichbar)
// rel = verwandte Muster: gleicher Muskel, aber anderer Belastungsschwerpunkt
const PATTERNS = {

  push_i:   { label: "Schräges Drücken", rel: ["push_h", "push_v"] },
  push_v:   { label: "Vertikales Drücken", rel: ["push_i"] },
  fly:      { label: "Brust-Isolation", rel: [] },
  pull_h:   { label: "Horizontales Ziehen", rel: ["pull_v"] },
  pull_v:   { label: "Vertikales Ziehen", rel: ["pull_h"] },
  lateral:  { label: "Seitheben", rel: [] },
  rear:     { label: "Hintere Schulter", rel: [] },
  bi:       { label: "Bizeps-Isolation", rel: [] },
  tri:      { label: "Trizeps-Isolation", rel: ["dip"] },
  dip:      { label: "Trizeps-Drücken", rel: ["tri"] },
  squat:    { label: "Kniebeugedominante Beinübung", rel: [] },
  hinge:    { label: "Hüftdominante Beinübung", rel: [] },
  knee_ext: { label: "Knieextension", rel: [] },
  knee_flex:{ label: "Kniebeugung", rel: [] },
  calf:     { label: "Wadenheben", rel: [] },
  core:     { label: "Rumpfbeugung", rel: [] }
};
const LIB_PATTERN = {
  "hs-chest": "push_h", "hs-decline": "push_h", "hs-widechest": "push_h", "hs-incline": "push_i", "hs-shoulder": "push_v",
  "hs-fly": "fly", "hs-row": "pull_h", "hs-lowrow": "pull_h", "hs-dyrow": "pull_h", "hs-highrow": "pull_v",
  "hs-pulldown": "pull_v", "hs-lat": "pull_v", "hs-lateral": "lateral", "hs-reardelt": "rear", "hs-curl": "bi",
  "hs-triext": "tri", "hs-dip": "dip", "hs-legpress": "squat", "hs-isolegpress": "squat", "hs-vsquat": "squat",
  "hs-hack": "squat", "hs-hipthrust": "hinge", "hs-legext": "knee_ext", "hs-kneelcurl": "knee_flex",
  "hs-seatcurl": "knee_flex", "hs-calf": "calf", "hs-seatcalf": "calf", "hs-ab": "core"
};
LIB.forEach(e => { e.pattern = LIB_PATTERN[e.id]; });

// Kurze Ausführungstipps (Einstellung · Bewegung · Fehler vermeiden)
const TIPS = {
  "hs-chest":["Sitz so einstellen, dass die Griffe auf Brusthöhe sind","Schulterblätter zusammen und nach unten, dann drücken","Ellbogen nicht ganz durchstrecken, langsam zurück"],
  "hs-incline":["Griffe auf Höhe der oberen Brust","Brust raus, Schulterblätter fest in die Lehne","Unten kurz dehnen, kontrolliert hochdrücken"],
  "hs-decline":["Griffe auf Höhe der unteren Brust","Rücken fest an der Lehne, Füße fest am Boden","Nach vorn-unten drücken, Schultern bleiben unten"],
  "hs-widechest":["Griffe auf Brusthöhe, Hände weit","Ellbogen leicht gebeugt, nach vorn zusammenführen","Langsam zurück bis zur Dehnung in der Brust"],
  "hs-fly":["Arme auf Schulterhöhe, Ellbogen leicht gebeugt","Bogenförmig zusammenführen, kurz halten","Nicht über die Dehnung hinaus zurückgehen"],
  "hs-row":["Brust an das Polster, Arme ganz gestreckt","Ellbogen nah am Körper nach hinten ziehen","Schulterblätter am Ende zusammen, nicht mit dem Oberkörper reißen"],
  "hs-lowrow":["Brust ans Polster, Füße fest","Zum Bauch ziehen, Ellbogen eng","Am Ende kurz halten, langsam nach vorn"],
  "hs-highrow":["Sitz so, dass die Griffe über Kopf sind","Diagonal nach unten-hinten ziehen","Schultern weg von den Ohren"],
  "hs-pulldown":["Knie fest unter das Polster","Griffe zur oberen Brust ziehen, Brust raus","Oben ganz strecken, nicht nach hinten lehnen"],
  "hs-dyrow":["Brust ans Polster, Arme lang","Ellbogen Richtung Hüfte ziehen","Langsam zurück, Rücken bleibt gerade"],
  "hs-lat":["Knie fixieren, Stange etwas breiter als schulterbreit","Zur oberen Brust ziehen, Ellbogen nach unten","Oben kontrolliert strecken"],
  "hs-shoulder":["Griffe etwa auf Kinnhöhe","Gerade nach oben drücken, Rücken an der Lehne","Kein Hohlkreuz, Ellbogen nicht durchschlagen"],
  "hs-lateral":["Polster an den Oberarmen, Sitz so, dass die Schulter auf Drehachse ist","Arme seitlich bis Schulterhöhe heben","Langsam ablassen, nicht schwingen"],
  "hs-reardelt":["Brust ans Polster, Arme auf Schulterhöhe","Arme in weitem Bogen nach hinten","Schulterblätter nicht hochziehen"],
  "hs-curl":["Oberarme flach auf dem Polster, Ellbogen auf Drehachse","Hoch bis zur vollen Beugung","Unten fast ganz strecken, ohne Schwung"],
  "hs-dip":["Sitz so, dass die Griffe neben der Hüfte sind","Nach unten drücken bis die Arme fast gestreckt sind","Oberkörper aufrecht, Schultern unten"],
  "hs-triext":["Oberarme aufs Polster, Ellbogen auf Drehachse","Arme ganz strecken, kurz halten","Langsam beugen, Oberarme bleiben liegen"],
  "hs-legpress":["Füße schulterbreit mittig auf der Platte","Knie zeigen in Richtung Zehen","Unten Po bleibt am Polster, oben Knie nicht durchstrecken"],
  "hs-isolegpress":["Füße hüftbreit, Rücken fest an der Lehne","Kontrolliert tief, Knie folgen den Zehen","Oben Knie leicht gebeugt lassen"],
  "hs-vsquat":["Schultern unter die Polster, Füße leicht vor dem Körper","Tief beugen, Rücken bleibt an der Lehne","Über die ganze Fußsohle hochdrücken"],
  "hs-hack":["Rücken flach an der Lehne, Füße schulterbreit","Tief gehen, Knie Richtung Zehen","Fersen bleiben auf der Platte"],
  "hs-legext":["Knie auf Höhe der Drehachse, Polster über dem Knöchel","Beine ganz strecken, oben kurz halten","Langsam ablassen, nicht fallen lassen"],
  "hs-kneelcurl":["Knie aufs Polster, Polster über der Ferse","Ferse zum Po ziehen","Hüfte bleibt am Polster, langsam zurück"],
  "hs-seatcurl":["Knie auf Drehachse, Oberschenkelpolster fest","Fersen nach unten-hinten ziehen","Langsam zurück, nicht abfedern"],
  "hs-hipthrust":["Oberer Rücken an der Bank, Füße hüftbreit","Hüfte hochdrücken, Po oben fest anspannen","Kein Hohlkreuz, Kinn leicht zur Brust"],
  "hs-calf":["Fußballen auf die Kante, Schultern unter die Polster","Ganz hoch auf die Zehen, kurz halten","Unten voll dehnen"],
  "hs-seatcalf":["Polster fest auf die Oberschenkel, Ballen auf die Kante","Fersen ganz hoch drücken","Langsam tief in die Dehnung"],
  "hs-ab":["Füße einhaken, Griffe neben dem Kopf","Oberkörper einrollen, Bauch fest","Nicht mit den Armen ziehen, langsam zurück"]
};

const GOALS = {
  aufbau:{ label:"Muskelaufbau", rmin:8, rmax:12, rest:90 },
  kraft:{ label:"Kraft", rmin:4, rmax:6, rest:180 },
  fit:{ label:"Fitness & Straffung", rmin:12, rmax:15, rest:60 }
};
const TEMPLATES = {
  2:[["Ganzkörper A",["hs-chest","hs-row","hs-legpress","hs-shoulder","hs-seatcurl","hs-ab"]],
     ["Ganzkörper B",["hs-incline","hs-pulldown","hs-hack","hs-lateral","hs-dip","hs-calf"]]],
  3:[["Push",["hs-chest","hs-incline","hs-shoulder","hs-lateral","hs-dip"]],
     ["Pull",["hs-row","hs-pulldown","hs-highrow","hs-reardelt","hs-curl"]],
     ["Beine",["hs-legpress","hs-hack","hs-legext","hs-seatcurl","hs-hipthrust","hs-calf"]]],
  4:[["Oberkörper A",["hs-chest","hs-row","hs-shoulder","hs-pulldown","hs-curl","hs-dip"]],
     ["Unterkörper A",["hs-legpress","hs-legext","hs-seatcurl","hs-hipthrust","hs-calf"]],
     ["Oberkörper B",["hs-incline","hs-lowrow","hs-lat","hs-lateral","hs-reardelt","hs-triext"]],
     ["Unterkörper B",["hs-vsquat","hs-isolegpress","hs-kneelcurl","hs-hipthrust","hs-seatcalf","hs-ab"]]]
};

const KEY = "trainingsplan-v2";
const uid = () => Math.random().toString(36).slice(2, 10);
const STEPS = [1.25, 2.5, 5, 10];
const SMALL = new Set(["schultern", "bizeps", "trizeps"]);
/* ---------- Laden, Bereinigen, Speichern ---------- */
function blank() { return { v: 6, plan: null, custom: [], dev: {}, notes: {}, history: [], weights: [], session: null, selDay: null, hints: {}, timeplan: null }; }
const isObj = o => !!o && typeof o === "object" && !Array.isArray(o);
const clampInt = (v, lo, hi, def) => { const n = Math.round(+v); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : def; };
const kgOrNull = v => { const n = typeof v === "number" ? v : (v === null || v === undefined || String(v).trim() === "" ? null : +String(v).replace(",", ".")); return n === null || !Number.isFinite(n) || n < 0 || n > 1000 ? null : Math.round(n * 100) / 100; };
// Gültiger Arbeitssatz = Gewicht > 0 und mindestens 1 Wiederholung
const validSet = s => !!s && typeof s.kg === "number" && s.kg > 0 && Number.isInteger(s.reps) && s.reps >= 1;

// Gerät aus Bibliothek/eigenem Gerät + persönlichen Anpassungen (reine Funktion, auch beim Laden nutzbar)
function devFrom(s, id) {
  const b = LIB.find(e => e.id === id) || (s.custom || []).find(e => e.id === id) || { id, name: "Unbekanntes Gerät", muscle: "brust", sec: [], type: "plate" };
  const d = Object.assign({ sec: [] }, b, (s.dev || {})[id] || {});
  d.base = b;
  if (d.type === "stack") d.load = "total";
  else if (d.load !== "side" && d.load !== "total") d.load = /Iso-Lateral/.test(b.name) ? "side" : "total";
  if (!(d.step > 0)) d.step = d.type === "stack" ? 5 : d.load === "side" ? (SMALL.has(d.muscle) ? 1.25 : 2.5) : 5;
  d.sec = (d.sec || []).filter(m => MUSCLES[m] && m !== d.muscle);
  d.pattern = PATTERNS[d.pattern] ? d.pattern : null;
  d.fav = d.fav === true;
  return d;
}
// Einheit: s = Scheiben pro Seite, t = Scheiben insgesamt, b = Steckgewicht am Block
const unitOf = d => d.type === "stack" ? "b" : d.load === "side" ? "s" : "t";

function normalize(raw) {
  const s = blank();
  if (!isObj(raw)) return s;
  s.custom = Array.isArray(raw.custom) ? raw.custom.filter(c => isObj(c) && c.id && c.name).map(c => ({
    id: String(c.id), name: String(c.name).slice(0, 80), muscle: MUSCLES[c.muscle] ? c.muscle : "brust",
    sec: Array.isArray(c.sec) ? c.sec.filter(m => MUSCLES[m]) : [], type: c.type === "stack" ? "stack" : "plate",
    pattern: PATTERNS[c.pattern] ? c.pattern : null })) : [];
  if (isObj(raw.dev)) for (const [id, o] of Object.entries(raw.dev)) {
    if (!isObj(o)) continue;
    const d = {};
    if (typeof o.name === "string" && o.name.trim()) d.name = o.name.trim().slice(0, 80);
    if (MUSCLES[o.muscle]) d.muscle = o.muscle;
    if (Array.isArray(o.sec)) d.sec = o.sec.filter(m => MUSCLES[m]);
    if (o.type === "plate" || o.type === "stack") d.type = o.type;
    if (o.load === "side" || o.load === "total") d.load = o.load;
    if (+o.step > 0 && +o.step <= 50) d.step = +o.step;
    if (o.off === true) d.off = true;
    if (o.fav === true) d.fav = true;                 // unabhängig von „im Studio“
    s.dev[id] = d;
  }
  if (isObj(raw.notes)) for (const [id, v] of Object.entries(raw.notes)) if (typeof v === "string" && v.trim()) s.notes[id] = v.slice(0, 120);
  if (isObj(raw.plan) && Array.isArray(raw.plan.days)) s.plan = {
    goal: GOALS[raw.plan.goal] ? raw.plan.goal : "aufbau",
    level: raw.plan.level === "fortgeschritten" ? "fortgeschritten" : "einsteiger",
    minutes: clampInt(raw.plan.minutes, 0, 300, 0) || null,
    days: raw.plan.days.filter(d => isObj(d) && Array.isArray(d.items)).map(d => ({
      id: String(d.id || uid()), name: String(d.name || "Trainingstag").slice(0, 60),
      items: d.items.filter(i => isObj(i) && i.exId).map(i => { const rmin = clampInt(i.rmin, 1, 50, 8);
        return { id: String(i.id || uid()), exId: String(i.exId), sets: clampInt(i.sets, 1, 10, 3), rmin,
          rmax: Math.max(rmin, clampInt(i.rmax, 1, 50, rmin)), rest: clampInt(i.rest, 0, 600, 90) }; }) })),
    gaps: Array.isArray(raw.plan.gaps) ? raw.plan.gaps.filter(isObj).map(g => ({ day: String(g.day || ""), name: String(g.name || ""), pattern: PATTERNS[g.pattern] ? g.pattern : null })) : [] };
  // RIR: nur übernehmen, wenn wirklich angegeben (0–4, 4 = 4+); fehlende Werte bleiben leer
  const cleanSet = t => { const o = { kg: kgOrNull(t.kg), reps: clampInt(t.reps, 0, 999, 0) }; if (["l", "m", "h"].includes(t.f)) o.f = t.f;
    if (Number.isInteger(t.rir) && t.rir >= 0 && t.rir <= 4) o.rir = t.rir; return o; };
  // Verlauf: nichts verwerfen, nur Typen absichern; fehlende Einheit einmalig aus dem damaligen Gerät festschreiben
  s.history = Array.isArray(raw.history) ? raw.history.filter(h => isObj(h) && Array.isArray(h.exercises)).map(h => ({
    id: String(h.id || uid()), dayId: h.dayId ? String(h.dayId) : null, day: String(h.day || "Training"),
    date: isNaN(new Date(h.date)) ? new Date().toISOString() : new Date(h.date).toISOString(),
    durationSec: clampInt(h.durationSec, 0, 86400, 0), adj: +h.adj > 0 ? clampInt(h.adj, 1, 300, 30) : undefined,
    exercises: h.exercises.filter(x => isObj(x) && x.exId).map(x => ({
      exId: String(x.exId), name: String(x.name || devFrom(s, String(x.exId)).name),
      u: ["s", "t", "b"].includes(x.u) ? x.u : unitOf(devFrom(s, String(x.exId))),
      planned: Number.isInteger(x.planned) && x.planned >= 1 && x.planned <= 20 ? x.planned : undefined,
      rmin: Number.isInteger(x.rmin) && x.rmin >= 1 ? x.rmin : undefined, rmax: Number.isInteger(x.rmax) && x.rmax >= 1 ? x.rmax : undefined,
      sets: Array.isArray(x.sets) ? x.sets.filter(isObj).map(cleanSet) : [] })) })) : [];
  s.weights = Array.isArray(raw.weights) ? raw.weights.filter(w => isObj(w) && /^\d{4}-\d{2}-\d{2}$/.test(w.d) && +w.kg >= 30 && +w.kg <= 300).map(w => ({ d: w.d, kg: +w.kg })) : [];
  if (isObj(raw.session) && Array.isArray(raw.session.list) && raw.session.list.length) {
    const r = raw.session;
    const list = r.list.filter(x => isObj(x) && x.exId && Array.isArray(x.sets) && x.sets.length).map(x => ({
      key: String(x.key || uid()), itemId: x.itemId ? String(x.itemId) : null, exId: String(x.exId),
      rmin: clampInt(x.rmin, 1, 50, 8), rmax: clampInt(x.rmax, 1, 50, 12), rest: clampInt(x.rest, 0, 600, 90),
      u: ["s", "t", "b"].includes(x.u) ? x.u : unitOf(devFrom(s, String(x.exId))),
      mode: ["up", "down", "hold", "keep"].includes(x.mode) ? x.mode : "keep", why: String(x.why || ""),
      sets: x.sets.filter(isObj).map(t => Object.assign(cleanSet(t), { done: !!t.done })),
      trim: Array.isArray(x.trim) ? x.trim.filter(isObj).map(t => Object.assign(cleanSet(t), { done: false })) : [],
      ord: Number.isInteger(x.ord) ? x.ord : undefined,
      planned: clampInt(x.planned, 1, 20, x.sets.length + (Array.isArray(x.trim) ? x.trim.length : 0)),
      short: typeof x.short === "string" ? x.short : undefined, recKg: typeof x.recKg === "number" ? x.recKg : undefined,
      rec: Array.isArray(x.rec) ? x.rec.map(v => typeof v === "number" ? v : null) : undefined }));
    const hiddenRaw = Array.isArray(r.timeHidden) ? r.timeHidden : [];
    const timeHidden = hiddenRaw.filter(x => isObj(x) && x.exId && Array.isArray(x.sets) && x.sets.length).map(x => ({
      key: String(x.key || uid()), itemId: x.itemId ? String(x.itemId) : null, exId: String(x.exId),
      rmin: clampInt(x.rmin, 1, 50, 8), rmax: clampInt(x.rmax, 1, 50, 12), rest: clampInt(x.rest, 0, 600, 90),
      u: ["s", "t", "b"].includes(x.u) ? x.u : unitOf(devFrom(s, String(x.exId))),
      mode: ["up", "down", "hold", "keep"].includes(x.mode) ? x.mode : "keep", why: String(x.why || ""),
      sets: x.sets.filter(isObj).map(t => Object.assign(cleanSet(t), { done: false })), trim: [], ord: Number.isInteger(x.ord) ? x.ord : undefined,
      planned: clampInt(x.planned, 1, 20, x.sets.length), short: typeof x.short === "string" ? x.short : undefined,
      rec: Array.isArray(x.rec) ? x.rec.map(v => typeof v === "number" ? v : null) : undefined }));

function figure(colors, label) {

function workoutColors(items) {
  const c = {};
  items.forEach(it => { const e = ex(it.exId); e.sec.forEach(m => { if (!c[m]) c[m] = "var(--accent-soft)"; }); });
  items.forEach(it => { c[ex(it.exId).muscle] = "var(--accent)"; });

function recovery() {
  const now = Date.now(), r = {};
  for (const m in MUSCLES) r[m] = 100;
  state.history.forEach(h => {
    const hrs = (now - new Date(h.date).getTime()) / 36e5;
    h.exercises.forEach(x => {
      const e = ex(x.exId);
      const apply = (m, full) => { r[m] = Math.min(r[m], Math.max(0, Math.min(100, hrs / full * 100))); };
      apply(e.muscle, 72); e.sec.forEach(m => apply(m, 48));
    });
  });
  return r;
}

function progShort(x, e, si) {

function weekStreak(monday, goal) {
  const counts = {};
  state.history.forEach(h => { const d = new Date(h.date); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); counts[d.getTime()] = (counts[d.getTime()] || 0) + 1; });
  let n = 0; const w = new Date(monday);
  if ((counts[w.getTime()] || 0) >= goal) n++; // laufende Woche zählt nur, wenn schon erreicht
  for (;;) { w.setDate(w.getDate() - 7); if ((counts[w.getTime()] || 0) >= goal) n++; else break; }
  return n;
}

/* ================= Progression 2.0 ================= */
// Vergleichbare Einheiten an einem Gerät: gleiche Gewichtsangabe, nur gültige Arbeitssätze (alt → neu).
// Gespeicherte Planung (planned, rmin, rmax) wird genutzt, wenn vorhanden; ältere Einträge haben sie nicht.
function compSessions(exId, u = unitOf(ex(exId))) {
  const out = [];
  state.history.forEach(h => {
    const x = h.exercises.find(e => e.exId === exId && e.u === u); if (!x) return;
    const v = x.sets.filter(validSet); if (!v.length) return;
    const kgs = [...new Set(v.map(t => t.kg))];
    out.push({ date: new Date(h.date).getTime(), sets: v, planned: x.planned || null, rmin: x.rmin || null, rmax: x.rmax || null,
      uniform: kgs.length === 1, kg: kgs.length === 1 ? kgs[0] : null, adj: !!h.adj });
  });
  return out;
}
const rirTxt = r => r >= 4 ? "4+" : String(r);
const avgReps = s => s.sets.reduce((a, t) => a + t.reps, 0) / s.sets.length;
// Regeln (in dieser Reihenfolge, immer mit Begründung aus den echten Daten):
// 1. Wiederholungsbereich seit letztem Mal geändert → Gewicht halten
// 2. Unterschiedliche Gewichte in den Sätzen → satzweise übernehmen, keine pauschale Steigerung
// 3. Letzte Einheit unvollständig (weniger Sätze als geplant) → halten; Steigerung nur, wenn die Einheit davor
//    vollständig am oberen Ziel war
// 4. Letzter Satz schwer oder RIR 0 → keine Steigerung; Reduktion nur bei zwei Einheiten in Folge unter dem Ziel
// 5. Heute mehr Sätze geplant als zuletzt gemacht → halten
// 6. Alle Sätze am oberen Ziel → +1 Schritt
// 7. Alle Sätze „leicht“ oder RIR ≥ 3 und mindestens am unteren Ziel → +1 Schritt
// 8. Alle Sätze unter dem Ziel → halten; erst beim zweiten Mal in Folge −1 Schritt
// 9. Sonst Gewicht halten, Ziel je 1 Wiederholung mehr
function makeEntry(it, ctx) {
  const e = ex(it.exId), u = unitOf(e), unit = UNIT[u], step = e.step, n = it.sets;

  const row = (a, kind) => { const e = a.e, lp = lastPerf(e.id);

  return `${sheetHead(`${esc(cur.name)} besetzt?`, "Abbrechen")}
    <div class="seg"><button data-a="swapMode" data-v="0" class="${swapPerm ? "" : "on"}">Nur heute</button><button data-a="swapMode" data-v="1" class="${swapPerm ? "on" : ""}">Auch im Plan</button></div>

      : `<p class="small muted" id="swapNoDirect">Für ${cur.pattern ? "„" + PATTERNS[cur.pattern].label + "“" : "dieses Gerät"} gibt es in deinem Studio keine direkte Alternative.</p>`}</div>

    ${!direct.length && !other.length ? `<p class="small muted">Kein anderes verfügbares Gerät für ${MUSCLES[cur.muscle]}. Überspringe die Übung über „Übungen“.</p>` : ""}`;
}
let rirTarget = null;

/* ================= Verlauf ================= */
function vHistory() {
  const H = state.history;
  const now = new Date(); const dow = (now.getDay() + 6) % 7;
  const mon = new Date(now); mon.setHours(0, 0, 0, 0); mon.setDate(now.getDate() - dow);
  const weeks = Array.from({ length: 8 }, (_, k) => { const s = new Date(mon); s.setDate(mon.getDate() - (7 - k) * 7); const e = new Date(s); e.setDate(s.getDate() + 7);
    const inW = H.filter(h => { const d = new Date(h.date); return d >= s && d < e; });
    const vol = inW.reduce((a, h) => a + h.exercises.reduce((b, x) => b + x.sets.reduce((c, t) => c + setVol(x, t), 0), 0), 0);
    return { s, vol, n: inW.length }; });
  const max = Math.max(...weeks.map(w => w.vol), 1), maxN = Math.max(...weeks.map(w => w.n), 1);
  const goalKey = state.plan?.goal || "aufbau";
  const [tmin, tmax] = goalKey === "aufbau" ? [10, 20] : [6, 12];
  const ms = {}; for (const m in MUSCLES) ms[m] = 0;
  H.filter(h => new Date(h.date) >= mon).forEach(h => h.exercises.forEach(x => { const e = ex(x.exId); ms[e.muscle] += x.sets.length; e.sec.forEach(m => ms[m] += x.sets.length / 2); }));
  const scale = tmax * 1.3;
  const muscleRows = Object.entries(MUSCLES).map(([m, l]) => { const v = ms[m];
    const col = v >= tmin && v <= tmax ? "var(--ok)" : v > tmax ? "var(--warn)" : "var(--accent)";
    return `<div class="mrow"><span class="small">${l}</span>
      <div class="mtrack"><div class="mband" style="left:${tmin / scale * 100}%;width:${(tmax - tmin) / scale * 100}%"></div>
        <div class="mfill" style="width:${Math.min(100, v / scale * 100)}%;background:${col}"></div></div>
      <span class="small num" style="font-size:15px;text-align:right">${String(Math.round(v * 2) / 2).replace(".", ",")}</span></div>`; }).join("");
  // Bestwerte je Gerät UND Gewichtsangabe; Verlauf der besten Sätze je Training für Kraftentwicklung
  const best = {}, series = {};
  H.forEach(h => h.exercises.forEach(x => { const k = x.exId + "|" + x.u, v = x.sets.filter(validSet);
    v.forEach(t => { if (!best[k] || t.kg > best[k].kg) best[k] = { id: x.exId, u: x.u, kg: t.kg, reps: t.reps, name: ex(x.exId).name, lastAt: 0 }; });
    if (v.length) { (series[k] = series[k] || []).push(Math.max(...v.map(t => t.kg))); best[k].lastAt = new Date(h.date).getTime(); } }));
  const bestList = Object.entries(best).sort((a, b) => b[1].lastAt - a[1].lastAt).slice(0, 8);
  const spark = arr => { if (arr.length < 2) return `<svg class="spark" viewBox="0 0 72 28" aria-hidden="true"><circle cx="36" cy="14" r="3" fill="var(--accent)"/></svg>`;
    const p = arr.slice(-8), lo = Math.min(...p), hi = Math.max(...p), span = hi - lo || 1;
    const pts = p.map((v, i) => `${(i / (p.length - 1) * 68 + 2).toFixed(1)},${(24 - (v - lo) / span * 20).toFixed(1)}`);
    return `<svg class="spark" viewBox="0 0 72 28" aria-hidden="true"><polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1).split(",")[0]}" cy="${pts.at(-1).split(",")[1]}" r="2.6" fill="var(--accent)"/></svg>`; };
  // Kalender
  const cm = new Date(now.getFullYear(), now.getMonth() + calOffset, 1);
  const trained = {};
  H.forEach(h => { const d = new Date(h.date); if (d.getFullYear() === cm.getFullYear() && d.getMonth() === cm.getMonth()) trained[d.getDate()] = h.day; });
  const lead = (cm.getDay() + 6) % 7, daysIn = new Date(cm.getFullYear(), cm.getMonth() + 1, 0).getDate();
  const isThisMonth = cm.getFullYear() === now.getFullYear() && cm.getMonth() === now.getMonth();
  const cal = `<div class="cal">${["M", "D", "M", "D", "F", "S", "S"].map(n => `<div class="d">${n}</div>`).join("")}
    ${Array.from({ length: lead }, () => "<div></div>").join("")}
    ${Array.from({ length: daysIn }, (_, i) => `<div class="d"><div class="dot ${trained[i + 1] ? "done" : ""} ${isThisMonth && i + 1 === now.getDate() ? "today" : ""}" ${trained[i + 1] ? `title="${esc(trained[i + 1])}"` : ""}>${i + 1}</div></div>`).join("")}</div>`;
  const monthCount = Object.keys(trained).length;
  const four = Date.now() - 28 * 864e5;
  const perWeek = H.filter(h => new Date(h.date).getTime() >= four).length / 4;
  const disc = (id, title, meta, body, open) => `<details class="disc" id="${id}" ${open ? "open" : ""}><summary><div class="grow"><h3>${title}</h3>${meta ? `<div class="small muted">${meta}</div>` : ""}</div><span class="chev">›</span></summary><div class="body">${body}</div></details>`;
  const W = (state.weights || []).slice().sort((a, b) => a.d.localeCompare(b.d)), lastW = W[W.length - 1];

  $app.innerHTML = `<div class="page">
    <div class="head"><div class="cap">${H.length} ${H.length === 1 ? "Training" : "Trainings"} insgesamt</div><div class="title">Verlauf</div></div>
    ${H.length ? `
    <section class="section">
      <div class="section-head"><h2>Häufigkeit</h2><span class="small muted">${monthCount} ${monthCount === 1 ? "Tag" : "Tage"} im ${cm.toLocaleDateString("de-DE", { month: "long" })}</span></div>
      <div class="kpi"><span class="num">${String(Math.round(perWeek * 10) / 10).replace(".", ",")}</span><span class="sub">Trainings pro Woche · letzte 4 Wochen</span></div>
      <div class="bars">${weeks.map((w, i) => `<div class="b ${w.n ? "" : "zero"} ${i === 7 ? "cur" : ""}" style="height:${w.n ? Math.max(8, w.n / maxN * 100) : 4}%" title="${w.n} Trainings"></div>`).join("")}</div>
      <div class="bars-x">${weeks.map((w, i) => `<span>${i === 7 ? "Jetzt" : w.s.getDate() + "." + (w.s.getMonth() + 1) + "."}</span>`).join("")}</div>
    </section>
    <section class="section">
      <div class="section-head"><h2>Kraft & Bestwerte</h2><span class="small muted">Antippen für Details</span></div>
      <div class="group">${bestList.map(([k, b]) => { const sr = series[k] || [], dlt = sr.length > 1 ? sr[sr.length - 1] - sr[0] : 0;
        return `<button class="li" data-a="showEx" data-id="${b.id}" data-u="${b.u}">
          <div class="grow"><div class="t ellipsis">${esc(b.name)}</div><div class="s">${kgTxt(b.kg)} kg ${UNIT_SHORT[b.u]} × ${b.reps}</div></div>
          ${spark(sr)}<span class="delta ${dlt > 0 ? "" : "zero"}">${dlt > 0 ? "+" + kgTxt(dlt) : "±0"}</span></button>`; }).join("")}</div>
    </section>` : `<p class="muted">Noch keine Trainings. Nach deinem ersten Training siehst du hier Häufigkeit, Kraftentwicklung und Bestwerte.</p>`}
    <div>
      ${disc("discWeight", "Körpergewicht", lastW ? `${kgTxt(lastW.kg)} kg` : "Noch nicht eingetragen", weightCard(), false)}
      ${disc("discVol", "Trainingsvolumen", `max. ${max >= 1000 ? (max / 1000).toFixed(1).replace(".", ",") + " t" : Math.round(max) + " kg"} pro Woche`,
        `<div class="bars">${weeks.map(w => `<div class="b ${w.vol ? "" : "zero"}" style="height:${w.vol ? Math.max(4, w.vol / max * 100) : 4}%" title="${Math.round(w.vol)} kg"></div>`).join("")}</div>
         <div class="bars-x">${weeks.map((w, i) => `<span>${i === 7 ? "Jetzt" : w.s.getDate() + "." + (w.s.getMonth() + 1) + "."}</span>`).join("")}</div>
         <p class="small faint">Gewicht × Wiederholungen, bei „pro Seite“ beide Seiten.</p>`, false)}
      ${disc("discMuscle", "Muskelbelastung", `Sätze diese Woche · Ziel ${tmin}–${tmax}`,
        `<div class="mlist">${muscleRows}</div><p class="small faint">Der helle Bereich zeigt die empfohlenen Sätze für ${(GOALS[goalKey] || GOALS.aufbau).label}. Mittrainierte Muskeln zählen halb.</p>`, false)}
      ${disc("discCal", "Kalender", `${monthCount} ${monthCount === 1 ? "Trainingstag" : "Trainingstage"} · Ø ${String(Math.round(perWeek * 10) / 10).replace(".", ",")} pro Woche (letzte 4 Wochen)`,
        `<div class="row between"><button class="icon-btn" data-a="calMonth" data-d="-1" aria-label="Voriger Monat">‹</button>
          <h3>${cm.toLocaleDateString("de-DE", { month: "long", year: "numeric" })}</h3>
          <button class="icon-btn" data-a="calMonth" data-d="1" aria-label="Nächster Monat" ${calOffset >= 0 ? "disabled" : ""}>›</button></div>${cal}`, calOffset !== 0)}
      ${H.length ? disc("discLog", "Letzte Trainings", `${Math.min(30, H.length)} Einträge`,
        `<div class="plain-list">${[...H].reverse().slice(0, 30).map(h => `<div class="li" style="align-items:flex-start"><div class="grow">
          <div class="row between"><span class="t">${esc(h.day)}</span><span class="small faint">${new Date(h.date).toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" })} · ${Math.max(1, Math.round((h.durationSec || 0) / 60))} min</span></div>
          <div class="s">${h.exercises.map(x => { const v = x.sets.filter(validSet); return esc(x.name) + (v.length ? " " + kgTxt(Math.max(...v.map(t => t.kg))) + " kg " + UNIT_SHORT[x.u] : ""); }).join(" · ")}</div></div></div>`).join("")}</div>`, false) : ""}
    </div>
  </div>`;
}

let calOffset = 0;
function weightCard() {
  const W = (state.weights || []).slice().sort((a, b) => a.d.localeCompare(b.d));
  const today = new Date().toISOString().slice(0, 10);
  const todayEntry = W.find(w => w.d === today);
  const last = W[W.length - 1];
  const since = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
  const base = W.find(w => w.d >= since);
  const diff = last && base && last !== base ? Math.round((last.kg - base.kg) * 10) / 10 : null;
  let chart = "";
  const pts = W.slice(-30);
  if (pts.length >= 2) {
    const w = 320, h = 104, pl = 34, pr = 8, pt = 10, pb = 28;
    let lo = Math.min(...pts.map(p => p.kg)), hi = Math.max(...pts.map(p => p.kg));
    if (hi - lo < 1) { lo -= .5; hi += .5; }
    const t0 = new Date(pts[0].d).getTime(), t1 = new Date(pts[pts.length - 1].d).getTime() || t0 + 1;
    const X = p => pl + (new Date(p.d).getTime() - t0) / Math.max(1, t1 - t0) * (w - pl - pr);
    const Y = v => pt + (hi - v) / (hi - lo) * (h - pt - pb);
    const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p).toFixed(1)},${Y(p.kg).toFixed(1)}`).join("");
    const dl = s => { const d = new Date(s); return d.getDate() + "." + (d.getMonth() + 1) + "."; };
    chart = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Körpergewicht der letzten Einträge">
      <line x1="${pl}" x2="${w - pr}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--hair)"/>
      <line x1="${pl}" x2="${w - pr}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--hair)"/>
      <text x="${pl - 6}" y="${Y(hi) + 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${kgTxt(Math.round(hi * 10) / 10)}</text>
      <text x="${pl - 6}" y="${Y(lo) + 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${kgTxt(Math.round(lo * 10) / 10)}</text>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(pts[pts.length - 1])}" cy="${Y(pts[pts.length - 1].kg)}" r="4.5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>
      <text x="${pl}" y="${h - 4}" font-size="11" fill="var(--text-3)">${dl(pts[0].d)}</text>
      <text x="${w - pr}" y="${h - 4}" text-anchor="end" font-size="11" fill="var(--text-3)">${dl(pts[pts.length - 1].d)}</text></svg>`;
  }
  return `<div class="stack">
    ${last ? `<div class="kpi"><span class="num" style="font-size:44px">${kgTxt(last.kg)}</span><span class="sub">kg${diff !== null ? ` · ${diff > 0 ? "+" : ""}${kgTxt(diff)} kg in 30 Tagen` : ""}</span></div>` : `<p class="small muted">Trag dein Gewicht ein, z. B. einmal pro Woche morgens.</p>`}
    ${chart}
    <div class="row"><input id="bwIn" class="grow" inputmode="decimal" enterkeyhint="done" placeholder="${todayEntry ? "Heute: " + kgTxt(todayEntry.kg) + " kg" : "Gewicht heute in kg"}" aria-label="Körpergewicht in kg" autocomplete="off">
      <button class="btn primary" data-a="addWeight">${todayEntry ? "Ändern" : "Eintragen"}</button></div>
    <p class="error" id="bwErr" hidden>Bitte eine Zahl zwischen 30 und 300 eingeben.</p>
  </div>`;
}

function exChart(exId, u = unitOf(ex(exId))) {
  const all = state.history.map(h => { const x = h.exercises.find(e => e.exId === exId); if (!x) return null;
    const v = x.sets.filter(validSet); return v.length ? { d: new Date(h.date), kg: Math.max(...v.map(t => t.kg)), sets: v, u: x.u } : null; }).filter(Boolean);
  const other = all.filter(p => p.u !== u).length;
  const pts = all.filter(p => p.u === u).slice(-12);
  const name = ex(exId).name;
  const otherNote = other ? `<p class="small faint">${other} ${other === 1 ? "Eintrag" : "Einträge"} mit anderer Gewichtsangabe ausgeblendet, damit nichts Ungleiches verglichen wird.</p>` : "";
  if (!pts.length) return `${sheetHead(esc(name), "Schließen")}<p class="muted">Noch keine Daten mit „${UNIT[u]}“.</p>${otherNote}`;
  const W = 320, H = 150, pl = 36, pr = 12, pt = 14, pb = 26;
  let lo = Math.min(...pts.map(p => p.kg)), hi = Math.max(...pts.map(p => p.kg));
  if (hi === lo) { lo = Math.max(0, lo - 5); hi = hi + 5; }
  const X = i => pts.length === 1 ? (pl + W - pr) / 2 : pl + i * (W - pl - pr) / (pts.length - 1);
  const Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.kg).toFixed(1)}`).join("");
  const area = line + `L${X(pts.length - 1).toFixed(1)},${H - pb}L${X(0).toFixed(1)},${H - pb}Z`;
  const first = pts[0].kg, lastP = pts[pts.length - 1];
  const diff = lastP.kg - first;
  const dl = d => d.getDate() + "." + (d.getMonth() + 1) + ".";
  return `${sheetHead(esc(name), "Schließen")}
    <div class="grid3">
      <div class="stat"><div class="cap">Aktuell</div><div class="num">${kgTxt(lastP.kg)}<span class="small muted"> kg</span></div><div class="small faint">${UNIT_SHORT[u]} · ${lastP.sets.map(t => t.reps).join("/")} Wdh.</div></div>
      <div class="stat"><div class="cap">Seit Beginn</div><div class="num" style="color:${diff > 0 ? "var(--ok)" : "var(--text)"}">${diff > 0 ? "+" : ""}${kgTxt(diff)}<span class="small muted"> kg</span></div></div>
      <div class="stat"><div class="cap">1RM geschätzt</div><div class="num">≈${kgTxt(Math.round(Math.max(...lastP.sets.map(e1rm)) * 2) / 2)}<span class="small muted"> kg</span></div><div class="small faint">Näherung</div></div>
    </div>
    ${(() => { const pl = plateau(exId); return pl ? `<p class="small" style="color:var(--warn)" id="plateauChart">${esc(plateauTxt(pl))}</p>` : ""; })()}${otherNote}
    <p class="small faint">1RM nach Epley aus deinen Sätzen geschätzt. An Maschinen nur eine grobe Näherung.</p>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Gewichtsverlauf ${esc(name)}">

let timer = null;
function tick() {
  const s = S(); if (!s) return stopTick();
  const el = byId("elapsed"); if (el) el.textContent = fmtTime((Date.now() - s.start) / 1000);
  if (s.phase !== "rest") return;
  const left = (s.restEnd - Date.now()) / 1000;
  const t = byId("timer"); if (t) t.textContent = fmtTime(left);
  const arc = byId("ringArc"); if (arc) { const C = 2 * Math.PI * 54; arc.setAttribute("stroke-dashoffset", C * (1 - Math.max(0, s.restTotal ? left / s.restTotal : 0))); }
  const sec = Math.ceil(left);
  if (sec <= 3 && sec >= 1 && s.beeped !== sec) { s.beeped = sec; tone(660, .12); }
  if (left <= 0) { tone(990, .45); buzz([200, 100, 200]); endRest(); }
